<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1B1F4B">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Game Night">
<title>Forehead Mask</title>
<link rel="stylesheet" href="/festival.css">
<style>
:root{
  --cloth:#2B8C82; --on-cloth:#F3EBDD;
  --line2:var(--line-2); --glass:color-mix(in srgb,var(--night-2) 92%,transparent);
  --glass2:rgba(243,235,221,.07); --amber:var(--gold); --mint:var(--shrine);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;overflow-x:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.muted{color:var(--muted)}
.noren{background:var(--cloth);color:var(--on-cloth)}
.noren .th-btn,.noren .iconbtn,.noren .rb-btn{border-color:rgba(243,235,221,.35)}
.code{font-weight:700;font-size:14px;letter-spacing:.16em;border:1.5px solid currentColor;border-radius:999px;padding:1px 10px;opacity:.9}
.timer{font-weight:700;font-size:16px;font-variant-numeric:tabular-nums;border-radius:999px;padding:3px 12px;background:var(--ink);color:var(--paper)}

.stage{width:min(860px,100%);margin:0 auto;padding:8px max(14px,env(safe-area-inset-left,0px)) calc(120px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-right,0px))}
.eyebrow{text-align:center;font-size:15px;font-weight:700;color:var(--amber)}
.title{font-size:clamp(30px,7.5vw,50px);line-height:1.08;text-align:center;margin-top:4px}
.sub{text-align:center;color:var(--muted);margin:8px auto 0;max-width:54ch}
.panel{background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:14px;backdrop-filter:blur(10px)}
.panel h2{font-size:24px}
.btn{border:1px solid var(--line2);background:var(--glass2);border-radius:999px;padding:11px 20px;font-weight:700;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.primary{background:var(--lantern);border-color:var(--lantern);color:var(--on-lantern)}
.btn.paper{background:var(--paper);border-color:var(--paper);color:var(--ink)}
.btn.small{padding:6px 13px;font-size:13px}
.btn.wide{width:100%}
label{display:block;font-size:14px;font-weight:700;color:var(--muted);margin-bottom:6px}
input[type=text],select{width:100%;background:var(--night);border:1px solid var(--line);border-radius:10px;padding:11px 13px;outline:none;color:var(--fg);font-size:16px}
input[type=text]:focus,select:focus{border-color:var(--amber)}
select option{background:var(--night)}
.err{color:var(--danger);font-size:14px;min-height:1.3em}
.hint{font-size:13px;color:var(--muted);margin:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.row2{grid-template-columns:1fr}}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button,.chips button{border:1px solid var(--line);background:rgba(0,0,0,.25);border-radius:12px;padding:10px;text-align:left;display:grid;gap:2px}
.seg button small{color:var(--muted);font-size:12px}
.seg button.on,.chips button.on{border-color:var(--amber);background:rgba(217,164,65,.14)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chips button{border-radius:999px;padding:6px 13px;font-weight:700;font-size:13px;display:inline-block}
.chips button.on{color:var(--amber)}

.face{width:44px;height:44px;border-radius:50%;overflow:hidden;display:grid;place-items:center;font-weight:900;color:var(--ink);flex:none}
.face img,.mini img{width:100%;height:100%;object-fit:cover;object-position:50% 20%;display:block}
.mini{width:24px;height:24px;border-radius:50%;overflow:hidden;display:inline-grid;place-items:center;font-size:11px;font-weight:900;color:var(--ink);border:1.5px solid var(--night);flex:none}
.photo-pick{display:flex;align-items:center;gap:14px}
.photo-pick .face{width:64px;height:64px;border:3px dashed var(--line2);background:rgba(0,0,0,.3);font-size:12px;color:var(--muted)}
.ring{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px;margin-top:12px}
.tok{display:grid;justify-items:center;gap:4px}
.tok .face{width:62px;height:62px;border:3px solid rgba(255,255,255,.18);font-size:22px}
.tok .nm{font-weight:800;font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* forehead identity cards */
.masks{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin:14px 0}
.mcard{background:var(--paper);color:var(--ink);border-radius:16px;overflow:hidden;display:grid;border:3px solid transparent;box-shadow:0 16px 34px -16px #000}
.mcard.turn{border-color:var(--amber);box-shadow:0 0 26px -6px var(--amber)}
.mcard.solved{border-color:#22C55E}
.mcard.secret{background:linear-gradient(155deg,#2B8C82,#18494A);color:var(--paper);border-color:var(--amber)}
.mcard .head{display:flex;align-items:center;gap:7px;padding:8px 10px;background:rgba(0,0,0,.08);font-weight:800;font-size:13px}
.mcard.secret .head{background:rgba(0,0,0,.22)}
.mcard .head span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.mcard .idbox{padding:12px 10px;text-align:center;display:grid;gap:6px;justify-items:center;align-content:center;min-height:142px}
.mcard .idbox img{width:88px;height:88px;border-radius:50%;object-fit:cover;object-position:50% 20%;border:3px solid #fff;box-shadow:0 6px 16px rgba(0,0,0,.25)}
.mcard .idbox b{font-family:var(--display);font-size:20px;line-height:1.15;overflow-wrap:anywhere}
.mcard .idbox small{font-size:12px;opacity:.75}
.mcard .mystery{font-size:48px;line-height:1}

.qstage{background:var(--glass);border:1.5px solid var(--amber);border-radius:16px;padding:16px;display:grid;gap:12px;margin-top:12px}
.qstage .qtxt{font-family:var(--display);font-size:clamp(20px,5vw,28px);line-height:1.2}
.qvotes{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.qvotes button{border:1.5px solid var(--line2);background:rgba(0,0,0,.28);border-radius:999px;padding:7px 16px;font-weight:800;font-size:14px}
.qvotes button.yes.on{background:#22C55E;border-color:#22C55E;color:#140f24}
.qvotes button.no.on{background:#FF5A7A;border-color:#FF5A7A;color:#140f24}
.qvotes button.kinda.on{background:var(--amber);border-color:var(--amber);color:#140f24}
.qform{display:flex;gap:8px;flex-wrap:wrap}
.qform input{flex:1;min-width:180px}
.loglist{display:grid;gap:6px}
.logitem{display:flex;justify-content:space-between;gap:10px;align-items:center;background:rgba(0,0,0,.2);border-radius:10px;padding:7px 12px;font-size:14px}
.scores{display:grid;gap:8px;margin-top:12px}
.srow{display:grid;grid-template-columns:34px 30px 1fr auto;gap:10px;align-items:center;background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-weight:800}
.srow.first{border-color:var(--amber);background:rgba(217,164,65,.14)}
.srow .rk{text-align:center;color:var(--muted)} .srow.first .rk{color:var(--amber)}
.fadeup{animation:fadeup .4s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes fadeup{from{opacity:0;transform:translateY(14px)}}
.hostbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;gap:10px;flex-wrap:wrap;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:var(--night-2);border-top:3px solid var(--gold)}
body.has-hostbar{--chat-lift:66px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:60;background:var(--paper);color:var(--ink);font-weight:700;border-radius:999px;padding:10px 18px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
</style>
</head>
<body>
<header class="top noren">
  <a class="noren-back" href="/" aria-label="Back to all games">&larr; Festival</a>
  <h1>Forehead Mask</h1>
  <button type="button" class="code" id="hCode" title="Copy invite link" aria-label="Copy invite link" hidden></button>
  <span class="spacer"></span>
  <span class="timer" id="timer" hidden></span>
</header>
<main class="stage" id="stage"></main>
<div class="hostbar" id="hostbar" hidden></div>
<div class="toast" id="toast" hidden></div>

<script src="/avatars.js"></script>
<script src="/backguard.js"></script>
<script src="/theme.js"></script>
<script src="/chat.js"></script>
<script src="/pranks.js"></script>
<script src="/roombar.js"></script>
<script src="/howto.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hue = n => { let h=0; for(const c of String(n)) h=(h*31+c.charCodeAt(0))%360; return `hsl(${h} 70% 72%)`; };
function store(k, v){ try{ if(v===undefined) return JSON.parse(localStorage.getItem(k)); localStorage.setItem(k, JSON.stringify(v)); }catch(e){ return null; } }
function toast(m){ const t=$("#toast"); t.textContent=m; t.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>t.hidden=true,2600); }
const buzz = p => { try{ if(navigator.vibrate && navigator.userActivation?.hasBeenActive) navigator.vibrate(p); }catch(e){} };
async function api(path, body){
  const r = await fetch(path, body ? {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)} : {});
  const j = await r.json().catch(()=>({error:"The server didn't answer. Try again."}));
  if(!r.ok) throw new Error(j.error || "Something went wrong");
  return j;
}

let code=null, room=null, me=null, hostKey=null, pollGen=0, clockOffset=0, curView="";
const serverNow = () => Date.now()/1000 + clockOffset;
const act = (a, extra={}) => api(`/api/rooms/${code}/${a}`, {hostKey, ...(me||{}), ...extra});
Chat.mount({act});
Pranks.mount({act});
RoomBar.mount({act, game:"mask", onHostChange:(hk, became)=>{ hostKey = hk; curView = ""; if(became) toast("You are now the host!"); if(room) render(); }});
const P = pid => room.players[pid] || {name:"Someone"};
const picOf = p => { const s = Avatars.src(p); return s ? `<img src="${esc(s)}" alt="">` : esc((p.name||"?")[0].toUpperCase()); };
const face = (pid, cls="mini") => `<span class="${cls}" data-pid="${esc(pid)}" style="background:${hue(P(pid).name)}">${picOf(P(pid))}</span>`;

function home(){
  $("#hCode").hidden = true; $("#timer").hidden = true; $("#hostbar").hidden = true;
  document.body.classList.remove("has-hostbar"); curView="home";
  $("#stage").innerHTML = `<div class="fadeup" style="margin-top:3vh"><div class="eyebrow">The Headbands Stall</div><h1 class="title">Forehead Mask</h1>
    <p class="sub">Everyone sees the secret character stuck to your forehead except YOU. Ask Yes/No questions and unmask yourself first!</p></div>
    <div class="row2 fadeup" style="margin-top:20px">
      <form class="panel" id="createForm"><h2>Host a table</h2>
        <div><label for="cName">Your name</label><input type="text" id="cName" maxlength="24" autocomplete="nickname"></div>
        <div class="err" id="cErr"></div><button class="btn primary wide">Create room</button></form>
      <form class="panel" id="joinForm"><h2>Join with a code</h2>
        <div><label for="jCode">Room code</label><input type="text" id="jCode" maxlength="6" autocomplete="off" style="text-transform:uppercase;letter-spacing:.15em"></div>
        <div><label for="jName">Your name</label><input type="text" id="jName" maxlength="24" autocomplete="nickname"></div>
        <div class="err" id="jErr"></div><button class="btn wide">Join</button></form>
    </div><div class="fadeup">${HowTo.button("mask")}</div>`;
  $("#createForm").onsubmit = async e=>{ e.preventDefault(); const n=$("#cName").value.trim(); if(!n) return $("#cErr").textContent="Enter your name.";
    try{ const r=await api("/api/rooms",{game:"mask",title:"Forehead Mask"}); const m=await api(`/api/rooms/${r.code}/join`,{name:n}); store("mk:"+r.code,{me:m,hostKey:r.hostKey}); history.replaceState({},"","/mask?room="+r.code); openRoom(r.code); }catch(err){ $("#cErr").textContent=err.message; } };
  $("#joinForm").onsubmit = async e=>{ e.preventDefault(); const c=$("#jCode").value.trim().toUpperCase(), n=$("#jName").value.trim(); if(!c||!n) return $("#jErr").textContent="Enter code and name.";
    try{ const m=await api(`/api/rooms/${c}/join`,{name:n}); store("mk:"+c,{me:m,hostKey:null}); history.replaceState({},"","/mask?room="+c); openRoom(c); }catch(err){ $("#jErr").textContent=err.message; } };
}
function openRoom(c){
  code=c; const s=store("mk:"+c)||{}; me=s.me||null; hostKey=s.hostKey||null;
  $("#hCode").textContent=c; $("#hCode").hidden=false; BackGuard.arm(); poll(++pollGen,-1);
}
async function poll(gen, v){
  while(gen === pollGen){
    try{
      const who = (me ? `&pid=${me.pid}&key=${me.key}` : "") + (hostKey ? `&hk=${hostKey}` : "");
      const next = await api(`/api/rooms/${code}?v=${v}${who}`);
      if(gen !== pollGen) return;
      const prev = room; room = next; v = room.version; clockOffset = room.now - Date.now()/1000;
      if(me && !room.players[me.pid]){ me = null; if(!room.roomMeta?.isHost) hostKey = null; store("mk:"+code, {hostKey}); toast("You were removed from this game"); }
      if(me && room.players[me.pid]) Avatars.apply(act, room.players[me.pid]);
      if(!Chat.socialOnly(prev, room)) render();
      Chat.update(room, me); Pranks.update(room, me); RoomBar.update(room, me, hostKey);
    }catch(e){ if(e.message.includes("not found")){ toast("Room not found"); return home(); } await new Promise(r=>setTimeout(r,2000)); }
  }
}

function render(){
  renderHostbar();
  document.body.classList.toggle("has-hostbar", !$("#hostbar").hidden);
  if(!me || !room.players[me.pid]) return gate();
  const ph = room.phase;
  if(ph === "lobby") lobby();
  else if(ph === "starting"){ curView="starting"; $("#stage").innerHTML='<div class="fadeup" style="margin-top:12vh"><h1 class="title">Preparing the masks…</h1></div>'; }
  else if(ph === "assign") assignView();
  else if(ph === "play" || ph === "roundover") playView();
  else finalView();
  tickTimer();
}
function gate(){
  if($("#gate")) return; curView="gate";
  $("#stage").innerHTML=`<form class="panel fadeup" id="gate" style="margin-top:8vh"><h2 style="text-align:center">Join Forehead Mask</h2>
    <input type="text" id="gName" placeholder="Your name" maxlength="24" autocomplete="nickname"><div class="err" id="gErr"></div><button class="btn primary wide">Put on a mask</button></form>`;
  $("#gate").onsubmit = async e=>{ e.preventDefault(); const n=$("#gName").value.trim(); if(!n) return;
    try{ me=await api(`/api/rooms/${code}/join`,{name:n}); store("mk:"+code,{me,hostKey}); curView=""; poll(++pollGen,-1); }catch(err){ $("#gErr").textContent=err.message; } };
}
function lobby(){
  curView="lobby";
  const s=room.settings, ps=Object.keys(room.players), mine=P(me.pid), H=!!hostKey;
  const sel=(id,opts,val)=>`<select id="${id}" ${H?"":"disabled"}>${opts.map(([v,t])=>`<option value="${v}" ${String(v)===String(val)?"selected":""}>${t}</option>`).join("")}</select>`;
  $("#stage").innerHTML=`<div class="fadeup"><h1 class="title">${ps.length} player${ps.length===1?"":"s"}</h1>
    <p class="sub">Share code <b style="letter-spacing:.2em;color:var(--amber)">${room.code}</b>. Best with 3 to 8 friends on Discord VC!</p></div>
    <div class="panel" style="margin-top:14px"><div class="photo-pick"><button class="face" id="photoBtn" type="button">${Avatars.src(mine)?picOf(mine):"Choose"}</button>
      <div><b>${esc(mine.name)}</b><p class="hint">Tap to pick your avatar.</p></div></div></div>
    <div class="ring">${ps.map(pid=>`<div class="tok">${face(pid,"face")}<span class="nm">${esc(P(pid).name)}</span></div>`).join("")}</div>
    <div class="panel" style="margin-top:16px"><h2>${H?"Mask settings":"Settings"}</h2>
      <div><label>Who picks the identities?</label><div class="seg">
        <button type="button" class="${s.assign==="auto"?"on":""}" data-as="auto" ${H?"":"disabled"}><b>Auto / AniList</b><small>Game deals characters or items automatically</small></button>
        <button type="button" class="${s.assign==="friends"?"on":""}" data-as="friends" ${H?"":"disabled"}><b>Friends Pick!</b><small>Secretly write an identity for the player next to you</small></button>
      </div></div>
      ${s.assign==="auto" ? `<div><label>Category</label><div class="chips">${[["anime","Anime (with portraits!)"],["movies","Movies & Games"],["animals","Animals"],["objects","Objects"],["mix","Mix"],["custom","Custom (AI)"]].map(([v,t])=>`<button type="button" class="${s.category===v?"on":""}" data-cat="${v}" ${H?"":"disabled"}>${t}</button>`).join("")}</div></div>
        ${s.category==="custom" ? `<div><label for="sCust">Custom identity theme</label><input type="text" id="sCust" maxlength="160" value="${esc(s.custom)}" ${H?"":"disabled"} placeholder="e.g. Famous YouTubers, Pokemon, Historical figures"></div>` : ""}` : ""}
      <div><label for="sRounds">Rounds</label>${sel("sRounds",[[1,"1 round"],[2,"2 rounds"],[3,"3 rounds"],[5,"5 rounds"]], s.rounds)}</div>
      ${H ? `<button class="btn primary wide" data-host="start" ${ps.length<2?"disabled":""}>${ps.length<2?"Need 1 more player":"Hand out the masks"}</button>` : '<p class="hint" style="text-align:center">Waiting for host to start.</p>'}
    </div>${HowTo.button("mask")}`;
  $("#photoBtn").onclick = ()=>Avatars.open(act);
  if(H){
    const send = x => act("settings", x).catch(err=>toast(err.message));
    document.querySelectorAll("[data-as]").forEach(b=>b.onclick=()=>send({assign:b.dataset.as}));
    document.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>send({category:b.dataset.cat}));
    $("#sRounds").onchange=e=>send({rounds:+e.target.value});
    if($("#sCust")) $("#sCust").onchange=e=>send({custom:e.target.value});
  }
}

function assignView(){
  const t = room.table, target = t.assignTarget;
  const viewKey = `as:${room.round}:${t.assignedDone}`;
  if(curView !== viewKey){
    curView = viewKey;
    $("#stage").innerHTML = `<div class="fadeup" style="max-width:520px;margin:6vh auto 0">
      <div class="eyebrow">Round ${room.round+1} · Secret Assignment</div>
      <h1 class="title">Pick ${esc(P(target).name)}'s mask!</h1>
      <p class="sub">Everyone will see it on ${esc(P(target).name)}'s forehead except them. (${t.assignedCount}/${t.order.length} ready)</p>
      ${t.assignedDone ? '<div class="panel" style="margin-top:16px;text-align:center"><b>Mask sealed!</b><p class="hint">Waiting for everyone else…</p></div>'
        : `<form class="panel" id="asForm" style="margin-top:16px"><input type="text" id="asIn" maxlength="40" autocomplete="off" placeholder="e.g. Goku, Spider-Man, Shrek, Toaster"><button class="btn primary wide">Stick it on their forehead</button></form>`}
    </div>`;
    if($("#asForm")){
      $("#asIn").focus();
      $("#asForm").onsubmit = async e=>{ e.preventDefault(); const nm=$("#asIn").value.trim(); if(!nm) return;
        try{ await act("assign",{name:nm}); buzz(25); }catch(err){ toast(err.message); } };
    }
  }
}

function playView(){
  const t = room.table, ph = room.phase, myTurn = ph === "play" && t.turnPid === me.pid, q = t.question;
  const sig = JSON.stringify([ph, room.round, t.turnPid, t.solved, q, (t.myLog||[]).length, (t.wrongGuesses||[]).length]);
  if(curView === sig) return;
  curView = sig;

  const cards = t.order.map(pid=>{
    const c = t.cards[pid] || {hidden:true}, isMe = pid === me.pid, isSolved = t.solved.includes(pid);
    return `<div class="mcard ${t.turnPid===pid?"turn":""} ${isSolved?"solved":""} ${c.hidden?"secret":""}">
      <div class="head">${face(pid,"mini")}<span>${esc(P(pid).name)}${isMe?" (you)":""}</span>${isSolved?"<span>✓</span>":""}</div>
      <div class="idbox">${c.hidden
        ? `<span class="mystery">🎭</span><b>Who am I?</b><small>Only others can see your mask!</small>`
        : `${c.img?`<img src="${esc(c.img)}" alt="" referrerpolicy="no-referrer">`:""}<b>${esc(c.name)}</b><small>${esc(c.show||"")}</small>`}
      </div></div>`;
  }).join("");

  let stageBox = "";
  if(ph === "play"){
    const votes = q?.votes || {};
    const cnt = k => Object.values(votes).filter(v=>v===k).length;
    const myV = votes[me.pid];
    stageBox = `<div class="qstage">
      ${q ? `<div><small class="hint">${esc(P(q.pid).name)} asks:</small><div class="qtxt">"${esc(q.text)}"</div></div>
        <div class="qvotes">
          ${q.pid !== me.pid && t.order.includes(me.pid) ? `
            <button type="button" class="yes ${myV==="yes"?"on":""}" data-rep="yes">Yes (${cnt("yes")})</button>
            <button type="button" class="no ${myV==="no"?"on":""}" data-rep="no">No (${cnt("no")})</button>
            <button type="button" class="kinda ${myV==="kinda"?"on":""}" data-rep="kinda">Kinda (${cnt("kinda")})</button>`
          : `<span class="hint">Answers so far: <b style="color:#4ADE80">Yes ${cnt("yes")}</b> · <b style="color:#FF8A7A">No ${cnt("no")}</b> · <b style="color:var(--amber)">Kinda ${cnt("kinda")}</b></span>`}
        </div>` : `<p class="hint">${myTurn ? "Ask a Yes/No question (typed or on Discord VC), or try to guess who you are!" : `Waiting for ${esc(P(t.turnPid).name)} to ask a question or guess…`}</p>`}
      ${myTurn ? `
        <form class="qform" id="askForm"><input type="text" id="askIn" maxlength="120" autocomplete="off" placeholder="Ask a Yes/No question… (e.g. Am I from an anime?)"><button class="btn paper small">Ask</button><button type="button" class="btn small" id="voiceAsk">Asked on VC</button></form>
        <form class="qform" id="guessForm"><input type="text" id="guessIn" maxlength="50" autocomplete="off" placeholder="Ready? Guess who you are!"><button class="btn primary small">Guess!</button><button type="button" class="btn small" id="endTurnBtn">End turn</button></form>` : ""}
    </div>`;
  }
  const lastWrong = (t.wrongGuesses||[]).slice(-1)[0];
  const logHtml = (t.myLog||[]).length ? `<div class="panel" style="margin-top:14px"><b>Your Clue Log</b><div class="loglist">${t.myLog.slice().reverse().map(x=>{
    const vs = Object.values(x.votes||{});
    const y=vs.filter(v=>v==="yes").length, n=vs.filter(v=>v==="no").length, k=vs.filter(v=>v==="kinda").length;
    return `<div class="logitem"><span>"${esc(x.text)}"</span><span style="flex:none;font-weight:800;font-size:12px"><b style="color:#4ADE80">Y:${y}</b> <b style="color:#FF8A7A">N:${n}</b> <b style="color:var(--amber)">K:${k}</b></span></div>`;
  }).join("")}</div></div>` : "";

  $("#stage").innerHTML = `<div class="fadeup">
    <div class="eyebrow">Round ${room.round+1} of ${room.settings.rounds}</div>
    <h1 class="title">${ph==="roundover" ? "Masks off!" : myTurn ? "Your turn!" : `${esc(P(t.turnPid).name)}'s turn`}</h1>
    ${lastWrong && ph==="play" ? `<p class="sub">Last wrong guess: <b>${esc(P(lastWrong.pid).name)}</b> guessed "${esc(lastWrong.text)}" 😅</p>` : ""}
    <div class="masks">${cards}</div>
    ${stageBox}${logHtml}${ph==="roundover"?scoreRows():""}
  </div>`;

  if($("#askForm")) $("#askForm").onsubmit = async e=>{ e.preventDefault(); const tx=$("#askIn").value.trim(); if(!tx) return; try{ await act("ask",{text:tx}); }catch(err){ toast(err.message); } };
  if($("#voiceAsk")) $("#voiceAsk").onclick = ()=>act("ask",{text:"(Asked out loud on Discord VC)"}).catch(err=>toast(err.message));
  if($("#guessForm")) $("#guessForm").onsubmit = async e=>{ e.preventDefault(); const tx=$("#guessIn").value.trim(); if(!tx) return; try{ await act("guess",{text:tx}); buzz(40); }catch(err){ toast(err.message); } };
  if($("#endTurnBtn")) $("#endTurnBtn").onclick = ()=>act("endturn").catch(err=>toast(err.message));
  document.querySelectorAll("[data-rep]").forEach(b=>b.onclick=()=>act("reply",{ans:b.dataset.rep}).catch(err=>toast(err.message)));
}

function scoreRows(){
  const rows = Object.keys(room.players).map(pid=>({pid, s:room.scores?.[pid]||0})).sort((a,b)=>b.s-a.s);
  return `<div class="scores">${rows.map((x,i)=>`<div class="srow ${i===0&&x.s>0?"first":""}"><span class="rk">${i+1}</span>${face(x.pid)}<span>${esc(P(x.pid).name)}</span><span>${x.s} pts</span></div>`).join("")}</div>`;
}
function finalView(){
  if(curView === "final") return; curView = "final";
  const top = Object.keys(room.players).sort((a,b)=>(room.scores?.[b]||0)-(room.scores?.[a]||0))[0];
  $("#stage").innerHTML = `<div class="fadeup"><div class="eyebrow">Final Standings</div>
    <h1 class="title">${top ? `${esc(P(top).name)} unmasked the fastest!` : "Game over"}</h1>${scoreRows()}</div>`;
}

function renderHostbar(){
  const bar = $("#hostbar"), ph = room?.phase;
  if(!hostKey || !room || !me || !room.players[me.pid]){ bar.hidden = true; return; }
  const b = [];
  if(ph === "assign") b.push('<button class="btn primary" data-host="next">Start round now</button>');
  if(ph === "play") b.push('<button class="btn small" data-host="skip">Skip turn</button><button class="btn small" data-host="next">Reveal all masks</button>');
  if(ph === "roundover") b.push(`<button class="btn primary" data-host="next">${room.round+1<room.settings.rounds?"Next round":"Final scores"}</button>`);
  if(ph === "final") b.push('<button class="btn primary" data-host="playagain">Play again</button>');
  bar.hidden = !b.length; bar.innerHTML = b.join("");
}
document.addEventListener("click", async e=>{
  const h = e.target.closest("[data-host]");
  if(h){ try{ await act(h.dataset.host); }catch(err){ toast(err.message); } }
});
$("#hCode").onclick = async ()=>{ if(!code) return; const l=location.origin+"/mask?room="+code; try{ await navigator.clipboard.writeText(l); toast(`Invite link copied · ${code}`); }catch(e){ toast(l); } };
function tickTimer(){
  const el = $("#timer"); if(!room || !room.deadline){ el.hidden = true; return; }
  const left = Math.max(0, Math.ceil(room.deadline - serverNow()));
  el.hidden = false; el.textContent = `${left}s`;
}
setInterval(tickTimer, 200);
const c0 = (new URLSearchParams(location.search).get("room")||"").toUpperCase();
if(c0) openRoom(c0); else home();
</script>
</body>
</html>
