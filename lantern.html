<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0D18">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Game Night">
<title>Last Card</title>
<link rel="stylesheet" href="/festival.css">
<style>
/* Layout: a card stall at the festival. The other players sit along the top, the draw pile and the
   face-up card in the middle, your hand fanned at the bottom with the cards you can play lifted up.
   Four card colours, each with its own symbol so they read apart without colour: lantern (red),
   fan (blue), bamboo (green), firework (gold). Colors come from festival.css. */
:root{
  --c-r:#FF4D6D; --c-b:#4C8DFF; --c-g:#22C98F; --c-y:#FFB627; --c-w:#9AA0D0;
  --line2:var(--line-2); --glass:color-mix(in srgb,var(--night-2) 90%,transparent);
  --cw:clamp(62px,15vw,92px);
}
body{overflow-x:hidden}
.noren{background:var(--c-b);color:#F3EBDD}
.noren .th-btn{border-color:rgba(243,235,221,.35)}
.code{font-weight:700;font-size:14px;letter-spacing:.16em;border:1.5px solid currentColor;border-radius:999px;padding:1px 10px;opacity:.85}
.timer{font-weight:700;font-size:16px;font-variant-numeric:tabular-nums;border-radius:999px;padding:3px 12px;background:var(--ink);color:var(--paper)}
.timer.low{background:var(--lantern);color:var(--on-lantern);animation:beat 1s infinite}
@keyframes beat{50%{transform:scale(1.07)}}
.stage{width:min(860px,100%);margin:0 auto;padding:8px max(14px,env(safe-area-inset-left,0px)) calc(110px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-right,0px))}
.title{font-size:clamp(34px,8vw,56px);line-height:1.1;text-align:center}
.sub{text-align:center;color:var(--muted);margin:8px auto 0;max-width:52ch}
.panel{background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:14px}
.panel h2{font-size:24px}
.btn{border:1px solid var(--line2);background:rgba(243,235,221,.07);border-radius:999px;padding:11px 20px;font-weight:700;cursor:pointer;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--lantern);border-color:var(--lantern);color:var(--on-lantern)}
.btn.small{padding:6px 14px;font-size:14px}
.btn.wide{width:100%}
label{display:block;font-size:14px;font-weight:700;color:var(--muted);margin-bottom:6px}
input[type=text]{width:100%;background:var(--night);border:1px solid var(--line);border-radius:10px;padding:11px 13px;outline:none;color:var(--fg);font-size:16px}
input[type=text]:focus{border-color:var(--gold)}
.err{color:var(--danger);font-size:14px;min-height:1.4em}
.hint{font-size:14px;color:var(--muted);margin:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chips button{border:1px solid var(--line);background:rgba(0,0,0,.2);border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px;cursor:pointer}
.chips button.on{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 15%,transparent);color:var(--gold)}
.chips button:disabled{cursor:default}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px}
.toggle small{display:block;color:var(--muted);font-size:13px}
.toggle button{width:52px;height:30px;border-radius:999px;border:1px solid var(--line2);background:rgba(0,0,0,.4);position:relative;flex:none;cursor:pointer}
.toggle button::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:transform .2s}
.toggle button.on{background:color-mix(in srgb,var(--gold) 30%,transparent);border-color:var(--gold)}
.toggle button.on::after{transform:translateX(22px);background:var(--gold)}
.face{width:44px;height:44px;border-radius:50%;overflow:hidden;display:grid;place-items:center;font-weight:900;color:var(--ink);flex:none}
.face img{width:100%;height:100%;object-fit:cover;object-position:50% 20%}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.person{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.18);border-radius:12px;padding:8px 10px;min-width:0}
.person b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.person .kick{border:0;background:none;color:var(--muted);font-size:13px;cursor:pointer}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);z-index:50;background:var(--paper);color:var(--ink);font-weight:700;border-radius:999px;padding:10px 18px;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:90vw;text-align:center}
.hostbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;gap:10px;flex-wrap:wrap;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:var(--night-2);border-top:3px solid var(--gold)}
body.has-hostbar{--chat-lift:66px}
body.has-hostbar .stage{padding-bottom:calc(170px + env(safe-area-inset-bottom,0px))}
.fadeup{animation:fadeup .5s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes fadeup{from{opacity:0;transform:translateY(14px)}}

/* ---------- cards ----------
   Three card styles; each player picks one for their own screen (saved on the device):
   Neon (dark glass that glows), Sakura (soft pastel candy) and Manga (ink, screentone, speed lines).
   Every card shows its number and colour symbol in two corners, big enough to read when the hand
   is fanned. Each colour has its own symbol, so they read apart without colour too:
   red heart, blue moon, green leaf, yellow star. */
.card{--cc:var(--c-w);position:relative;display:block;width:var(--cw);aspect-ratio:5/7.2;border-radius:calc(var(--cw)*.13);flex:none;user-select:none;-webkit-user-select:none;overflow:hidden;color:var(--cc);font-family:var(--body);padding:0;border:0;-webkit-tap-highlight-color:transparent}
.card.c-r{--cc:var(--c-r)} .card.c-b{--cc:var(--c-b)} .card.c-g{--cc:var(--c-g)} .card.c-y{--cc:var(--c-y)}
.card.wild{--cc:#fff}
.card .idx{position:absolute;z-index:3;display:grid;justify-items:center;gap:calc(var(--cw)*.02);line-height:.9}
.card .tl{left:8%;top:5.5%} .card .br{right:8%;bottom:5.5%;transform:rotate(180deg)}
.card .idx b{font:900 italic calc(var(--cw)*.21)/.9 var(--body);letter-spacing:-.05em}
.card .idx svg{width:calc(var(--cw)*.15);height:calc(var(--cw)*.15)}
.card .art{position:absolute;inset:0;z-index:2;display:grid;place-items:center}
.card .big{position:relative;font:900 italic calc(var(--cw)*.56)/1 var(--body);letter-spacing:-.07em;padding-right:.06em}
.card .big.sm{font-size:calc(var(--cw)*.42)}
.card .art svg.act{position:relative;width:calc(var(--cw)*.48);height:calc(var(--cw)*.48)}
.card .ghost{position:absolute;z-index:1;width:118%;left:-9%;top:14%;opacity:.14;transform:rotate(-14deg)}
.card .wheel{position:relative;width:calc(var(--cw)*.62);aspect-ratio:1;border-radius:50%;background:conic-gradient(from 45deg,var(--c-r) 0 25%,var(--c-b) 0 50%,var(--c-g) 0 75%,var(--c-y) 0);display:grid;place-items:center;box-shadow:0 0 0 calc(var(--cw)*.02) rgba(255,255,255,.85)}
.card .wheel b{font:900 italic calc(var(--cw)*.26)/1 var(--body);color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.55)}
.card .wheel svg{width:46%;color:#fff;filter:drop-shadow(0 1px 3px rgba(0,0,0,.4))}
/* Neon */
.card.d-neon{background:repeating-linear-gradient(118deg,transparent 0 9px,rgba(255,255,255,.03) 9px 10px),linear-gradient(160deg,#232750,#0c0e24 72%);
  box-shadow:inset 0 0 0 1.5px var(--cc),inset 0 0 calc(var(--cw)*.22) color-mix(in srgb,var(--cc) 38%,transparent),0 0 calc(var(--cw)*.14) color-mix(in srgb,var(--cc) 38%,transparent),0 8px 16px -8px #000}
.card.d-neon .big{color:#fff;text-shadow:0 0 calc(var(--cw)*.05) var(--cc),0 0 calc(var(--cw)*.15) var(--cc),0 0 calc(var(--cw)*.3) color-mix(in srgb,var(--cc) 60%,transparent)}
.card.d-neon .art svg.act{color:#fff;filter:drop-shadow(0 0 calc(var(--cw)*.04) var(--cc)) drop-shadow(0 0 calc(var(--cw)*.12) var(--cc))}
.card.d-neon.wild{box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.75),0 0 calc(var(--cw)*.16) rgba(190,150,255,.5),0 8px 16px -8px #000}
/* Sakura */
.card.d-sakura{background:radial-gradient(circle,color-mix(in srgb,var(--cc) 24%,transparent) 1.1px,transparent 1.7px) 0 0/9px 9px,linear-gradient(#fffaf6,#fff1ea);
  box-shadow:inset 0 0 0 calc(var(--cw)*.045) #fff,inset 0 0 0 calc(var(--cw)*.065) color-mix(in srgb,var(--cc) 40%,#fff),0 8px 16px -8px rgba(0,0,0,.7)}
.card.d-sakura .art::before{content:"";position:absolute;width:70%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 34% 28%,color-mix(in srgb,var(--cc) 55%,#fff),var(--cc) 70%);box-shadow:0 calc(var(--cw)*.035) 0 color-mix(in srgb,var(--cc) 70%,#000),0 calc(var(--cw)*.08) calc(var(--cw)*.12) -4px rgba(0,0,0,.35)}
.card.d-sakura .big{color:#fff;text-shadow:0 calc(var(--cw)*.025) 0 color-mix(in srgb,var(--cc) 55%,#000)}
.card.d-sakura .art svg.act{color:#fff;width:calc(var(--cw)*.4)}
.card.d-sakura .ghost{display:none}
.card.d-sakura.wild{--cc:#b48cff}
.card.d-sakura.wild .art::before{display:none}
/* Manga */
.card.d-manga{background:#fbfaf6;box-shadow:inset 0 0 0 calc(var(--cw)*.04) #141414,0 8px 16px -8px rgba(0,0,0,.7)}
.card.d-manga::before{content:"";position:absolute;inset:0;z-index:0;background:radial-gradient(circle,var(--cc) 36%,transparent 39%) 0 0/calc(var(--cw)*.075) calc(var(--cw)*.075);clip-path:polygon(100% 36%,100% 100%,10% 100%)}
.card.d-manga::after{content:"";position:absolute;inset:0;z-index:1;background:repeating-conic-gradient(from 3deg at 50% 50%,rgba(0,0,0,.1) 0 1.4deg,transparent 1.4deg 9deg);-webkit-mask:radial-gradient(circle,transparent 32%,#000 78%);mask:radial-gradient(circle,transparent 32%,#000 78%)}
.card.d-manga .idx{color:#141414}
.card.d-manga .idx svg{color:var(--cc);filter:drop-shadow(1px 1px 0 #141414)}
.card.d-manga .big{color:#fff;-webkit-text-stroke:calc(var(--cw)*.024) #141414;paint-order:stroke fill;text-shadow:calc(var(--cw)*.045) calc(var(--cw)*.045) 0 var(--cc)}
.card.d-manga .art svg.act{color:#141414;filter:drop-shadow(calc(var(--cw)*.035) calc(var(--cw)*.035) 0 var(--cc))}
.card.d-manga .ghost{display:none}
.card.d-manga.wild{--cc:#141414}
.card.d-manga.wild::before{background:radial-gradient(circle,#141414 30%,transparent 33%) 0 0/calc(var(--cw)*.075) calc(var(--cw)*.075);opacity:.35}
/* backs */
.card.back{display:grid;place-items:center}
.card.back::before,.card.back::after{display:none}
.card.back > svg{position:relative;z-index:1;width:46%}
.card.back.d-neon{background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.055) 0 4deg,transparent 4deg 12deg),radial-gradient(circle,#43308c,#15133c 72%);box-shadow:inset 0 0 0 1.5px rgba(200,175,255,.6),0 8px 16px -8px #000;color:#ff86de}
.card.back.d-neon > svg{filter:drop-shadow(0 0 5px #ff86de) drop-shadow(0 0 14px #7c8cff)}
.card.back.d-sakura{background:radial-gradient(circle,rgba(255,255,255,.55) 1.2px,transparent 1.8px) 0 0/9px 9px,linear-gradient(160deg,#ffb7d2,#ff86b0);box-shadow:inset 0 0 0 calc(var(--cw)*.045) #fff,0 8px 16px -8px rgba(0,0,0,.7);color:#fff}
.card.back.d-manga{background:repeating-conic-gradient(from 0deg,#141414 0 3deg,#fbfaf6 3deg 10deg);box-shadow:inset 0 0 0 calc(var(--cw)*.04) #141414,inset 0 0 0 calc(var(--cw)*.085) #fbfaf6,0 8px 16px -8px rgba(0,0,0,.7);color:var(--c-r)}
.card.back.d-manga > svg{background:#fbfaf6;border-radius:50%;padding:9%;box-sizing:content-box;width:36%;border:2px solid #141414}

/* ---------- the table ----------
   A round table seen from above: it fits a phone screen best. You sit at the bottom and everyone
   else sits around the rim in play order. A beam from the middle swings to whoever's turn it is,
   the ring round the piles spins the way play is going, and the rim glows in the colour to match. */
.arena{position:relative;container-type:inline-size;width:min(100%,620px,max(270px,calc(100svh - 370px)));aspect-ratio:1;margin:8px auto 0;--cc:var(--c-w)}
.arena > *{--cw:clamp(40px,14.5cqw,88px)}
.arena.c-r{--cc:var(--c-r)} .arena.c-b{--cc:var(--c-b)} .arena.c-g{--cc:var(--c-g)} .arena.c-y{--cc:var(--c-y)}
.felt{position:absolute;inset:8.5%;border-radius:50%;overflow:hidden;
  background:
    repeating-conic-gradient(from 0deg,rgba(255,255,255,.022) 0 2deg,transparent 2deg 12deg),
    radial-gradient(circle at 50% 38%,#1a2248 0%,#0e132b 56%,#070a18 100%);
  box-shadow:
    0 0 0 2.5px color-mix(in srgb,var(--cc) 88%,#fff),
    0 0 0 10px rgba(255,255,255,.03),
    0 0 64px 8px color-mix(in srgb,var(--cc) 48%,transparent),
    0 32px 64px -20px #000,
    inset 0 0 80px rgba(0,0,0,.72);
  transition:box-shadow .6s}
.felt::before{content:"";position:absolute;inset:8.5%;border-radius:50%;border:1px solid color-mix(in srgb,var(--cc) 30%,rgba(255,255,255,.08));transition:border-color .6s}
.felt::after{content:"";position:absolute;inset:19%;border-radius:50%;border:1px dashed rgba(255,255,255,.07)}
.twave{position:absolute;left:50%;top:50%;width:22%;height:22%;margin:-11% 0 0 -11%;border-radius:50%;border:4px solid var(--cc);box-shadow:0 0 28px var(--cc);pointer-events:none;z-index:2;animation:twave .72s cubic-bezier(.16,1,.3,1) forwards}
@keyframes twave{to{transform:scale(4.8);opacity:0;border-width:1px}}
.seat .fan{display:flex;justify-content:center;align-items:center;height:18px;margin-top:-2px;pointer-events:none}
.seat .fan i{display:block;width:11px;height:16px;border-radius:3px;background:linear-gradient(150deg,#6246c9,#211a54);border:1px solid rgba(255,255,255,.45);margin-left:-5px;box-shadow:0 2px 5px rgba(0,0,0,.6);transform:rotate(var(--r,0deg)) translateY(var(--y,0px));transition:transform .25s}
.seat .fan i:first-child{margin-left:0}
.seat .fan.one i{background:linear-gradient(150deg,#ff6b8b,#ff2e5b);border-color:#fff;box-shadow:0 0 10px #ff2e5b;animation:beat .85s infinite}
.halo{position:absolute;left:50%;top:50%;width:66%;height:66%;transform:translate(-50%,-50%);border-radius:50%;background:var(--cc);filter:blur(42px);opacity:.38;transition:background-color .7s}
.spot{position:absolute;left:50%;top:50%;height:22cqw;width:0;margin-top:-11cqw;transform-origin:0 50%;z-index:1;pointer-events:none;
  background:linear-gradient(90deg,transparent 10%,color-mix(in srgb,var(--gold) 14%,transparent) 45%,color-mix(in srgb,var(--gold) 42%,transparent) 100%);
  clip-path:polygon(0 50%,100% 0,100% 100%);transition:transform .65s cubic-bezier(.3,1.2,.45,1),width .65s,opacity .3s}
.dirring{position:absolute;left:50%;top:50%;width:min(66cqw,calc(var(--cw)*4));aspect-ratio:1;transform:translate(-50%,-50%);z-index:1;color:rgba(243,235,221,.2);pointer-events:none}
.dirring svg{width:100%;height:100%;animation:spin 16s linear infinite}
.dirring.ccw svg{animation-direction:reverse}
.dirring.flip svg{animation:spin 16s linear infinite,flipdir .7s cubic-bezier(.3,1.4,.5,1)}
.dirring.ccw.flip svg{animation:spin 16s linear infinite reverse,flipdir .7s cubic-bezier(.3,1.4,.5,1)}
@keyframes spin{to{rotate:360deg}}
@keyframes flipdir{from{transform:scaleX(-1) scale(1.3)}}
.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:7cqw;z-index:2}
.pile{position:relative;border:0;background:none;padding:0;cursor:default;width:var(--cw);aspect-ratio:5/7.2;-webkit-tap-highlight-color:transparent}
.pile .card{position:absolute;inset:0;width:100%}
.pile .card:nth-child(1){transform:translate(3px,4px) rotate(5deg)}
.pile .card:nth-child(2){transform:translate(1px,2px) rotate(-3deg)}
.pile.can{cursor:pointer}
.pile.can .card:nth-child(3){animation:nudge 1.4s ease-in-out infinite;outline:3px solid var(--gold);outline-offset:2px}
@keyframes nudge{50%{transform:translateY(-6px)}}
.pile .count{position:absolute;bottom:-22px;left:-14px;right:-14px;text-align:center;font-size:11px;color:var(--muted);font-weight:700;white-space:nowrap}
.discard{position:relative;--dw:calc(var(--cw)*1.18);width:var(--dw);aspect-ratio:5/7.2}
.discard .card{position:absolute;inset:0;width:100%;--cw:var(--dw);transform:rotate(calc(var(--r,0) * 1deg))}
.discard .ripple{position:absolute;inset:-4%;z-index:4;border-radius:calc(var(--dw)*.14);border:3px solid var(--cc);pointer-events:none;animation:ripple .65s ease-out forwards}
@keyframes ripple{to{inset:-30%;opacity:0;border-width:1px}}
.discard .dot{position:absolute;right:-12px;top:-12px;z-index:5;width:30px;height:30px;border-radius:50%;background:var(--cc);box-shadow:0 0 0 3px rgba(255,255,255,.92),0 0 18px var(--cc);display:grid;place-items:center;color:#fff;transition:background-color .5s}
.discard .dot svg{width:17px;height:17px}
.pending{position:absolute;left:50%;bottom:-15px;transform:translateX(-50%);z-index:5;font:900 italic 19px/1 var(--body);color:#fff;background:var(--c-r);border-radius:999px;padding:6px 12px;box-shadow:0 0 0 3px var(--night),0 0 24px var(--c-r);animation:beat 1s infinite;white-space:nowrap}
.seat{position:absolute;z-index:3;transform:translate(-50%,-50%);display:grid;justify-items:center;gap:3px;width:min(23cqw,92px);text-align:center}
.seat .av{position:relative;width:clamp(36px,12cqw,62px);aspect-ratio:1;transition:transform .35s cubic-bezier(.3,1.5,.5,1)}
.seat .face{width:100%;height:100%;border:2.5px solid #12142f;box-shadow:0 8px 16px -6px rgba(0,0,0,.8);transition:box-shadow .35s,border-color .35s}
.seat .n{position:absolute;right:-9px;bottom:-4px;min-width:22px;height:24px;border-radius:6px;background:#fff;color:#12142f;font:900 12px/24px var(--body);padding:0 5px;box-shadow:-3px -2px 0 -1px #c9cbe6,0 2px 6px rgba(0,0,0,.4);transform:rotate(8deg)}
.seat .n.low{background:var(--c-r);color:#fff;box-shadow:-3px -2px 0 -1px #ff9fb0,0 0 12px var(--c-r)}
.seat b{font-size:11.5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:rgba(10,12,32,.8);border-radius:999px;padding:1px 9px;transition:background .3s,color .3s}
.seat.turn{z-index:4}
.seat.turn .av{transform:scale(1.12)}
.seat.turn .face{border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 40%,transparent),0 0 30px 8px color-mix(in srgb,var(--gold) 55%,transparent)}
.seat.turn b{background:var(--gold);color:var(--ink)}
.seat .tring{position:absolute;inset:-7px;border-radius:50%;background:conic-gradient(var(--gold) calc(var(--p,1)*360deg),rgba(255,255,255,.08) 0);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3.5px));mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3.5px))}
.seat .tring.low{background:conic-gradient(var(--c-r) calc(var(--p,1)*360deg),rgba(255,255,255,.08) 0)}
.seat.won .face{border-color:var(--gold);box-shadow:0 0 0 4px var(--gold),0 0 50px 12px color-mix(in srgb,var(--gold) 60%,transparent)}
.seat .tag{font-size:10px;font-weight:900;border-radius:999px;padding:2px 7px;background:var(--gold);color:var(--ink);white-space:nowrap}
.catch{border:0;border-radius:999px;background:var(--c-r);color:#fff;font:900 12px var(--body);padding:5px 10px;cursor:pointer;animation:beat .8s infinite;box-shadow:0 0 18px var(--c-r)}
.status{display:flex;align-items:center;justify-content:center;gap:10px;margin:14px auto 2px;width:max-content;max-width:100%;font-family:var(--display);font-size:clamp(17px,4.6vw,23px);
  padding:5px 18px 5px 6px;border-radius:999px;background:rgba(10,12,32,.6);border:1px solid var(--line);min-height:42px}
.status .face{width:30px;height:30px}
.status.mine{background:var(--gold);color:var(--ink);border-color:var(--gold);padding-left:18px;box-shadow:0 0 30px color-mix(in srgb,var(--gold) 50%,transparent);animation:glow 1.6s ease-in-out infinite}
.status.jumpable{border-color:var(--c-r);box-shadow:0 0 24px color-mix(in srgb,var(--c-r) 50%,transparent)}
.status:empty{display:none}
@keyframes glow{50%{box-shadow:0 0 44px color-mix(in srgb,var(--gold) 75%,transparent)}}
.feed{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;text-align:center;color:var(--muted);font-size:13.5px;min-height:1.5em;margin-top:4px}
.modechip{display:inline-flex;gap:6px;align-items:center;font-size:11px;font-weight:900;border-radius:999px;padding:3px 10px;background:var(--c-r);color:#fff;letter-spacing:.05em;border:0}
.deckchip{background:rgba(255,255,255,.08);color:var(--fg);border:1px solid var(--line);cursor:pointer;font-family:var(--body)}
/* effects drawn over everything for a moment */
.fly{position:fixed;z-index:58;pointer-events:none;will-change:transform}
.fly .card{width:100%}
.pop{position:fixed;z-index:60;pointer-events:none;transform:translate(-50%,-50%);font:900 italic clamp(17px,4.4vw,24px)/1 var(--body);letter-spacing:-.01em;white-space:nowrap;padding:8px 16px;border-radius:999px;color:#fff;background:#1b1e4c;box-shadow:0 10px 30px -8px rgba(0,0,0,.7),0 0 0 2px rgba(255,255,255,.9)}
.pop.red{background:linear-gradient(135deg,#ff7a8f,var(--c-r))}
.pop.gold{background:linear-gradient(135deg,#ffd36b,var(--gold));color:var(--ink)}
.pop.big{font-size:clamp(30px,9vw,56px);padding:12px 28px;box-shadow:0 20px 50px -10px rgba(0,0,0,.7),0 0 0 3px #fff}
.arena.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-7px) rotate(-.6deg)}40%{transform:translateX(6px) rotate(.5deg)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
.confetti{position:fixed;z-index:61;pointer-events:none;width:9px;height:14px;border-radius:2px}

/* ---------- your hand ----------
   One fanned row that always fits the screen; on a narrow phone the cards overlap more, and only a
   really big hand scrolls sideways. Cards you can play rise up; the rest dim on your turn. */
.hand{position:relative;display:flex;justify-content:safe center;align-items:flex-end;padding:34px 14px 18px;margin:0 -14px;overflow-x:auto;scrollbar-width:none;--cw:clamp(66px,19vw,100px);min-height:calc(var(--cw)*1.44 + 52px)}
.hand::-webkit-scrollbar{display:none}
.hand.scroll{justify-content:flex-start}
.hand .card{margin-inline-start:var(--ov,6px);transform:translateY(calc(var(--arc,0px) + var(--lift,0px))) rotate(var(--rot,0deg));transform-origin:50% 130%;transition:transform .25s cubic-bezier(.3,1.3,.5,1),filter .25s;cursor:default}
.hand .card:first-child{margin-inline-start:0}
.hand.live .card:not(.ok){filter:brightness(.48) saturate(.5)}
.hand .card.ok{cursor:pointer;--lift:-18px}
@media (hover:hover){.hand .card.ok:hover{--lift:-30px}}
.hand .card.drawn{--lift:-28px;outline:3px solid var(--gold);outline-offset:2px}
.hand .card.jump{--lift:-22px;animation:jumpy .8s ease-in-out infinite;outline:3px solid #fff;outline-offset:2px}
@keyframes jumpy{50%{translate:0 -10px}}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{border:1px solid var(--line);background:rgba(0,0,0,.2);border-radius:12px;padding:11px;text-align:left;display:grid;gap:2px;cursor:pointer;color:inherit;font:inherit}
.seg button small{color:var(--muted);font-weight:500;line-height:1.35;font-size:13px}
.seg button.on{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 12%,transparent)}
.seg button:disabled{cursor:default}
.decks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.decks button{border:1.5px solid var(--line);background:rgba(0,0,0,.2);border-radius:14px;padding:14px 4px 10px;display:grid;justify-items:center;gap:8px;cursor:pointer;color:inherit;font:700 14px var(--body);--cw:clamp(34px,9vw,46px)}
.decks button.on{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 12%,transparent)}
.decks .mini{display:flex;padding-left:16px}
.decks .mini .card{margin-left:-16px;transform:rotate(-10deg)}
.decks .mini .card:nth-child(2){transform:translateY(-4px)}
.decks .mini .card:nth-child(3){transform:rotate(10deg)}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:2px}
.callbtn{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.callbtn.urgent{animation:beat .7s infinite}
/* the colour picker for wild cards */
.scrim{position:fixed;inset:0;z-index:55;background:rgba(6,7,22,.66);display:flex;align-items:flex-end;justify-content:center;padding:16px;animation:fadein .18s}
@media (min-width:700px){.scrim{align-items:center}}
@keyframes fadein{from{opacity:0}}
.picker{background:#171a40;color:var(--fg);border:1px solid var(--line);border-radius:22px;padding:18px;width:min(380px,100%);display:grid;gap:14px;text-align:center;box-shadow:0 30px 80px -20px #000;animation:pickup .3s cubic-bezier(.2,1.3,.4,1)}
@keyframes pickup{from{transform:translateY(30px) scale(.96);opacity:0}}
.picker h2{font-size:24px}
.picker .opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.picker .opts button{border:0;border-radius:16px;padding:18px 8px;color:#fff;font:900 italic 17px var(--body);display:grid;justify-items:center;gap:6px;cursor:pointer;background:linear-gradient(150deg,color-mix(in srgb,var(--pc) 70%,#fff),var(--pc));box-shadow:0 10px 24px -8px color-mix(in srgb,var(--pc) 80%,transparent);transition:transform .12s}
.picker .opts button:active{transform:scale(.96)}
.picker .opts svg{width:30px;height:30px}
.picker .x{border:0;background:none;color:var(--muted);font:700 15px var(--body);cursor:pointer;padding:6px}

/* ---------- round over ---------- */
.winner{text-align:center;margin-top:16px}
.winner .face{width:96px;height:96px;margin:0 auto 10px;box-shadow:0 0 0 4px var(--gold),0 0 40px color-mix(in srgb,var(--gold) 60%,transparent)}
.hands{display:grid;gap:8px;margin-top:16px}
.hands .row{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.18);border-radius:12px;padding:8px 10px;--cw:34px;overflow-x:auto}
.hands .row b{min-width:80px}
.hands .row .wins{margin-left:auto;color:var(--gold);font-weight:900;white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top noren">
  <a class="noren-back" href="/" aria-label="Back to all games">&larr; Arcade</a>
  <h1>Last Card</h1>
  <button type="button" class="code" id="hCode" title="Copy invite link" aria-label="Copy invite link" hidden></button>
  <span class="spacer"></span>
  <span class="timer" id="timer" hidden></span>
</header>
<main class="stage" id="stage"></main>
<div class="hostbar" id="hostbar" hidden></div>
<div class="toast" id="toast" hidden></div>

<script src="/avatars.js"></script>
<script src="/backguard.js"></script>
<script src="/theme.js"></script>
<script src="/chat.js"></script>
<script src="/pranks.js"></script>
<script src="/roombar.js"></script>
<script src="/howto.js"></script>
<script src="/juice.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hue = n => { let h=0; for(const c of String(n)) h=(h*31+c.charCodeAt(0))%360; return `hsl(${h} 70% 70%)`; };
function store(k, v){ try{ if(v===undefined) return JSON.parse(localStorage.getItem(k)); localStorage.setItem(k, JSON.stringify(v)); }catch(e){ return null; } }
function toast(m){ const t=$("#toast"); t.textContent=m; t.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>t.hidden=true,2600); }
const buzz = p => { try{ if(navigator.vibrate && navigator.userActivation?.hasBeenActive) navigator.vibrate(p); }catch(e){} };
async function api(path, body){
  const r = await fetch(path, body ? {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)} : {});
  const j = await r.json().catch(()=>({error:"The server didn't answer. Try again."}));
  if(!r.ok) throw new Error(j.error || "Something went wrong");
  return j;
}

let code=null, room=null, me=null, hostKey=null, pollGen=0, clockOffset=0;
const serverNow = () => Date.now()/1000 + clockOffset;
const act = (a, extra={}) => api(`/api/rooms/${code}/${a}`, {hostKey, ...(me||{}), ...extra});
Chat.mount({act});
Pranks.mount({act});
RoomBar.mount({act, game:"lantern", onHostChange:(hk, became)=>{ hostKey = hk; if(became) toast("You are now the host!"); if(room){ render(); document.body.classList.toggle("has-hostbar", !$("#hostbar").hidden); } }});
if(window.Juice) Juice.mountMute();
const P = pid => room.players[pid] || {name:"Someone who left"};
const picOf = p => { const src = Avatars.src(p); return src ? `<img src="${esc(src)}" alt="">` : esc(p.name[0].toUpperCase()); };
const face = (pid, cls="face") => { const p = P(pid); return `<span class="${cls}" data-pid="${esc(pid)}" style="background:${hue(p.name)}">${picOf(p)}</span>`; };

/* ---------- cards ---------- */
const SUIT = {
  r: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.2s-8.7-5.4-8.7-11.5A4.9 4.9 0 0 1 12 6.8a4.9 4.9 0 0 1 8.7 2.9c0 6.1-8.7 11.5-8.7 11.5z"/></svg>',
  b: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M14.8 2.2a9.8 9.8 0 1 0 7 15.3A8 8 0 0 1 14.8 2.2z"/></svg>',
  g: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 3C10.5 3 3.5 8.3 3.5 15.6c0 1.5.4 2.8 1 3.8L3 21l1 1 1.6-1.6c1 .6 2.3 1 3.8 1C16.7 21.4 21 13.8 21 3z"/></svg>',
  y: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.2l3 6.3 6.8.8-5 4.7 1.3 6.8L12 17.4l-6.1 3.4 1.3-6.8-5-4.7 6.8-.8z"/></svg>',
};
const SPARK = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .8c.9 6 3.6 8.8 11.2 11.2C15.6 14.4 12.9 17.2 12 23.2 11.1 17.2 8.4 14.4.8 12 8.4 9.6 11.1 6.8 12 .8z"/></svg>';
const NAMES = {r:"Red", b:"Blue", g:"Green", y:"Yellow"};
const ICON = {
  S: '<svg class="act" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M6 18 18 6"/></svg>',
  R: '<svg class="act" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h14l-4-4M20 14.5H6l4 4"/></svg>',
};
const kind = c => c.split("#")[0];
const colorOf = c => kind(c).startsWith("W") ? null : kind(c)[0];
const valueOf = c => kind(c).startsWith("W") ? kind(c) : kind(c).slice(1);
const LABEL = {S:"Block", R:"Turn back", D:"+2", W:"Wild", W4:"Wild +4"};
const cardName = c => { const v = valueOf(c), col = colorOf(c); return (col ? NAMES[col] + " " : "") + (LABEL[v] || v); };
// card styles: each player picks their own, saved on this device
const DECKS = [["neon","Neon"],["sakura","Sakura"],["manga","Manga"]];
let deck = (()=>{ try{ const d = localStorage.getItem("ll:deck"); return DECKS.some(x=>x[0] === d) ? d : "neon"; }catch(e){ return "neon"; } })();
function setDeck(d){ deck = d; try{ localStorage.setItem("ll:deck", d); }catch(e){} render(); }
function cardHTML(c, cls="", tag="div", attrs="", dk=deck){
  const v = valueOf(c), col = colorOf(c), wild = !col;
  const mark = wild ? SPARK : SUIT[col];
  const label = v === "S" || v === "R" ? ICON[v] : `<b>${wild ? (v === "W4" ? "+4" : "") : v === "D" ? "+2" : v}</b>`;
  const corner = `${label}${mark}`;
  const mid = wild ? `<span class="wheel">${v === "W4" ? "<b>+4</b>" : SPARK}</span>`
    : v === "S" || v === "R" ? ICON[v] : `<span class="big ${v === "D" ? "sm" : ""}">${v === "D" ? "+2" : v}</span>`;
  const ghost = wild ? "" : SUIT[col].replace("<svg", '<svg class="ghost" aria-hidden="true"');
  return `<${tag} class="card d-${dk} ${wild ? "wild" : "c-" + col} ${cls}" ${attrs} aria-label="${esc(cardName(c))}">${ghost}<span class="idx tl">${corner}</span><span class="art">${mid}</span><span class="idx br">${corner}</span></${tag}>`;
}
const backHTML = (cls="", dk=deck) => `<div class="card back d-${dk} ${cls}">${SPARK}</div>`;
// every card lands on the pile at its own slight angle, and keeps it
const tilt = c => ((parseInt(c.split("#")[1], 10) || 0) * 47 % 23) - 11;

/* ---------- home ---------- */
function home(){
  $("#stage").innerHTML = `<div class="fadeup" style="margin-top:5vh"><h1 class="title" style="font-size:clamp(44px,12vw,80px)">Last Card</h1>
    <p class="sub">Match the colour or the symbol, hit the next player with action cards, and empty your hand first. Down to one card? Call it before someone catches you.</p></div>
    <div style="display:grid;gap:14px;margin-top:26px;max-width:520px;margin-left:auto;margin-right:auto">
    <form class="panel" id="createForm"><h2>Start a game</h2><div><label for="cName">Your name</label><input type="text" id="cName" maxlength="16" autocomplete="nickname"></div>
      <div class="err" id="cErr"></div><button class="btn primary wide">Create game</button><p class="hint">House rules and the turn timer are set in the lobby.</p></form>
    ${HowTo.button("lantern","margin-top:0")}
    <form class="panel" id="joinForm"><h2>Join a game</h2><div class="row2"><div><label for="jCode">Room code</label><input type="text" id="jCode" maxlength="6" autocomplete="off" style="text-transform:uppercase;letter-spacing:.2em"></div>
      <div><label for="jName">Your name</label><input type="text" id="jName" maxlength="16" autocomplete="nickname"></div></div>
      <div class="err" id="jErr"></div><button class="btn primary wide">Join</button></form></div>`;
  $("#createForm").onsubmit = async e=>{ e.preventDefault(); const n = $("#cName").value.trim(); if(!n){ $("#cErr").textContent="Enter your name."; return; }
    try{ const r = await api("/api/rooms", {game:"lantern", title:"Last Card"}); const m = await api(`/api/rooms/${r.code}/join`, {name:n}); store("ll:"+r.code, {hostKey:r.hostKey, me:m}); openRoom(r.code); }catch(err){ $("#cErr").textContent = err.message; } };
  $("#joinForm").onsubmit = async e=>{ e.preventDefault(); const c = $("#jCode").value.trim().toUpperCase(), n = $("#jName").value.trim();
    if(!c || !n){ $("#jErr").textContent = "Enter the room code and your name."; return; }
    try{ const m = await api(`/api/rooms/${c}/join`, {name:n}); store("ll:"+c, {...(store("ll:"+c)||{}), me:m}); openRoom(c); }catch(err){ $("#jErr").textContent = err.message; } };
}
function openRoom(c){
  code = c; const s = store("ll:"+c) || {}; me = s.me || null; hostKey = s.hostKey || null;
  history.replaceState(null, "", "/lantern?room="+c); $("#hCode").hidden = false; $("#hCode").textContent = c;
  BackGuard.arm();
  poll(++pollGen, -1);
}
async function poll(gen, v){
  while(gen === pollGen){
    try{
      const who = (me ? `&pid=${me.pid}&key=${me.key}` : "") + (hostKey ? `&hk=${hostKey}` : "");
      const r = await fetch(`/api/rooms/${code}?v=${v}${who}`);
      if(r.status === 404){ history.replaceState(null,"","/lantern"); home(); $("#jErr").textContent = "That game doesn't exist anymore."; return; }
      const d = await r.json(); if(gen !== pollGen) return;
      clockOffset = d.now - Date.now()/1000;
      const prev = room; room = d; v = d.version;
      if(me && !room.players[me.pid]){ me = null; if(!room.roomMeta?.isHost) hostKey = null; store("ll:"+code, {hostKey}); toast("You were removed from this game"); }
      if(me) Avatars.apply(act, room.players[me.pid]);  // your saved profile picture
      if(!Chat.socialOnly(prev, room)){ react(prev); render(); }  // chat and pranks leave the table alone
      document.body.classList.toggle("has-hostbar", !$("#hostbar").hidden);
      Chat.update(room, me); Pranks.update(room, me); RoomBar.update(room, me, hostKey);
    }catch(e){ console.error(e); await new Promise(r=>setTimeout(r,2000)); }
  }
}

/* ---------- what just happened: a line under the table, a buzz when it's about you ---------- */
let seenEvents = null, lastLine = "", fx = [], handRects = {};
function react(prev){
  const ev = room.table?.events || [];
  // where your cards were before this update, so a card you played can fly from its spot
  if(seenEvents === null || !prev){ seenEvents = new Set(ev.map(e=>e.id)); lastLine = ""; }
  else if(prev.round !== room.round){ seenEvents = new Set(); lastLine = ""; prevHand = new Set(); }
  for(const e of ev){
    if(seenEvents.has(e.id)) continue;
    seenEvents.add(e.id);
    const who = e.pid === me?.pid ? "You" : P(e.pid).name, mine = e.pid === me?.pid;
    const line = {
      play: () => `${who} played ${cardName(e.card)}${kind(e.card).startsWith("W") ? `, now ${NAMES[e.color]}` : ""}`,
      drew: () => `${who} drew ${e.n} card${e.n === 1 ? "" : "s"}${e.timeout ? " (out of time)" : ""}`,
      skip: () => `${who} ${mine ? "are" : "is"} blocked`,
      reverse: () => `Play turns back`,
      pass: () => `${who} passed${e.timeout ? " (out of time)" : ""}`,
      call: () => `${who} called Last card!`,
      caught: () => `${P(e.by).name} caught ${mine ? "you" : who} with one card: +${e.n}`,
      won: () => `${who} won the round!`,
      jump: () => `${who} jumped in!`,
      start: () => "",
    }[e.what]?.() || "";
    if(line) lastLine = line;
    fx.push(e);
    if(mine && (e.what === "caught" || (e.what === "drew" && e.forced))){ buzz([80,50,80]); toast(line); }
  }
  if(prev?.table && room.table && prev.table.turn !== room.table.turn && room.table.turn === me?.pid && room.phase === "playing"){ buzz(100); fx.push({what:"myturn"}); }
}

/* ---------- render ---------- */
function render(){
  renderHostbar(); tickTimer();
  if(!me || !room.players[me.pid]) return gate();
  if(room.phase === "lobby") return lobby();
  table();
}
function gate(){
  if($("#gate")) return;
  $("#stage").innerHTML = `<form class="panel fadeup" id="gate" style="margin:8vh auto 0;max-width:420px"><h2 style="text-align:center">Join this game</h2>
    <input type="text" id="gName" placeholder="Your name" maxlength="16" autocomplete="nickname"><div class="err" id="gErr"></div><button class="btn primary wide">Join</button></form>`;
  $("#gate").onsubmit = async e=>{ e.preventDefault(); const n = $("#gName").value.trim(); if(!n) return;
    try{ me = await api(`/api/rooms/${code}/join`, {name:n}); store("ll:"+code, {me, hostKey}); poll(++pollGen, -1); }catch(err){ $("#gErr").textContent = err.message; } };
}

/* ---------- lobby ---------- */
function lobby(){
  const H = !!hostKey, s = room.settings, ps = Object.keys(room.players), mine = P(me.pid);
  const chip = (key, val, text) => `<button type="button" data-set="${key}" data-val="${val}" class="${s[key] === val ? "on" : ""}" ${H ? "" : "disabled"}>${text}</button>`;
  const tog = (key, title, note) => `<div class="toggle"><div><b>${title}</b><small>${note}</small></div><button type="button" data-tog="${key}" class="${s[key] ? "on" : ""}" ${H ? "" : "disabled"} aria-pressed="${s[key]}" aria-label="${title}"></button></div>`;
  $("#stage").innerHTML = `<div class="fadeup"><h1 class="title">${ps.length} at the table</h1><p class="sub">Share the code <b style="color:var(--gold)">${esc(room.code)}</b>. ${ps.length < 2 ? "You need at least 2 players." : "2 to 10 players."}</p></div>
    <div class="panel" style="margin-top:16px"><div style="display:flex;align-items:center;gap:12px"><button type="button" class="face" id="myPic" style="background:${hue(mine.name)};border:0;cursor:pointer;width:56px;height:56px" aria-label="Change your picture">${picOf(mine)}</button>
      <div><b>${esc(mine.name)}</b><p class="hint">Tap your picture to change it.</p></div></div>
      <div class="people">${ps.map(pid=>`<div class="person">${face(pid)}<b>${esc(P(pid).name)}${pid === me.pid ? " (you)" : ""}</b>${H && pid !== me.pid ? `<button class="kick" data-kick="${pid}">Kick</button>` : ""}</div>`).join("")}</div></div>
    <div class="panel" style="margin-top:14px"><h2>${H ? "House rules" : "House rules (the host picks)"}</h2>
      <div><label>Card style · just for your screen</label><div class="decks">${DECKS.map(([id, nm])=>`<button type="button" data-deck="${id}" class="${deck === id ? "on" : ""}"><span class="mini">${cardHTML("r7#1", "", "div", "", id)}${cardHTML("W4#2", "", "div", "", id)}${backHTML("", id)}</span>${nm}</button>`).join("")}</div></div>
      <div><label>Mode</label><div class="seg">
        <button type="button" data-mode="classic" class="${s.mode !== "speed" ? "on" : ""}" ${H ? "" : "disabled"}><b>Classic</b><small>Take your time. Turn timer below.</small></button>
        <button type="button" data-mode="speed" class="${s.mode === "speed" ? "on" : ""}" ${H ? "" : "disabled"}><b>Speed</b><small>10 seconds a turn. Hold the exact same card as the top one? Slam it down out of turn.</small></button></div></div>
      <div><label>Cards in your starting hand</label><div class="chips">${[5,6,7,8,10].map(n=>chip("hand", n, n)).join("")}</div></div>
      ${tog("stack", "Stack +2 and +4", "Hit with a +2? Play your own +2 (or a +4) to pass it on bigger.")}
      ${tog("drawUntil", "Draw until you can play", "Keep drawing until you get a card that fits.")}
      ${s.mode === "speed" ? "" : `<div><label>Turn timer</label><div class="chips">${[[0,"Off"],[20,"20s"],[30,"30s"],[45,"45s"],[60,"60s"]].map(([v,t])=>chip("turnSec", v, t)).join("")}</div></div>`}
      ${H ? `<button class="btn primary wide" data-host="start" ${ps.length < 2 ? "disabled" : ""}>Deal the cards</button>` : `<p class="hint" style="text-align:center">Waiting for the host to deal.</p>`}</div>
    ${HowTo.button("lantern")}`;
  $("#myPic").onclick = ()=>Avatars.open(act);
  document.querySelectorAll("[data-set]").forEach(b=>b.onclick=()=>act("settings", {[b.dataset.set]: Number(b.dataset.val)}).catch(err=>toast(err.message)));
  document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>act("settings", {mode: b.dataset.mode}).catch(err=>toast(err.message)));
  document.querySelectorAll("[data-tog]").forEach(b=>b.onclick=()=>act("settings", {[b.dataset.tog]: !s[b.dataset.tog]}).catch(err=>toast(err.message)));
}

/* ---------- the table ---------- */
let picking = null, spotAngle = null, spotLen = 0, prevHand = null;
const DIRSVG = `<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <path d="M50 4a46 46 0 0 1 39.8 23" /><path d="M84 18l6 9-10.5 1.5"/><path d="M89.8 73A46 46 0 0 1 50 96"/><path d="M58 90l-8 6 8 5"/>
  <path d="M10.2 73A46 46 0 0 1 10.2 27"/><path d="M4 34l6-7 5 8"/></svg>`;
// your seat is at the bottom; everyone else follows in play order, clockwise
function seatList(t){ const o = t.order, i = o.indexOf(me.pid); return i < 0 ? o : o.slice(i).concat(o.slice(0, i)); }
function table(){
  // where your cards are right now: a card you play flies from its spot, and the rest glide to their new places
  handRects = {}; document.querySelectorAll("#hand [data-card]").forEach(el=>handRects[el.dataset.card] = el.getBoundingClientRect());
  const t = room.table, mine = room.me, over = room.phase === "roundover", speed = room.settings.mode === "speed";
  // your turn ended (the timer, or the round is over) while you were picking a colour: close the picker
  if(picking && (over || t.turn !== me.pid)){ document.querySelector(".scrim")?.remove(); picking = null; }
  const inRound = !!mine, myTurn = !over && t.turn === me.pid;
  const jumps = inRound && !over ? (mine.canJump || []) : [];
  const seats = seatList(t), N = seats.length, base = t.order.includes(me.pid) ? 90 : 270;
  const seat = (pid, i) => {
    const a = (base + i * 360 / N) * Math.PI / 180, x = 50 + 45 * Math.cos(a), y = 50 + 45 * Math.sin(a);
    const n = t.counts[pid] ?? 0, called = t.called.includes(pid), exposed = t.exposed === pid, turn = t.turn === pid && !over;
    const tag = exposed && pid !== me.pid ? `<button class="catch" data-catch="1">Catch!</button>` : called && n === 1 ? `<span class="tag">Last card</span>` : "";
    const showN = pid === me.pid ? 0 : Math.min(n, 7);
    const fan = showN > 0 ? `<span class="fan ${n === 1 ? "one" : ""}" aria-hidden="true">${Array.from({length:showN}, (_, k) => {
      const m = k - (showN - 1) / 2;
      return `<i style="--r:${(m * 9).toFixed(1)}deg;--y:${(Math.abs(m) * 1.4).toFixed(1)}px"></i>`;
    }).join("")}</span>` : "";
    return `<div class="seat ${turn ? "turn" : ""} ${t.winner === pid ? "won" : ""}" data-seat="${esc(pid)}" style="left:${x.toFixed(2)}%;top:${y.toFixed(2)}%">
      <span class="av">${face(pid)}${turn && room.deadline ? '<i class="tring"></i>' : ""}<span class="n ${n === 1 ? "low" : ""}" aria-label="${n} cards">${n}</span></span>
      <b>${pid === me.pid ? "You" : esc(P(pid).name)}</b>${fan}${tag}</div>`;
  };
  let status = "";
  if(!over){
    if(!inRound) status = `${face(t.turn)}Watching · ${esc(P(t.turn).name)}'s turn`;
    else if(myTurn) status = mine.drawn ? "It fits! Play it or pass" : t.pending ? `Stack it or take ${t.pending}` : "Your turn";
    else if(jumps.length) status = `${face(t.turn)}Jump in with your matching card!`;
    else status = `${face(t.turn)}${esc(P(t.turn).name)}'s turn`;
  }
  const hand = inRound ? mine.hand.slice().sort((a,b)=>sortKey(a).localeCompare(sortKey(b))) : [];
  const canCall = inRound && !over && (((myTurn || jumps.length) && hand.length === 2 && !t.called.includes(me.pid)) || t.exposed === me.pid);
  const fresh = c => prevHand && !prevHand.has(c);
  const deckName = DECKS.find(d=>d[0] === deck)[1];
  $("#stage").innerHTML = `
    <div class="arena c-${t.color}" id="arena">
      <div class="felt"><span class="halo"></span></div>
      <span class="spot" id="spot"></span>
      <div class="dirring ${t.dir === 1 ? "" : "ccw"}" id="dirring" title="${t.dir === 1 ? "Play goes clockwise" : "Play goes anticlockwise"}">${DIRSVG}</div>
      <div class="center">
        <button class="pile ${myTurn && !mine.drawn ? "can" : ""}" id="deck" ${myTurn && !mine.drawn ? "" : "disabled"} aria-label="Draw a card">${backHTML()}${backHTML()}${backHTML()}<span class="count">${t.deck} left</span></button>
        <div class="discard" id="discard">${[...(t.under || []), t.top].map((c,i,all)=>cardHTML(c, i === all.length - 1 ? "top" : "under", "div", `style="--r:${tilt(c)}"`)).join("")}
          <span class="dot" title="Colour to match: ${NAMES[t.color]}">${SUIT[t.color]}</span>
          ${t.pending ? `<span class="pending">+${t.pending}</span>` : ""}</div>
      </div>
      ${seats.map(seat).join("")}
    </div>
    <div class="status ${myTurn ? "mine" : jumps.length ? "jumpable" : ""}">${status}</div>
    <div class="feed" aria-live="polite"><span>${over ? "" : esc(lastLine)}</span>${speed && !over ? `<span class="modechip">SPEED</span>` : ""}<button type="button" class="modechip deckchip" data-deck-next title="Change the card style">Cards: ${deckName}</button></div>
    ${over ? roundOver() : inRound ? `
    <div class="hand ${myTurn || jumps.length ? "live" : ""}" id="hand">${hand.map(c=>{ const ok = mine.canPlay.includes(c) || jumps.includes(c);
      return cardHTML(c, (ok ? "ok" : "") + (jumps.includes(c) && !myTurn ? " jump" : "") + (mine.drawn === c ? " drawn" : "") + (fresh(c) ? " dealt" : ""), "button", `data-card="${esc(c)}" ${ok ? "" : "tabindex='-1'"}`); }).join("")}</div>
    <div class="actions">
      ${myTurn && !mine.drawn ? `<button class="btn" data-do="draw">${t.pending ? `Take ${t.pending}` : "Draw a card"}</button>` : ""}
      ${myTurn && mine.drawn ? `<button class="btn" data-do="pass">Pass</button>` : ""}
      ${canCall ? `<button class="btn callbtn ${t.exposed === me.pid ? "urgent" : ""}" data-do="call">Last card!</button>` : ""}
    </div>` : ""}`;
  prevHand = new Set(hand);
  layoutHand();
  glideHand();
  aimSpot(true);
  runFx();
}

/* the hand: one fanned row that fits the screen */
function layoutHand(){
  const hand = $("#hand"); if(!hand) return;
  const cards = [...hand.children], n = cards.length; if(!n) return;
  const w = cards[0].offsetWidth, W = hand.clientWidth - 28 - w * .3;  // the edge cards tilt out a little
  let step = n > 1 ? Math.min(w * .8, (W - w) / (n - 1)) : w;
  const min = Math.max(24, w * .32), scroll = step < min;
  if(scroll) step = min;
  hand.classList.toggle("scroll", scroll);
  const mid = (n - 1) / 2, spread = scroll ? 0 : Math.min(3.5, 26 / n), bend = scroll ? 0 : Math.min(1.7, 15 / n);
  cards.forEach((el, i)=>{ const k = i - mid;
    el.style.setProperty("--ov", (step - w).toFixed(1) + "px");
    el.style.setProperty("--rot", (k * spread).toFixed(2) + "deg");
    el.style.setProperty("--arc", (Math.abs(k) ** 1.5 * bend).toFixed(1) + "px");
  });
}
// cards that stayed in your hand slide from where they were to where they are now
function glideHand(){
  if(calm) return;
  document.querySelectorAll("#hand [data-card]").forEach(el=>{
    const o = handRects[el.dataset.card]; if(!o || el.classList.contains("dealt")) return;
    const r = el.getBoundingClientRect(), dx = o.left - r.left, dy = o.top - r.top;
    if(Math.abs(dx) + Math.abs(dy) < 2) return;
    el.animate([{translate:`${dx}px ${dy}px`}, {translate:"0 0"}], {duration:340, easing:"cubic-bezier(.25,.9,.3,1)"});
  });
}
addEventListener("resize", ()=>{ layoutHand(); aimSpot(false); });

/* the beam swings from the last player to the new one, the short way round */
function aimSpot(animate){
  const spot = $("#spot"), arena = $("#arena"), s = document.querySelector(".seat.turn .av");
  if(!spot || !arena) return;
  if(!s){ spot.style.opacity = 0; return; }
  const A = arena.getBoundingClientRect(), S = s.getBoundingClientRect();
  const dx = S.left + S.width/2 - (A.left + A.width/2), dy = S.top + S.height/2 - (A.top + A.height/2);
  const ang = Math.atan2(dy, dx) * 180 / Math.PI, len = Math.max(0, Math.hypot(dx, dy) - S.width * .62);
  const from = spotAngle ?? ang, to = from + (((ang - from) % 360) + 540) % 360 - 180;
  spot.style.transition = "none";
  spot.style.transform = `rotate(${from}deg)`; spot.style.width = (spotLen || len) + "px";
  if(animate){ spot.offsetWidth; spot.style.transition = ""; }
  spot.style.transform = `rotate(${to}deg)`; spot.style.width = len + "px";
  spotAngle = to; spotLen = len;
}

/* ---------- effects: cards flying, labels popping ---------- */
const center = r => [r.left + r.width/2, r.top + r.height/2];
const seatBox = pid => document.querySelector(`[data-seat="${CSS.escape(pid)}"] .av`)?.getBoundingClientRect() || $("#arena")?.getBoundingClientRect();
const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
// a copy of a card that travels in an arc from one box to another, ending at full size on `to`
function fly(html, from, to, {delay=0, size, endScale=1, fade=false, spin=0, endRot=0, lift=60, dur=520, done}={}){
  if(calm || !from || !to){ done && done(); return; }
  const w = size || to.width, el = document.createElement("div");
  el.className = "fly"; el.innerHTML = html; el.style.cssText = `width:${w}px;--cw:${w}px;left:${center(to)[0] - w/2}px;top:${center(to)[1] - w*1.44/2}px`;
  document.body.appendChild(el);
  const [fx_, fy] = center(from), [tx, ty] = center(to), s0 = Math.max(.35, Math.min(1.3, from.width / w));
  const sx = fx_ - tx, sy = fy - ty;
  const a = el.animate([
    {transform:`translate(${sx}px,${sy}px) scale(${s0}) rotate(${spin}deg)`, opacity:0},
    {opacity:1, offset:.08},
    {transform:`translate(${sx*.45}px,${sy*.45 - lift}px) scale(${Math.max(s0, endScale) * 1.08}) rotate(${(spin + endRot) / 2}deg)`, offset:.5},
    {transform:`translate(0,0) scale(${endScale}) rotate(${endRot}deg)`, opacity: fade ? 0 : 1}],
    {duration:dur, delay:delay*1000, easing:"cubic-bezier(.33,.75,.35,1)", fill:"backwards"});
  a.onfinish = ()=>{ el.remove(); done && done(); };
}
function pop(text, box, cls="", delay=0){
  if(!box) return;
  const el = document.createElement("div"); el.className = "pop " + cls; el.innerHTML = text;
  const [x, y] = center(box); el.style.left = x + "px"; el.style.top = y + "px";
  document.body.appendChild(el);
  const a = el.animate([
    {transform:"translate(-50%,-50%) scale(.3)", opacity:0},
    {transform:"translate(-50%,-50%) scale(1.08)", opacity:1, offset:.14},
    {transform:"translate(-50%,-50%) scale(1)", opacity:1, offset:.24},
    {transform:"translate(-50%,-90%) scale(1)", opacity:1, offset:.82},
    {transform:"translate(-50%,-120%) scale(.94)", opacity:0}],
    {duration: calm ? 1200 : 1500, delay:delay*1000, easing:"cubic-bezier(.3,.8,.4,1)", fill:"backwards"});
  a.onfinish = ()=>el.remove();
}
function confetti(box){
  if(calm || !box) return;
  const [x, y] = center(box), cols = ["var(--c-r)","var(--c-b)","var(--c-g)","var(--c-y)","var(--gold)","#fff"];
  for(let i = 0; i < 70; i++){
    const el = document.createElement("i"); el.className = "confetti";
    el.style.cssText = `left:${x}px;top:${y}px;background:${cols[i % cols.length]}`;
    document.body.appendChild(el);
    const ang = Math.random() * Math.PI * 2, v = 120 + Math.random() * 260;
    const dx = Math.cos(ang) * v, dy = Math.sin(ang) * v - 160;
    el.animate([{transform:"translate(-50%,-50%) rotate(0)", opacity:1},
      {transform:`translate(${dx}px,${dy}px) rotate(${Math.random()*720}deg)`, opacity:1, offset:.55},
      {transform:`translate(${dx*1.2}px,${dy + 380}px) rotate(${Math.random()*1080}deg)`, opacity:0}],
      {duration:1800 + Math.random()*900, easing:"cubic-bezier(.2,.7,.4,1)"}).onfinish = ()=>el.remove();
  }
}
// the top card lands: a little bounce and a ring in the colour now in play
function land(topEl){
  if(!topEl) return;
  topEl.style.opacity = "";
  if(calm) return;
  topEl.animate([{scale:"1.07"}, {scale:"1"}], {duration:260, easing:"cubic-bezier(.3,1.6,.5,1)"});
  const r = document.createElement("i"); r.className = "ripple"; $("#discard")?.appendChild(r); setTimeout(()=>r.remove(), 700);
}
function tableWave(){
  if(calm) return;
  const f = document.querySelector(".felt"); if(!f) return;
  const w = document.createElement("i"); w.className = "twave"; f.appendChild(w); setTimeout(()=>w.remove(), 760);
}
function runFx(){
  const list = fx.splice(0), deckBox = $("#deck")?.getBoundingClientRect(), discard = $("#discard")?.getBoundingClientRect();
  const topEl = document.querySelector("#discard .card.top");
  const sfx = window.Juice?.sfx;
  let d = 0;
  for(const e of list){
    const mine = e.pid === me.pid;
    if(e.what === "play"){
      const from = mine && handRects[e.card] ? handRects[e.card] : seatBox(e.pid);
      const isTop = e.card === room.table.top && topEl;
      if(isTop && !calm) topEl.style.opacity = 0;
      const v = valueOf(e.card);
      fly(cardHTML(e.card), from, discard, {delay:d, spin: mine ? -6 : 160, endRot: tilt(e.card), lift: mine ? 40 : 70, done: ()=>{
        if(isTop) land(topEl);
        if(v === "W4"){ sfx?.boom(); tableWave(); window.Juice?.shake($("#arena"), 7); }
        else if(v === "W"){ sfx?.wild(); tableWave(); }
        else if(v === "D"){ sfx?.boom(); tableWave(); window.Juice?.shake($("#arena"), 5); }
        else { sfx?.card(); }
      }});
      if(v === "W4") pop("+4", discard, "red", d + .45);
      else if(v === "D") pop("+2", discard, "red", d + .45);
      d += .18;
    } else if(e.what === "drew" && !mine){
      const n = Math.min(e.n || 0, 6);
      for(let i = 0; i < n; i++){
        setTimeout(()=>sfx?.deal(), (d + i * .09) * 1000);
        fly(backHTML(), deckBox, seatBox(e.pid), {delay:d + i*.09, size: deckBox?.width, endScale:.42, fade:true, lift:30, dur:460});
      }
      if(e.forced) pop(`+${e.n}`, seatBox(e.pid), "red", d + .2);
      d += .1;
    } else if(e.what === "drew" && mine && e.forced){
      pop(`+${e.n}`, seatBox(e.pid), "red", d + .2);
    } else if(e.what === "skip"){
      setTimeout(()=>sfx?.warn(), (d + .25) * 1000);
      pop("Blocked", seatBox(e.pid), "red", d + .3);
    } else if(e.what === "reverse"){
      setTimeout(()=>sfx?.reverse(), (d + .2) * 1000);
      $("#dirring")?.classList.add("flip");
      tableWave();
      pop("⇄ Turned back", discard, "gold", d + .3);
    } else if(e.what === "call"){
      sfx?.turn();
      pop("Last card!", seatBox(e.pid), "gold", d);
    } else if(e.what === "caught"){
      sfx?.boom(); window.Juice?.shake($("#arena"), 8);
      pop(`Caught! +${e.n}`, seatBox(e.pid), "red", d);
      if(!mine) for(let i = 0; i < Math.min(e.n, 4); i++) fly(backHTML(), deckBox, seatBox(e.pid), {delay:d + .2 + i*.09, size: deckBox?.width, endScale:.42, fade:true, lift:30, dur:460});
    } else if(e.what === "jump"){
      sfx?.wild(); tableWave();
      pop(mine ? "You jumped in!" : `${esc(P(e.pid).name)} jumps in!`, $("#arena")?.getBoundingClientRect(), "red big", d);
      const ar = $("#arena"); ar?.classList.remove("shake"); ar?.offsetWidth; ar?.classList.add("shake");
      buzz([60,40,60]);
    } else if(e.what === "won"){
      sfx?.win();
      confetti(seatBox(e.pid));
      setTimeout(()=>confetti(seatBox(e.pid)), 500);
    } else if(e.what === "myturn"){
      setTimeout(()=>sfx?.turn(), (d + .25) * 1000);
      pop("Your turn", $("#arena")?.getBoundingClientRect(), "gold big", d + .35);
    }
  }
  // new cards in your hand fly in from the deck face down, and flip over as they land
  const dealt = [...document.querySelectorAll("#hand .card.dealt")];
  dealt.forEach((el, i)=>{
    if(calm) return;
    el.style.opacity = 0;
    const r = el.getBoundingClientRect();
    const wait = d + i * (dealt.length > 4 ? .06 : .1);
    setTimeout(()=>sfx?.deal(), wait * 1000);
    fly(backHTML(), deckBox, r, {delay: wait, size: el.offsetWidth, spin: 24, lift: 40, dur: 480,
      done: ()=>{ el.style.opacity = ""; el.animate([{rotate:"y 90deg"}, {rotate:"y 0deg"}], {duration:240, easing:"ease-out"}); }});
  });
}
// your hand sorted by colour, then value, wilds last
const sortKey = c => { const col = colorOf(c) || "z", v = valueOf(c); return col + (v.length === 1 && /\d/.test(v) ? "0" + v : "1" + v); };
function roundOver(){
  const t = room.table, w = t.winner;
  const ps = t.order.slice().sort((a,b)=>(room.wins[b]||0)-(room.wins[a]||0));
  return `<div class="winner fadeup"><h2 style="font-size:clamp(30px,8vw,44px)">${w === me.pid ? "You win the round!" : `${esc(P(w).name)} wins the round!`}</h2>
    <p class="sub">${hostKey ? "Deal again when everyone's ready." : "Waiting for the host to deal again."}</p></div>
    <div class="hands">${ps.map(pid=>`<div class="row">${face(pid)}<b>${esc(P(pid).name)}</b>${(t.hands?.[pid]||[]).map(c=>cardHTML(c)).join("")}<span class="wins">${room.wins[pid]||0} win${(room.wins[pid]||0) === 1 ? "" : "s"}</span></div>`).join("")}</div>`;
}

/* ---------- moves ---------- */
async function play(card, color){
  try{ await act("play", {card, color}); }catch(err){ toast(err.message); }
}
function pickColor(card){
  picking = card;
  const box = document.createElement("div"); box.className = "scrim";
  box.innerHTML = `<div class="picker" role="dialog" aria-label="Pick a colour"><h2>Pick a colour</h2><div class="opts">${["r","b","g","y"].map(c=>`<button type="button" data-color="${c}" style="--pc:var(--c-${c})">${SUIT[c]}${NAMES[c]}</button>`).join("")}</div><button type="button" class="x">Cancel</button></div>`;
  document.body.appendChild(box);
  box.onclick = e=>{
    const c = e.target.closest("[data-color]");
    if(c){ box.remove(); play(card, c.dataset.color); picking = null; return; }
    if(e.target === box || e.target.closest(".x")){ box.remove(); picking = null; }
  };
}
BackGuard.onBack(()=>{ const s = document.querySelector(".scrim"); if(s){ s.remove(); picking = null; return true; } return false; });
document.addEventListener("click", async e=>{
  const c = e.target.closest("#hand [data-card]"), d = e.target.closest("[data-do]"), deckEl = e.target.closest("#deck"), k = e.target.closest("[data-catch]");
  const h = e.target.closest("[data-host]"), kick = e.target.closest("[data-kick]");
  const dk = e.target.closest("[data-deck]"), dn = e.target.closest("[data-deck-next]");
  if(dk){ setDeck(dk.dataset.deck); return; }
  if(dn){ const i = DECKS.findIndex(x=>x[0] === deck); setDeck(DECKS[(i + 1) % DECKS.length][0]); return; }
  if(c){
    if(!c.classList.contains("ok")){ if(room.table.turn === me.pid) toast("That one doesn't match. Same colour or symbol, or draw."); else if(room.settings.mode === "speed") toast("Not your turn. In Speed you can only jump in with the exact same card."); return; }
    const card = c.dataset.card;
    kind(card).startsWith("W") ? pickColor(card) : play(card);
  }
  if(deckEl && !deckEl.disabled){ act("draw").catch(err=>toast(err.message)); }
  if(d){ act(d.dataset.do).catch(err=>toast(err.message)); }
  if(k){ act("catch").catch(err=>toast(err.message)); }
  if(h){ try{ await act(h.dataset.host); }catch(err){ toast(err.message); } }
  if(kick){ if(kick.dataset.sure !== "1"){ kick.dataset.sure = "1"; kick.textContent = "Sure?"; return; } act("kick", {pid:kick.dataset.kick}).catch(err=>toast(err.message)); }
});
$("#hCode").onclick = async ()=>{
  if(!code) return;
  const link = location.origin + "/lantern?room=" + code;
  try{ await navigator.clipboard.writeText(link); toast(`Invite link copied · ${code}`); }
  catch(e){ toast(link); }
};

/* ---------- host controls, timer ---------- */
function renderHostbar(){
  const bar = $("#hostbar"), ph = room?.phase;
  if(!hostKey || !room || !me || !room.players[me.pid]){ bar.hidden = true; return; }
  const b = [];
  if(ph === "playing") b.push('<button class="btn small" data-host="skip">Skip this turn</button><button class="btn small" data-host="tolobby">End round</button>');
  if(ph === "roundover") b.push('<button class="btn small" data-host="tolobby">House rules</button><button class="btn primary" data-host="playagain">Deal again</button>');
  bar.hidden = !b.length; bar.innerHTML = b.join("");
}
function tickTimer(){
  const el = $("#timer");
  if(!room || !room.deadline || room.phase !== "playing"){ el.hidden = true; return; }
  const left = Math.max(0, Math.ceil(room.deadline - serverNow()));
  el.hidden = false; el.textContent = `${Math.floor(left/60)}:${String(left%60).padStart(2,"0")}`;
  el.classList.toggle("low", left <= 5);
  const ring = document.querySelector(".seat.turn .tring");
  if(ring){ const total = room.settings.mode === "speed" ? 10 : room.settings.turnSec || 30;
    const p = Math.max(0, Math.min(1, (room.deadline - serverNow()) / total)); ring.style.setProperty("--p", p.toFixed(3)); ring.classList.toggle("low", p < .34); }
}
setInterval(tickTimer, 100);

const c0 = (new URLSearchParams(location.search).get("room")||"").toUpperCase();
if(c0) openRoom(c0); else home();
</script>
</body>
</html>
