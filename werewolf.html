<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05060f">
<title>Werewolf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: the whole game happens around one round table under the night sky. You always sit at the
   bottom seat; the table's center shows the phase, the clock and what just happened. Votes are arrows
   across the table. Role cards flip in 3D for the big reveals. */
:root{
  --ink:#05060f; --night1:#070a1c; --night2:#141238; --fg:#efeaf7; --muted:#9a95b4; --line:rgba(205,195,255,.14); --line2:rgba(205,195,255,.28);
  --glass:rgba(16,14,40,.66); --glass2:rgba(255,255,255,.07);
  --moon:#ffe9b0; --blood:#e3264b; --blood2:#7d0f2a; --gold:#f2c35b; --mint:#53e3a6; --violet:#9d7bff;
  --wolf1:#7d0f2a; --wolf2:#e3264b; --seer1:#3b1d86; --seer2:#9d7bff; --doc1:#0d5c45; --doc2:#53e3a6;
  --hunt1:#7a4a07; --hunt2:#f2a33a; --vill1:#1f3557; --vill2:#6fa8ff;
  --wood1:#3a2516; --wood2:#1d120a;
  --display:"Cinzel","Times New Roman",serif; --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--ink);color:var(--fg);font:15px/1.55 var(--body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--moon);outline-offset:3px}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:.02em}
.muted{color:var(--muted)}

/* ---------- sky ---------- */
.scene{position:fixed;inset:0;z-index:0;overflow:hidden;background:linear-gradient(180deg,var(--night1),var(--night2) 70%,#1d1440);transition:background 2.5s ease}
.scene .stars{position:absolute;inset:0;transition:opacity 2.5s}
.scene .stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;animation:twinkle 3s infinite ease-in-out}
@keyframes twinkle{50%{opacity:.25}}
.moon{position:absolute;right:5%;top:3%;width:min(18vw,120px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fffaf0,var(--moon) 55%,#e0bf73);box-shadow:0 0 60px 20px rgba(255,233,176,.22);transition:transform 2.5s ease,opacity 2.5s}
.sun{position:absolute;left:50%;bottom:-40%;width:min(46vw,300px);aspect-ratio:1;border-radius:50%;transform:translateX(-50%);background:radial-gradient(circle,#fff3c4,#ffb347 60%,#ff7a3d);box-shadow:0 0 120px 50px rgba(255,150,70,.35);opacity:0;transition:bottom 3s cubic-bezier(.2,.7,.2,1),opacity 2s}
.trees{position:absolute;left:0;right:0;bottom:0;height:20vh;opacity:.9}
.fog{position:absolute;left:-50%;width:200%;height:30vh;bottom:4vh;background:radial-gradient(closest-side,rgba(180,170,230,.10),transparent);filter:blur(10px);animation:drift 40s linear infinite}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(25%)}}
body.s-dawn .scene{background:linear-gradient(180deg,#2a1f5c,#b4527a 55%,#f39a5d)}
body.s-dawn .sun{bottom:4%;opacity:1}
body.s-dawn .moon,body.s-day .moon{transform:translateY(-140%);opacity:0}
body.s-dawn .stars,body.s-day .stars{opacity:0}
body.s-day .scene{background:linear-gradient(180deg,#22305c,#4a5f96 55%,#8d7aa8)}
body.s-day .sun{bottom:62%;opacity:.85;left:16%}
body.s-vote .scene{background:linear-gradient(180deg,#1a0716,#4a0f26 60%,#8a1f3a)}
body.s-vote .moon{opacity:.2}
body.s-vote .stars{opacity:.3}
body.s-wolves .scene{background:linear-gradient(180deg,#12020a,#3d0618 60%,#7d0f2a)}
body.s-wolves .moon{background:radial-gradient(circle at 35% 35%,#ffd6d6,#ff5470 60%,#9a1030);box-shadow:0 0 80px 30px rgba(227,38,75,.35)}
body.s-village .scene{background:linear-gradient(180deg,#1d2b55,#6e5fa0 50%,#f0b15f)}
body.s-village .sun{bottom:30%;opacity:1}
body.s-village .moon{opacity:0}

/* ---------- frame ---------- */
.app{position:relative;z-index:1;min-height:100vh}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));background:linear-gradient(180deg,rgba(5,6,15,.85),rgba(5,6,15,0))}
.top a{color:var(--muted);text-decoration:none;font-weight:700}
.top h1{font-size:17px;font-weight:800}
.code{font-family:var(--display);font-weight:800;letter-spacing:.2em;font-size:13px;border:1px solid var(--line2);border-radius:999px;padding:3px 12px;background:var(--glass)}
.spacer{flex:1}
.stage{width:min(720px,100%);margin:0 auto;padding:0 max(14px,env(safe-area-inset-left,0px)) calc(110px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-right,0px))}
.panel{background:var(--glass);border:1px solid var(--line);border-radius:20px;padding:18px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:grid;gap:12px}
.title{font-size:clamp(28px,7.5vw,48px);font-weight:900;line-height:1.05;text-align:center;text-shadow:0 4px 30px rgba(0,0,0,.6)}
.sub{text-align:center;color:var(--muted);margin:6px 0 0}
.eyebrow{text-align:center;font-size:12px;font-weight:800;letter-spacing:.24em;text-transform:uppercase;color:var(--moon)}
.btn{border:1px solid var(--line2);background:var(--glass2);border-radius:999px;padding:11px 20px;font-weight:800;transition:transform .12s,background .2s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:linear-gradient(135deg,var(--moon),var(--gold));color:#2a1a00;border-color:transparent;box-shadow:0 10px 30px -10px rgba(242,195,91,.7)}
.btn.blood{background:linear-gradient(135deg,var(--blood),var(--blood2));border-color:transparent;color:#fff}
.btn.small{padding:6px 13px;font-size:13px}
.btn.wide{width:100%}
label{display:block;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
input[type=text],select{width:100%;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:14px;padding:11px 14px;outline:none;color:var(--fg)}
input[type=text]:focus,select:focus{border-color:var(--moon)}
select option{background:#14122e}
.err{color:#ff8fa3;font-size:14px;min-height:1.4em}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
@media (max-width:520px){.row3{grid-template-columns:1fr 1fr}}
.toggles{display:flex;flex-wrap:wrap;gap:8px}
.tg{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:7px 14px;background:rgba(0,0,0,.25);font-weight:700;font-size:14px}
.tg.on{border-color:var(--moon);background:rgba(255,233,176,.1)}
.tg i{width:10px;height:10px;border-radius:50%}
.hint{font-size:13px;color:var(--muted);margin:0}

/* ---------- the round table ---------- */
.tablewrap{position:relative;width:min(100%,600px);aspect-ratio:1;margin:22px auto 0}
.tabletop{position:absolute;inset:20%;border-radius:50%;background:radial-gradient(circle at 50% 42%,rgba(255,200,120,.22),transparent 55%),radial-gradient(circle,var(--wood1),var(--wood2) 75%);box-shadow:0 0 0 6px rgba(255,220,170,.08),0 0 0 14px rgba(0,0,0,.35),0 30px 80px -10px rgba(0,0,0,.9),inset 0 0 50px rgba(0,0,0,.7);display:grid;place-items:center;text-align:center;padding:12%}
.tabletop::after{content:"";position:absolute;inset:9%;border-radius:50%;border:1px solid rgba(255,220,170,.12)}
.center{position:relative;z-index:1;display:grid;gap:4px;justify-items:center}
.center .ico{width:clamp(34px,10vw,58px);aspect-ratio:1;border-radius:50%}
.center .ico.moonico{background:radial-gradient(circle at 35% 35%,#fffaf0,var(--moon) 60%,#c99d47);box-shadow:0 0 30px rgba(255,233,176,.6);animation:glow 3s ease-in-out infinite}
.center .ico.sunico{background:radial-gradient(circle,#fff3c4,#ffb347 60%,#ff7a3d);box-shadow:0 0 30px rgba(255,150,70,.6)}
.center .ico.voteico{background:radial-gradient(circle,#ff8aa0,var(--blood) 60%,var(--blood2));box-shadow:0 0 30px rgba(227,38,75,.6);animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{transform:scale(1.08)}}
.center h2{font-size:clamp(14px,4.2vw,24px);font-weight:900;line-height:1.1}
.center .clock{font-family:var(--display);font-weight:900;font-size:clamp(18px,5.5vw,30px);font-variant-numeric:tabular-nums;color:var(--moon)}
.center .clock.low{color:var(--blood);animation:glow 1s infinite}
.center .small{font-size:clamp(10px,2.8vw,13px);color:var(--muted);font-weight:700}
.seat{position:absolute;left:var(--x);top:var(--y);transform:translate(-50%,-50%);display:grid;justify-items:center;gap:3px;width:var(--sz);border:0;background:none;padding:0;transition:transform .2s,filter .4s;z-index:2}
.seat .av{width:var(--sz);height:var(--sz);border-radius:50%;overflow:hidden;border:3px solid rgba(255,255,255,.22);background:#221d48;display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:calc(var(--sz)*.38);color:#0b0820;box-shadow:0 10px 24px -8px rgba(0,0,0,.95);position:relative}
.seat .av img{width:100%;height:100%;object-fit:cover;object-position:top}
.seat .nm{font-weight:800;font-size:12px;max-width:calc(var(--sz) + 34px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 2px 6px #000;background:rgba(5,6,15,.55);border-radius:999px;padding:0 7px}
.seat.me .av{border-color:var(--moon)}
.seat.pick{cursor:pointer}
.seat.pick:hover{transform:translate(-50%,-50%) scale(1.07)}
.seat.sel .av{border-color:var(--moon);box-shadow:0 0 0 4px rgba(255,233,176,.3),0 0 26px rgba(255,233,176,.55)}
.seat.redsel .av{border-color:var(--blood);box-shadow:0 0 0 4px rgba(227,38,75,.35),0 0 26px rgba(227,38,75,.6)}
.seat.off{cursor:not-allowed}
.seat.dead .av{filter:grayscale(1) brightness(.55)}
.seat.dead .av::after{content:"";position:absolute;inset:0;background:linear-gradient(45deg,transparent 46%,var(--blood) 46% 54%,transparent 54%)}
.seat.dying{animation:shake .5s 3}
@keyframes shake{25%{transform:translate(-53%,-50%)}75%{transform:translate(-47%,-50%)}}
.seat .tag{position:absolute;top:-6px;right:-8px;font-size:9px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;border-radius:999px;padding:2px 6px;color:#fff;background:var(--c1,#333);border:1px solid var(--c2,#666);white-space:nowrap}
.seat .cnt{position:absolute;top:-4px;left:-6px;min-width:22px;height:22px;border-radius:999px;background:var(--blood);color:#fff;font-weight:900;font-size:12px;display:grid;place-items:center;padding:0 5px;box-shadow:0 0 12px rgba(227,38,75,.7);animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.3)}}
.lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;overflow:visible}
.lines path{fill:none;stroke-width:.7;stroke-linecap:round;stroke-dasharray:200;stroke-dashoffset:0}
.lines path.new{animation:draw .6s ease-out}
@keyframes draw{from{stroke-dashoffset:200}}
.r-wolf{--c1:var(--wolf1);--c2:var(--wolf2)} .r-seer{--c1:var(--seer1);--c2:var(--seer2)} .r-doctor{--c1:var(--doc1);--c2:var(--doc2)}
.r-hunter{--c1:var(--hunt1);--c2:var(--hunt2)} .r-villager{--c1:var(--vill1);--c2:var(--vill2)}

/* under the table */
.info{margin-top:8px;display:grid;gap:10px}
.say{font-family:var(--display);font-weight:600;font-size:clamp(15px,4vw,19px);line-height:1.5;text-align:center;text-shadow:0 2px 14px rgba(0,0,0,.7);padding:0 6px}
.myrole{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 12px;font-weight:800;font-size:13px;border:1px solid var(--line2);background:var(--glass)}
.chip.role{background:var(--c1);border-color:var(--c2)}
.chip svg{width:18px;height:18px}

/* ---------- cards ---------- */
.cardwrap{perspective:1400px;display:grid;justify-items:center;margin:16px 0 8px}
.card{position:relative;width:min(280px,74vw);aspect-ratio:5/7.4;transform-style:preserve-3d;transition:transform 1s cubic-bezier(.3,1.25,.4,1);cursor:pointer}
.card.flip{transform:rotateY(180deg)}
.card .side{position:absolute;inset:0;border-radius:22px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;box-shadow:0 30px 70px -20px rgba(0,0,0,.95),inset 0 0 0 2px rgba(255,236,190,.35)}
.card .back{background:radial-gradient(circle at 50% 38%,rgba(255,233,176,.25),transparent 40%),repeating-linear-gradient(45deg,#16123a 0 14px,#1b1646 14px 28px);display:grid;place-items:center}
.card .back::before{content:"";position:absolute;inset:12px;border:2px solid rgba(255,233,176,.35);border-radius:14px}
.card .back .mn{width:42%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fffaf0,var(--moon) 60%,#c99d47);box-shadow:0 0 50px rgba(255,233,176,.5)}
.card .back .tap{position:absolute;bottom:14%;font-family:var(--display);font-weight:800;letter-spacing:.2em;font-size:13px;color:var(--moon);animation:breathe 2s infinite}
@keyframes breathe{50%{opacity:.4}}
.card .front{transform:rotateY(180deg);display:grid;grid-template-rows:auto auto 1fr auto;justify-items:center;gap:4px;padding:18px;text-align:center;background:linear-gradient(165deg,var(--c1),#0b0820 85%)}
.card .front::before{content:"";position:absolute;inset:10px;border:2px solid rgba(255,236,190,.4);border-radius:15px;pointer-events:none}
.card .front .owner{width:52px;height:52px;border-radius:50%;overflow:hidden;border:2px solid rgba(255,255,255,.6);display:grid;place-items:center;font-weight:900;color:#0b0820;background:#333}
.card .front .owner img{width:100%;height:100%;object-fit:cover;object-position:top}
.card .front .rname{font-family:var(--display);font-weight:900;font-size:26px;letter-spacing:.06em;color:#fff;text-shadow:0 2px 12px var(--c2)}
.card .front svg{width:58%;margin:auto;filter:drop-shadow(0 0 22px var(--c2))}
.card .front .desc{font-size:13px;line-height:1.45;color:#e7e1f5}
.card .stamp{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-12deg) scale(2.4);opacity:0;font-family:var(--display);font-weight:900;font-size:20px;letter-spacing:.12em;color:var(--blood);border:4px solid var(--blood);border-radius:10px;padding:4px 12px;background:rgba(10,0,6,.6);white-space:nowrap;animation:slam .5s 1.4s cubic-bezier(.2,1.6,.4,1) forwards;backface-visibility:hidden}
@keyframes slam{to{opacity:1;transform:translate(-50%,-50%) rotate(-12deg) scale(1)}}
.reveal-pop{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:rgba(5,4,15,.55);backdrop-filter:blur(3px);animation:fadein .4s;pointer-events:none}
@keyframes fadein{from{opacity:0}}
.reveal-pop .card{width:min(230px,62vw)}
.minicards{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;margin-top:14px;perspective:1000px}
.minicards .card{width:100%;cursor:default}
.minicards .card .front{padding:10px;grid-template-rows:auto auto 1fr auto auto;gap:2px}
.minicards .card .front .owner{width:36px;height:36px;font-size:13px}
.minicards .card .front .rname{font-size:14px}
.minicards .card .front svg{width:52%}
.minicards .card .front .desc{font-size:12px;font-weight:800}
.minicards .card .st{font-family:var(--display);font-weight:900;font-size:10px;letter-spacing:.14em;border:2px solid currentColor;border-radius:6px;padding:0 6px;color:var(--mint)}
.minicards .card.dead .st{color:var(--blood)}
.banner{font-family:var(--display);font-weight:900;font-size:clamp(32px,9.5vw,68px);text-align:center;line-height:1;letter-spacing:.04em;margin-top:10px;animation:rise 1.4s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes rise{from{opacity:0;transform:translateY(30px) scale(.9);letter-spacing:.3em}}
.banner.wolves{color:#ff5a78;text-shadow:0 0 40px rgba(227,38,75,.8)}
.banner.village{color:var(--gold);text-shadow:0 0 40px rgba(242,195,91,.7)}
.timeline{display:grid;gap:6px;margin-top:6px}
.timeline div{display:flex;gap:10px;align-items:center;font-size:14px}
.timeline b{font-family:var(--display);min-width:64px;color:var(--moon)}
.vision{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(5,4,20,.9);backdrop-filter:blur(6px);padding:20px;animation:fadein .4s}
.vision .orb{width:140px;aspect-ratio:1;border-radius:50%;margin:0 auto 18px;background:radial-gradient(circle at 40% 35%,#fff,var(--violet) 45%,#2a1060);box-shadow:0 0 80px 20px rgba(157,123,255,.5);animation:glow 2.4s ease-in-out infinite}
.drum{font-family:var(--display);font-weight:900;font-size:clamp(26px,7vw,40px);text-align:center}
.fadeup{animation:fadeup .7s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes fadeup{from{opacity:0;transform:translateY(18px)}}
.hostbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(0deg,rgba(5,6,15,.95),rgba(5,6,15,.6));border-top:1px solid var(--line)}
.hostbar .lbl{font-size:11px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:50;background:var(--moon);color:#2a1a00;font-weight:800;border-radius:999px;padding:10px 20px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.me-pic{display:flex;align-items:center;gap:14px}
.me-pic button{width:70px;height:70px;border-radius:50%;overflow:hidden;border:3px dashed var(--line2);display:grid;place-items:center;background:rgba(0,0,0,.3);flex:none;font-size:12px;color:var(--muted);padding:0}
.me-pic button img{width:100%;height:100%;object-fit:cover;object-position:top}
details summary{cursor:pointer;font-weight:800}
.rolelist{display:grid;gap:8px;margin-top:10px}
.rolelist div{display:grid;grid-template-columns:36px 1fr;gap:10px;align-items:center;font-size:14px}
.rolelist svg{width:34px;filter:drop-shadow(0 0 8px var(--c2))}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body class="s-night">
<div class="scene" aria-hidden="true">
  <div class="stars" id="stars"></div><div class="moon"></div><div class="sun"></div><div class="fog"></div>
  <svg class="trees" viewBox="0 0 1200 200" preserveAspectRatio="none"><path fill="#04050c" d="M0 200 L0 140 L30 90 L45 130 L70 60 L95 130 L110 100 L130 140 L160 70 L190 140 L220 110 L240 150 L270 80 L300 150 L340 120 L360 150 L400 90 L430 150 L470 130 L500 160 L540 100 L570 160 L620 140 L650 170 L700 110 L730 160 L770 130 L800 165 L840 90 L870 160 L900 120 L930 160 L970 70 L1000 150 L1030 120 L1060 160 L1100 80 L1130 150 L1160 110 L1200 140 L1200 200 Z"/></svg>
</div>
<div class="app">
  <header class="top"><a href="/" aria-label="All games">&larr;</a><h1>Werewolf</h1><span class="code" id="hCode" hidden></span><span class="spacer"></span></header>
  <main class="stage" id="stage"></main>
</div>
<div class="hostbar" id="hostbar" hidden></div>
<div class="toast" id="toast" hidden></div>
<div id="overlay"></div>
<script src="/avatars.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hue = n => { let h=0; for(const c of String(n)) h=(h*31+c.charCodeAt(0))%360; return `hsl(${h} 80% 72%)`; };
function store(k, v){ try{ if(v===undefined) return JSON.parse(localStorage.getItem(k)); localStorage.setItem(k, JSON.stringify(v)); }catch(e){ return null; } }
function toast(m){ const t=$("#toast"); t.textContent=m; t.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>t.hidden=true,2600); }
const buzz = p => { try{ if(navigator.vibrate && navigator.userActivation?.hasBeenActive) navigator.vibrate(p); }catch(e){} };
async function api(path, body){
  const r = await fetch(path, body ? {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)} : {});
  const j = await r.json().catch(()=>({error:"The server didn't answer. Try again."}));
  if(!r.ok) throw new Error(j.error || "Something went wrong");
  return j;
}

/* ---------- state ---------- */
let code=null, room=null, me=null, hostKey=null, pollGen=0, clockOffset=0, revealed=false, lastLines=new Set();
const serverNow = () => Date.now()/1000 + clockOffset;
const act = (a, extra={}) => api(`/api/rooms/${code}/${a}`, {hostKey, ...(me||{}), ...extra});

const pic = (pid, cls="") => { const p = P(pid), src = Avatars.src(p); return `<span class="${cls}" style="background:${hue(p.name)}">${src?`<img src="${esc(src)}" alt="" referrerpolicy="no-referrer">`:esc(p.name[0].toUpperCase())}</span>`; };
const inGame = () => Object.keys(room.players).filter(pid=>!P(pid).spectator);  // late joiners watch from outside the table

/* ---------- home and join ---------- */
function home(){

  $("#stage").innerHTML = `<div class="fadeup" style="margin-top:6vh"><div class="eyebrow">A party game of lies</div><h1 class="title" style="font-size:clamp(46px,13vw,90px)">Werewolf</h1>

  $("#createForm").onsubmit = async e=>{ e.preventDefault(); const n = $("#cName").value.trim(); if(!n){ $("#cErr").textContent="Enter your name."; return; }

    try{ const m = await api(`/api/rooms/${c}/join`, {name:n}); store("ww:"+c, {...(store("ww:"+c)||{}), me:m}); openRoom(c); }catch(err){ $("#jErr").textContent = err.message; } };

function openRoom(c){
  code = c; const s = store("ww:"+c) || {}; me = s.me || null; hostKey = s.hostKey || null;
  history.replaceState(null, "", "/werewolf?room="+c); $("#hCode").hidden = false; $("#hCode").textContent = c;
  poll(++pollGen, -1);
}
async function poll(gen, v){
  while(gen === pollGen){
    try{
      const who = me ? `&pid=${me.pid}&key=${me.key}` : "";
      const r = await fetch(`/api/rooms/${code}?v=${v}${who}`);
      if(r.status === 404){ history.replaceState(null,"","/werewolf"); home(); $("#jErr").textContent = "That game doesn't exist anymore."; return; }
      const d = await r.json(); if(gen !== pollGen) return;
      clockOffset = d.now - Date.now()/1000;
      const prev = room; room = d; v = d.version;
      if(me && !room.players[me.pid]){ me = null; store("ww:"+code, {hostKey}); toast("You were removed from this game"); }
      if(prev && prev.phase !== room.phase){
        if(room.phase === "roles" || room.phase === "lobby") revealed = false;
        if(room.phase === "roles") buzz([60,40,60]);
        if(room.phase === "night") buzz(120);
        if(room.current?.dead?.includes(me?.pid)) buzz([300,100,300]);
        lastLines = new Set();
      }
      render();
    }catch(e){ await new Promise(r=>setTimeout(r,2000)); }
  }
}

/* ---------- render ---------- */
let lastSig = "";
function render(){
  const ph = room.phase;
  const scene = {dawn:"s-dawn", day:"s-day", vote:"s-vote", verdict:"s-vote", hunter:"s-vote", shot:"s-vote", final: room.winner==="wolves"?"s-wolves":"s-village"}[ph] || "s-night";
  document.body.className = scene;
  renderHostbar(); tick();
  if(!me || !room.players[me.pid]) return gate();
  const sig = JSON.stringify([ph, room.day, room.players, room.current?.id, room.votes, room.myNight, room.seerLog, room.settings, room.me, room.acted, revealed]);
  if(sig === lastSig) return;
  lastSig = sig;
  if(ph === "lobby") lobby();
  else if(ph === "roles") rolesView();
  else if(ph === "final") final();
  else tableView();
}
function gate(){
  $("#stage").innerHTML = `<form class="panel fadeup" id="gate" style="margin-top:8vh"><div class="eyebrow">There's a free seat</div><h2 style="font-size:26px;text-align:center">Join this table</h2>

  $("#gate").onsubmit = async e=>{ e.preventDefault(); const n = $("#gName").value.trim(); if(!n) return;
    try{ me = await api(`/api/rooms/${code}/join`, {name:n}); store("ww:"+code, {me, hostKey}); lastSig=""; poll(++pollGen, -1); }catch(err){ $("#gErr").textContent = err.message; } };
}

/* ---------- the table ---------- */
// seats go around the circle with you at the bottom
function seatOrder(){
  const ids = inGame();
  const i = ids.indexOf(me.pid);
  return i < 0 ? ids : ids.slice(i).concat(ids.slice(0, i));
}
function seatPos(ids){
  const n = ids.length, pos = {};
  ids.forEach((pid, i)=>{ const a = Math.PI/2 + i * 2*Math.PI/n; pos[pid] = [50 + 41*Math.cos(a), 50 + 41*Math.sin(a)]; });
  return pos;
}
function tableHTML({center, pickable=()=>false, selected=null, selClass="sel", arrows=[], counts={}, tags={}, dying=[]}){
  const ids = seatOrder(), pos = seatPos(ids), n = ids.length;
  const sz = n <= 6 ? "70px" : n <= 9 ? "60px" : n <= 12 ? "50px" : "42px";
  const lines = arrows.map(([from, to, color])=>{
    if(!pos[from] || !pos[to]) return "";
    const [x1,y1] = pos[from], [x2,y2] = pos[to];
    // bend each arrow toward the table's center so crossing votes stay readable
    const cx = (x1+x2)/2 + (50-(x1+x2)/2)*.45, cy = (y1+y2)/2 + (50-(y1+y2)/2)*.45;
    const key = `${from}>${to}`, fresh = !lastLines.has(key); lastLines.add(key);
    return `<path class="${fresh?"new":""}" d="M${x1} ${y1} Q${cx} ${cy} ${x2} ${y2}" stroke="${color}" marker-end="url(#ah-${color==="#e3264b"?"r":"m"})" opacity=".85"/>`;
  }).join("");
  const seats = ids.map(pid=>{
    const p = P(pid), [x,y] = pos[pid], can = pickable(pid);
    const cls = ["seat", pid===me.pid?"me":"", !p.alive&&p.role?"dead":"", can?"pick":"off", selected===pid?selClass:"", dying.includes(pid)?"dying":""].join(" ");
    const roleTag = (!p.alive || room.phase==="final") && p.role ? `<span class="tag r-${p.role}">${rname(p.role)}</span>` : (tags[pid] ? `<span class="tag ${tags[pid][1]||""}">${tags[pid][0]}</span>` : "");
    return `<button class="${cls}" data-seat="${pid}" style="--x:${x}%;--y:${y}%;--sz:${sz}" ${can?"":"tabindex='-1'"} aria-label="${esc(p.name)}">${pic(pid,"av")}${roleTag}${counts[pid]?`<span class="cnt">${counts[pid]}</span>`:""}<span class="nm">${esc(p.name)}${pid===me.pid?" (you)":""}</span></button>`;
  }).join("");
  return `<div class="tablewrap"><svg class="lines" viewBox="0 0 100 100" preserveAspectRatio="none"><defs>
      <marker id="ah-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e3264b" stroke="none"/></marker>
      <marker id="ah-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ffe9b0" stroke="none"/></marker></defs>${lines}</svg>
    <div class="tabletop"><div class="center">${center}</div></div>${seats}</div>`;
}
function myRoleChip(){
  const r = room.me.role; if(!r) return "";
  return `<span class="chip role r-${r}">${ART[r]}You are the ${rname(r)}${room.me.alive?"":" (ghost)"}</span>`;
}
const clockHTML = () => `<div class="clock" id="clock"></div>`;

const NIGHT = {
  wolf: ["Choose your prey.", "Tap who the pack eliminates. Your pack sees your pick."],
  seer: ["Peer into a soul.", "Tap someone to learn if they're a werewolf."],
  doctor: ["Protect someone.", "Tap who to shield tonight. It can be you."],
  hunter: ["Who's suspicious?", "Tap who you suspect. Everyone taps something at night."],
  villager: ["Who's suspicious?", "Tap who you suspect. Everyone taps something at night."],
};
function tableView(){
  const ph = room.phase, role = room.me.role, aliveMe = room.me.alive, c = room.current || {};
  let center = "", opts = {}, say = "", under = "";
  if(ph === "night"){
    const mn = room.myNight || {}, wv = mn.wolfVotes || {};
    const [h, sub] = aliveMe ? (NIGHT[role] || NIGHT.villager) : ["Night falls.", "The village sleeps. You watch from beyond."];
    center = `<span class="ico moonico"></span><h2>Night ${room.day}</h2>${clockHTML()}<span class="small">${room.acted||0}/${room.actNeed||0} have acted</span>`;
    say = `<b>${h}</b> ${sub}`;
    opts.pickable = pid => aliveMe && P(pid).alive && !(role==="wolf" && P(pid).role==="wolf") && !(role==="seer" && (pid===me.pid || mn.done)) && !(role==="doctor" && pid===mn.noRepeat);
    opts.selected = mn.target; opts.selClass = role === "wolf" ? "redsel" : "sel";
    if(role === "wolf") opts.arrows = Object.entries(wv).map(([w,t])=>[w,t,"#e3264b"]);
    else if(mn.target) opts.arrows = [[me.pid, mn.target, "#ffe9b0"]];
    if(role === "wolf") opts.tags = Object.fromEntries(inGame().filter(pid=>P(pid).role==="wolf"&&P(pid).alive).map(pid=>[pid,["Pack","r-wolf"]]));
    if(role === "doctor" && mn.noRepeat) opts.tags = {[mn.noRepeat]:["Last night",""]};
    if(role === "seer" && room.seerLog?.length) under = `<div class="panel"><b style="color:var(--seer2)">Your visions</b>${room.seerLog.map(v=>`<div>Night ${v.night}: ${esc(v.name)} is ${v.wolf?'<b style="color:var(--blood)">a werewolf</b>':'<b style="color:var(--mint)">not a werewolf</b>'}</div>`).join("")}</div>`;
  } else if(ph === "day"){
    center = `<span class="ico sunico"></span><h2>Day ${room.day}</h2>${clockHTML()}<span class="small">Talk it out</span>`;
    say = "Accuse, defend, bluff. The vote opens when the clock runs out.";
  } else if(ph === "vote"){
    const votes = room.votes || {}, mine = votes[me.pid];
    const counts = {}; Object.values(votes).forEach(t=>{ if(t!=="skip") counts[t]=(counts[t]||0)+1; });
    center = `<span class="ico voteico"></span><h2>The vote</h2>${clockHTML()}<span class="small">${Object.keys(votes).length}/${alivePids().length} voted</span>`;
    say = aliveMe ? "<b>Point the finger.</b> Tap who should be cast out. Everyone sees the arrows." : "Ghosts don't vote. Watch the arrows fly.";
    opts = {pickable: pid => aliveMe && P(pid).alive && pid!==me.pid, selected: mine, selClass:"redsel", counts,
            arrows: Object.entries(votes).filter(([v,t])=>t!=="skip").map(([v,t])=>[v,t,"#e3264b"])};
    if(aliveMe) under = `<div style="display:flex;justify-content:center"><button class="btn ${mine==="skip"?"primary":""}" data-vote="skip">Skip vote${Object.values(votes).filter(t=>t==="skip").length?` (${Object.values(votes).filter(t=>t==="skip").length})`:""}</button></div>`;
  } else if(ph === "hunter"){
    const h = room.hunter?.pid;
    center = `<span class="ico voteico"></span><h2>Last shot</h2>${clockHTML()}`;
    say = h === me.pid ? "<b>You are dying.</b> Tap one player to take down with you." : `${esc(P(h).name)}, the Hunter, takes aim…`;
    opts = {pickable: pid => h===me.pid && P(pid).alive, selClass:"redsel"};
  } else {
    // dawn, verdict, shot: the reveal plays over the table, then the game moves on by itself
    const kind = {dawn:["sunico","Dawn"], verdict:["voteico","The verdict"], shot:["voteico","The shot"]}[ph];
    center = `<span class="ico ${kind[0]}"></span><h2>${kind[1]}</h2>${clockHTML()}`;
    say = esc(c.story || "");
    opts = {dying: c.dead || []};
    if(ph === "verdict" && c.votes) opts.arrows = Object.entries(c.votes).filter(([v,t])=>t!=="skip").map(([v,t])=>[v,t,"#e3264b"]);
    if(ph === "verdict" && c.tally) opts.counts = Object.fromEntries(Object.entries(c.tally).filter(([t])=>t!=="skip"));
  }
  $("#stage").innerHTML = `${tableHTML({center, ...opts})}
    <div class="info"><p class="say fadeup">${say}</p><div class="myrole">${myRoleChip()}</div>${under}
    ${room.me.ghost ? '<p class="hint" style="text-align:center">You are a ghost. You can see every role, so no spoilers out loud.</p>' : ""}</div>`;
  tick();
  if(["dawn","verdict","shot"].includes(ph) && (c.dead||[]).length) popReveal(c, ph);
  else if($("#overlay .reveal-pop")) $("#overlay").innerHTML = "";  // leave the Seer's vision alone
}
function popReveal(c, ph){
  const pid = c.dead[0], role = c.roles[pid];
  if($("#overlay").dataset.cid === c.id) return;  // already showing this one
  $("#overlay").dataset.cid = c.id;
  const stamp = {dawn:"KILLED IN THE NIGHT", verdict:"VOTED OUT", shot:"SHOT DOWN"}[ph];
  $("#overlay").innerHTML = `<div class="reveal-pop"><div class="cardwrap">${cardHTML(pid, role, {id:"deadCard"})}</div></div>`;
  setTimeout(()=>$("#deadCard")?.classList.add("flip"), 900);
  setTimeout(()=>{ const card = $("#deadCard"); if(card) card.insertAdjacentHTML("beforeend", `<span class="stamp">${stamp}</span>`); }, 950);
  // the card steps aside after a few seconds so everyone sees the table again
  setTimeout(()=>{ if($("#overlay").dataset.cid === c.id) $("#overlay").innerHTML = ""; }, 5200);
}
$("#stage").addEventListener("click", async e=>{
  const s = e.target.closest(".seat.pick"), v = e.target.closest("[data-vote]");
  try{
    if(v){ await act("vote", {target:"skip"}); buzz(30); return; }
    if(!s) return;
    const pid = s.dataset.seat, ph = room.phase;
    if(ph === "night"){ await act("night", {target:pid}); buzz(40); if(room.me.role === "seer") seerVision(pid); }
    else if(ph === "vote"){ await act("vote", {target:pid}); buzz(40); }
    else if(ph === "hunter"){ await act("shoot", {target:pid}); }
  }catch(err){ toast(err.message); }
});
function seerVision(pid){
  setTimeout(()=>{
    const v = (room.seerLog||[]).slice(-1)[0], wolf = v && v.pid === pid ? v.wolf : null;
    $("#overlay").dataset.cid = "";
    $("#overlay").innerHTML = `<div class="vision" id="vision"><div style="text-align:center;max-width:420px"><div class="orb"></div><div class="eyebrow">Your vision</div>
      <h2 style="font-size:clamp(26px,7vw,40px);margin-top:8px">${esc(P(pid).name)}</h2><div class="drum" style="color:${wolf?"var(--blood)":"var(--mint)"};margin-top:10px">${wolf===null?"…":wolf?"IS A WEREWOLF":"is not a werewolf"}</div>
      <p class="sub">Keep a straight face.</p><button class="btn primary" id="closeVision" style="margin-top:14px">Close</button></div></div>`;
    buzz(wolf ? [200,80,200] : 80);
    $("#closeVision").onclick = ()=>$("#overlay").innerHTML = "";
  }, 700);
}

/* ---------- lobby ---------- */
function lobby(){
  const ps = inGame(), s = room.settings, mine = P(me.pid), n = ps.length;
  const wolves = s.wolves || (n <= 6 ? 1 : n <= 10 ? 2 : 3), specials = ["seer","doctor","hunter"].filter(r=>s[r]);
  const villagers = Math.max(0, n - wolves - specials.length), H = !!hostKey;

      tags: H ? {} : {}})
    + `<div class="info">
    <div class="panel"><div class="me-pic"><button id="avBtn" type="button" aria-label="Choose your avatar">${src?`<img src="${esc(src)}" alt="" referrerpolicy="no-referrer">`:"Choose"}</button>
      <div><b>${esc(mine.name)}</b><p class="hint">${src ? "Tap to change your avatar." : "Pick an anime character or a picture from your gallery."}</p></div></div></div>
    ${H ? `<div class="panel"><b>Players</b><div style="display:flex;flex-wrap:wrap;gap:8px">${ps.filter(pid=>pid!==me.pid).map(pid=>`<span class="chip">${esc(P(pid).name)} <button class="btn small" data-kick="${pid}" style="padding:1px 9px;font-size:11px">Kick</button></span>`).join("") || '<span class="hint">Nobody else yet. Share the code.</span>'}</div></div>` : ""}

        <div><label for="sNight">Night</label>${sel("sNight", [[30,"30 sec"],[45,"45 sec"],[60,"1 min"],[90,"90 sec"]], s.nightSec)}</div>
        <div><label for="sDay">Discussion</label>${sel("sDay", [[60,"1 min"],[120,"2 min"],[180,"3 min"],[300,"5 min"]], s.daySec)}</div>

    <details class="panel"><summary>How to play</summary><div class="rolelist">${Object.keys(ART).map(r=>`<div class="r-${r}">${ART[r]}<span><b>${rname(r)}.</b> ${DESC[r]}</span></div>`).join("")}</div>
      <p class="hint" style="margin-top:8px">The game runs itself: night, dawn, discussion, vote, repeat. The village wins when every wolf is gone. The wolves win when they match the village in number.</p></details></div>`;
  $("#avBtn").onclick = ()=>Avatars.open(act);
  if(H){
    const send = x => act("settings", x).catch(err=>toast(err.message));
    document.querySelectorAll("[data-toggle]").forEach(b=>b.onclick=()=>send({[b.dataset.toggle]: !s[b.dataset.toggle]}));
    $("#sWolves").onchange=e=>send({wolves:+e.target.value}); $("#sNight").onchange=e=>send({nightSec:+e.target.value});
    $("#sDay").onchange=e=>send({daySec:+e.target.value}); $("#sVote").onchange=e=>send({voteSec:+e.target.value});
  }
}

/* ---------- cards ---------- */
function cardHTML(pid, role, opts={}){
  const p = P(pid), src = Avatars.src(p);
  return `<div class="card ${opts.flip?"flip":""} ${opts.dead?"dead":""} r-${role}" ${opts.id?`id="${opts.id}"`:""} style="${opts.delay?`transition-delay:${opts.delay}s`:""}">
    <div class="side back"><div class="mn"></div>${opts.tap?'<div class="tap">TAP TO REVEAL</div>':""}</div>
    <div class="side front"><span class="owner" style="background:${hue(p.name)}">${src?`<img src="${esc(src)}" alt="" referrerpolicy="no-referrer">`:esc(p.name[0])}</span>
      <div class="rname">${rname(role)}</div>${ART[role]}<div class="desc">${opts.mini ? esc(p.name) : DESC[role]}</div>${opts.st?`<span class="st">${opts.st}</span>`:""}</div></div>`;
}
function rolesView(){
  const role = room.me.role, mine = P(me.pid);
  if(!role){ $("#stage").innerHTML = `<div class="fadeup" style="margin-top:10vh"><h1 class="title">The cards are dealt</h1><p class="sub">You joined mid-game, so you're watching this one.</p></div>`; return; }
  const pack = role === "wolf" ? inGame().filter(pid=>pid!==me.pid && P(pid).role==="wolf") : [];
  const ps = inGame(), ready = ps.filter(pid=>P(pid).ready).length;
  $("#stage").innerHTML = `<div class="eyebrow fadeup" style="margin-top:2vh">Keep it secret</div><h1 class="title fadeup">Your role</h1>
    <div class="cardwrap">${cardHTML(me.pid, role, {tap:true, id:"myCard", flip:revealed})}</div>
    <div id="after" ${revealed?"":"hidden"} style="display:grid;gap:12px">
      ${pack.length ? `<div class="panel"><b style="color:var(--wolf2)">Your pack: ${pack.map(pid=>esc(P(pid).name)).join(", ")}</b></div>` : ""}
      ${mine.ready ? `<p class="sub">Waiting for everyone · ${ready}/${ps.length} ready</p>` : `<button class="btn primary wide" id="readyBtn">I've memorized it</button>`}</div>
    <p class="hint" style="text-align:center;margin-top:8px">Hide your screen, then tap the card. Night falls when everyone is ready.</p>`;
  $("#myCard").onclick = ()=>{ revealed = !revealed; $("#myCard").classList.toggle("flip", revealed); if(revealed){ buzz(80); $("#after").hidden = false; } };
  if($("#readyBtn")) $("#readyBtn").onclick = ()=>act("ready").catch(err=>toast(err.message));
}

/* ---------- final ---------- */
function final(){
  const w = room.winner, ps = inGame();
  const ev = (room.events||[]).map(e=>{
    const who = e.dead.map(d=>esc(P(d).name)).join(", ");
    const what = e.kind === "night" ? (who ? `The wolves took ${who}` : e.saved ? `The Doctor saved ${esc(P(e.target)?.name||"someone")}` : "A quiet night")
      : e.kind === "vote" ? (who ? `The village voted out ${who}` : "Nobody was voted out") : (who ? `The Hunter shot ${who}` : "The Hunter missed");
    return `<div><b>${e.kind==="night"?"Night":"Day"} ${e.day}</b><span>${what}</span></div>`; }).join("");
  $("#stage").innerHTML = `<div class="banner ${w}">${w==="wolves"?"The wolves win":"The village wins"}</div>
    <p class="sub" style="font-size:16px">${w==="wolves"?"The pack ate well tonight.":"Every wolf has been found."}</p>
    ${tableHTML({center:`<span class="ico ${w==="wolves"?"voteico":"sunico"}"></span><h2>Game over</h2><span class="small">${room.day} night${room.day===1?"":"s"}</span>`})}
    <div class="info"><div class="panel"><b>How it went</b><div class="timeline">${ev}</div>
      ${room.seerLog?.length ? `<b style="color:var(--seer2)">The Seer's visions</b>${room.seerLog.map(v=>`<div style="font-size:14px">Night ${v.night}: ${esc(v.name)} ${v.wolf?"was a werewolf":"was innocent"}</div>`).join("")}` : ""}</div>
    <div class="minicards">${ps.map((pid,i)=>cardHTML(pid, P(pid).role, {mini:true, dead:!P(pid).alive, st:P(pid).alive?"SURVIVED":"DIED", delay:.3+i*.15})).join("")}</div></div>`;
  setTimeout(()=>document.querySelectorAll(".minicards .card").forEach(c=>c.classList.add("flip")), 250);
}

/* ---------- host controls, clock ---------- */
function renderHostbar(){
  const bar = $("#hostbar"), ph = room?.phase;
  if(!hostKey || !room || !me || !room.players[me.pid]){ bar.hidden = true; return; }
  const skip = {roles:"Start the night", night:"End the night", day:"Start the vote", vote:"Count the votes", hunter:"Skip the shot", dawn:"Skip ahead", verdict:"Skip ahead", shot:"Skip ahead"}[ph];
  const b = [];
  if(skip){ b.push('<span class="lbl">Host</span>'); if(["night","day","vote"].includes(ph)) b.push('<button class="btn small" data-host="addtime">+30s</button>'); b.push(`<button class="btn small" data-host="skip">${skip}</button>`); }
  if(ph === "final") b.push('<button class="btn primary" data-host="playagain">Play again</button>');
  bar.hidden = !b.length; bar.innerHTML = b.join("");
}
document.addEventListener("click", async e=>{
  const h = e.target.closest("[data-host]"), k = e.target.closest("[data-kick]");
  if(h){ try{ await act(h.dataset.host, h.dataset.host==="addtime"?{sec:30}:{}); }catch(err){ toast(err.message); } }
  if(k){ if(k.dataset.sure !== "1"){ k.dataset.sure = "1"; k.textContent = "Sure?"; return; } act("kick", {pid:k.dataset.kick}).catch(err=>toast(err.message)); }
});
function tick(){
  const el = $("#clock"); if(!el || !room?.deadline) return;
  const left = Math.max(0, Math.ceil(room.deadline - serverNow()));
  el.textContent = `${Math.floor(left/60)}:${String(left%60).padStart(2,"0")}`;
  el.classList.toggle("low", left <= 10 && !["dawn","verdict","shot"].includes(room.phase));
}
setInterval(tick, 250);

const c0 = (new URLSearchParams(location.search).get("room")||"").toUpperCase();
if(c0) openRoom(c0); else home();
</script>
