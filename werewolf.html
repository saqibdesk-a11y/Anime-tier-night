<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05060f">
<title>Werewolf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one living backdrop (sky, moon, sun, fog) that changes with the game phase; a single centered stage
   column on top, built for phones held in a circle of friends. Cards flip in 3D; the dead go grey. */
:root{
  --ink:#05060f; --night1:#070a1c; --night2:#141238; --fg:#efeaf7; --muted:#9a95b4; --line:rgba(205,195,255,.14); --line2:rgba(205,195,255,.28);
  --glass:rgba(16,14,40,.62); --glass2:rgba(255,255,255,.07);
  --moon:#ffe9b0; --blood:#e3264b; --blood2:#7d0f2a; --gold:#f2c35b; --mint:#53e3a6; --violet:#9d7bff;
  --wolf1:#7d0f2a; --wolf2:#e3264b; --seer1:#3b1d86; --seer2:#9d7bff; --doc1:#0d5c45; --doc2:#53e3a6;
  --hunt1:#7a4a07; --hunt2:#f2a33a; --vill1:#1f3557; --vill2:#6fa8ff;
  --display:"Cinzel","Times New Roman",serif; --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--ink);color:var(--fg);font:15px/1.55 var(--body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--moon);outline-offset:3px}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:.02em}
.muted{color:var(--muted)}

/* ---------- the living backdrop ---------- */
.scene{position:fixed;inset:0;z-index:0;overflow:hidden;background:linear-gradient(180deg,var(--night1),var(--night2) 70%,#1d1440);transition:background 2.5s ease}
.scene .stars{position:absolute;inset:0;opacity:1;transition:opacity 2.5s}
.scene .stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;animation:twinkle 3s infinite ease-in-out}
@keyframes twinkle{50%{opacity:.25}}
.moon{position:absolute;right:5%;top:3%;width:min(20vw,130px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fffaf0,var(--moon) 55%,#e0bf73);box-shadow:0 0 60px 20px rgba(255,233,176,.25),0 0 160px 60px rgba(255,233,176,.08);transition:transform 2.5s ease,opacity 2.5s}
.moon::after{content:"";position:absolute;inset:18% 50% 50% 22%;border-radius:50%;background:rgba(160,130,70,.18);box-shadow:30px 34px 0 -4px rgba(160,130,70,.14),48px 8px 0 -10px rgba(160,130,70,.12)}
.sun{position:absolute;left:50%;bottom:-40%;width:min(46vw,300px);aspect-ratio:1;border-radius:50%;transform:translateX(-50%);background:radial-gradient(circle,#fff3c4,#ffb347 60%,#ff7a3d);box-shadow:0 0 120px 50px rgba(255,150,70,.35);opacity:0;transition:bottom 3s cubic-bezier(.2,.7,.2,1),opacity 2s}
.hills{position:absolute;left:-5%;right:-5%;bottom:-2px;height:28vh;background:radial-gradient(120% 100% at 20% 100%,#05060f 60%,transparent 61%),radial-gradient(120% 110% at 80% 100%,#080a1a 58%,transparent 59%)}
.trees{position:absolute;left:0;right:0;bottom:0;height:22vh;opacity:.9}
.fog{position:absolute;left:-50%;width:200%;height:30vh;bottom:4vh;background:radial-gradient(closest-side,rgba(180,170,230,.10),transparent);filter:blur(10px);animation:drift 40s linear infinite}
.fog.f2{bottom:12vh;animation-duration:65s;animation-direction:reverse;opacity:.7}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(25%)}}
body.s-dawn .scene{background:linear-gradient(180deg,#2a1f5c,#b4527a 55%,#f39a5d)}
body.s-dawn .sun{bottom:2%;opacity:1}
body.s-dawn .moon{transform:translateY(-140%);opacity:0}
body.s-dawn .stars{opacity:0}
body.s-day .scene{background:linear-gradient(180deg,#22305c,#4a5f96 55%,#8d7aa8)}
body.s-day .sun{bottom:58%;opacity:.9;left:20%}
body.s-day .moon,body.s-day .stars{opacity:0}
body.s-vote .scene{background:linear-gradient(180deg,#1a0716,#4a0f26 60%,#8a1f3a)}
body.s-vote .moon{opacity:.25;filter:hue-rotate(-30deg) saturate(2)}
body.s-vote .stars{opacity:.3}
body.s-night .moon{animation:moonpulse 6s ease-in-out infinite}
@keyframes moonpulse{50%{box-shadow:0 0 80px 30px rgba(255,233,176,.32),0 0 200px 80px rgba(255,233,176,.1)}}
body.s-wolves .scene{background:linear-gradient(180deg,#12020a,#3d0618 60%,#7d0f2a)}
body.s-wolves .moon{background:radial-gradient(circle at 35% 35%,#ffd6d6,#ff5470 60%,#9a1030);box-shadow:0 0 80px 30px rgba(227,38,75,.35)}
body.s-village .scene{background:linear-gradient(180deg,#1d2b55,#6e5fa0 50%,#f0b15f)}
body.s-village .sun{bottom:30%;opacity:1}
body.s-village .moon{opacity:0}

/* ---------- stage ---------- */
.app{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:linear-gradient(180deg,rgba(5,6,15,.85),rgba(5,6,15,0))}
.top a{color:var(--muted);text-decoration:none;font-weight:700}
.top h1{font-size:18px;font-weight:800}
.code{font-family:var(--display);font-weight:800;letter-spacing:.2em;font-size:13px;border:1px solid var(--line2);border-radius:999px;padding:3px 12px;background:var(--glass)}
.spacer{flex:1}
.timer{font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums;border-radius:999px;padding:4px 14px;background:var(--glass);border:1px solid var(--line2)}
.timer.low{color:var(--blood);border-color:var(--blood);animation:beat 1s infinite}
@keyframes beat{50%{transform:scale(1.08)}}
.stage{width:min(760px,100%);margin:0 auto;padding:6px max(16px,env(safe-area-inset-left,0px)) calc(120px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));flex:1}
.panel{background:var(--glass);border:1px solid var(--line);border-radius:22px;padding:20px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:grid;gap:14px}
.title{font-size:clamp(30px,8vw,52px);font-weight:900;line-height:1.05;text-align:center;text-shadow:0 4px 30px rgba(0,0,0,.6)}
.sub{text-align:center;color:var(--muted);margin:6px 0 0}
.eyebrow{text-align:center;font-size:12px;font-weight:800;letter-spacing:.24em;text-transform:uppercase;color:var(--moon)}
.btn{border:1px solid var(--line2);background:var(--glass2);border-radius:999px;padding:11px 20px;font-weight:800;transition:transform .12s,background .2s,box-shadow .2s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:linear-gradient(135deg,var(--moon),var(--gold));color:#2a1a00;border-color:transparent;box-shadow:0 10px 30px -10px rgba(242,195,91,.7)}
.btn.blood{background:linear-gradient(135deg,var(--blood),var(--blood2));border-color:transparent;color:#fff;box-shadow:0 10px 30px -10px rgba(227,38,75,.7)}
.btn.small{padding:6px 13px;font-size:13px}
.btn.wide{width:100%}
label{display:block;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
input[type=text],select,textarea{width:100%;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:14px;padding:11px 14px;outline:none;color:var(--fg)}
input[type=text]:focus,select:focus,textarea:focus{border-color:var(--moon);box-shadow:0 0 0 4px rgba(255,233,176,.12)}
select option{background:#14122e}
.err{color:#ff8fa3;font-size:14px;min-height:1.4em}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
@media (max-width:520px){.row3{grid-template-columns:1fr 1fr}}
.toggles{display:flex;flex-wrap:wrap;gap:8px}
.tg{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:7px 14px;background:rgba(0,0,0,.25);font-weight:700;font-size:14px}
.tg.on{border-color:var(--moon);background:rgba(255,233,176,.1)}
.tg i{width:10px;height:10px;border-radius:50%}
.hint{font-size:13px;color:var(--muted);margin:0}

/* ---------- player tokens ---------- */
.ring{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:14px;margin-top:16px}
.tok{position:relative;display:grid;justify-items:center;gap:6px;border:0;background:none;padding:6px 2px;border-radius:18px;transition:transform .15s,background .2s}
.tok .face{position:relative;width:74px;height:74px;border-radius:50%;overflow:hidden;border:3px solid rgba(255,255,255,.18);background:#221d48;display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:28px;color:#0b0820;box-shadow:0 10px 26px -10px rgba(0,0,0,.9)}
.tok .face img{width:100%;height:100%;object-fit:cover;display:block}
.tok .nm{font-weight:800;font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tok.pick{cursor:pointer}
.tok.pick:hover{transform:translateY(-3px)}
.tok.sel .face{border-color:var(--moon);box-shadow:0 0 0 4px rgba(255,233,176,.25),0 0 30px rgba(255,233,176,.4)}
.tok.wolfsel .face{border-color:var(--blood);box-shadow:0 0 0 4px rgba(227,38,75,.3),0 0 30px rgba(227,38,75,.5)}
.tok.dead{opacity:.55}
.tok.dead .face{filter:grayscale(1) brightness(.6)}
.tok.dead .face::after{content:"";position:absolute;inset:0;background:linear-gradient(45deg,transparent 46%,var(--blood) 46% 54%,transparent 54%)}
.tok.off{opacity:.35;cursor:not-allowed}
.badge{position:absolute;top:0;right:8px;font-size:10px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;border-radius:999px;padding:2px 7px;background:var(--ink);border:1px solid var(--line2)}
.rolechip{font-size:10px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;border-radius:999px;padding:2px 8px}
.voters{display:flex;justify-content:center;flex-wrap:wrap;gap:2px;min-height:20px}
.voters span{width:18px;height:18px;border-radius:50%;overflow:hidden;border:1.5px solid var(--ink);display:grid;place-items:center;font-size:9px;font-weight:900;color:#0b0820;animation:drop .35s cubic-bezier(.3,1.6,.5,1) backwards}
.voters span img{width:100%;height:100%;object-fit:cover}
@keyframes drop{from{transform:translateY(-14px) scale(.4);opacity:0}}
.count{font-family:var(--display);font-weight:900;font-size:15px;color:var(--blood)}

/* ---------- role cards ---------- */
.cardwrap{perspective:1400px;display:grid;justify-items:center;margin:20px 0 10px}
.card{position:relative;width:min(300px,78vw);aspect-ratio:5/7.4;transform-style:preserve-3d;transition:transform 1s cubic-bezier(.3,1.25,.4,1);cursor:pointer}
.card.flip{transform:rotateY(180deg)}
.card .side{position:absolute;inset:0;border-radius:22px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;box-shadow:0 30px 70px -20px rgba(0,0,0,.95),inset 0 0 0 2px rgba(255,236,190,.35)}
.card .back{background:radial-gradient(circle at 50% 38%,rgba(255,233,176,.25),transparent 40%),repeating-linear-gradient(45deg,#16123a 0 14px,#1b1646 14px 28px);display:grid;place-items:center}
.card .back::before{content:"";position:absolute;inset:12px;border:2px solid rgba(255,233,176,.35);border-radius:14px}
.card .back .mn{width:42%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fffaf0,var(--moon) 60%,#c99d47);box-shadow:0 0 50px rgba(255,233,176,.5)}
.card .back .tap{position:absolute;bottom:14%;font-family:var(--display);font-weight:800;letter-spacing:.2em;font-size:13px;color:var(--moon);animation:breathe 2s infinite}
@keyframes breathe{50%{opacity:.4}}
.card .front{transform:rotateY(180deg);display:grid;grid-template-rows:auto 1fr auto;padding:18px;text-align:center;background:linear-gradient(165deg,var(--c1),#0b0820 85%)}
.card .front::before{content:"";position:absolute;inset:10px;border:2px solid rgba(255,236,190,.4);border-radius:15px;pointer-events:none}
.card .front .rname{font-family:var(--display);font-weight:900;font-size:28px;letter-spacing:.06em;color:#fff;text-shadow:0 2px 12px var(--c2)}
.card .front .team{font-size:11px;font-weight:900;letter-spacing:.2em;text-transform:uppercase;color:var(--c2)}
.card .front svg{width:62%;margin:auto;filter:drop-shadow(0 0 22px var(--c2))}
.card .front .desc{font-size:13px;line-height:1.45;color:#e7e1f5}
.card .front .owner{position:absolute;top:16px;left:16px;width:44px;height:44px;border-radius:50%;overflow:hidden;border:2px solid rgba(255,255,255,.6);display:grid;place-items:center;font-weight:900;color:#0b0820}
.card .front .owner img{width:100%;height:100%;object-fit:cover}
.r-wolf{--c1:var(--wolf1);--c2:var(--wolf2)} .r-seer{--c1:var(--seer1);--c2:var(--seer2)} .r-doctor{--c1:var(--doc1);--c2:var(--doc2)}
.r-hunter{--c1:var(--hunt1);--c2:var(--hunt2)} .r-villager{--c1:var(--vill1);--c2:var(--vill2)}
.minicards{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;margin-top:16px;perspective:1000px}
.minicards .card{width:100%;cursor:default}
.minicards .card .front{padding:12px 10px 10px;grid-template-rows:auto auto 1fr auto auto;gap:2px;justify-items:center}
.minicards .card .front .team{display:none}
.minicards .card .front .rname{font-size:15px}
.minicards .card .front svg{width:56%}
.minicards .card .front .desc{font-size:12px;font-weight:800}
.minicards .card .front .owner{position:relative;top:auto;left:auto;width:38px;height:38px;font-size:13px}
.minicards .card.dead .front{filter:saturate(.5)}
.minicards .card .stamp2{position:static;transform:none;font-size:10px!important;font-family:var(--display);font-weight:900;font-size:11px;letter-spacing:.14em;border:2px solid currentColor;border-radius:6px;padding:1px 8px;color:var(--mint)}
.minicards .card.dead .stamp2{color:var(--blood)}

/* ---------- narration, reveals ---------- */
.story{font-family:var(--display);font-weight:600;font-size:clamp(17px,4.4vw,21px);line-height:1.6;text-align:center;min-height:3.2em;text-shadow:0 2px 14px rgba(0,0,0,.7)}
.story .caret{display:inline-block;width:2px;height:1em;background:var(--moon);vertical-align:-2px;margin-left:2px;animation:breathe 1s infinite}
.thinking{display:flex;justify-content:center;gap:6px;padding:10px}
.thinking i{width:9px;height:9px;border-radius:50%;background:var(--moon);animation:breathe 1.2s infinite}
.thinking i:nth-child(2){animation-delay:.2s}.thinking i:nth-child(3){animation-delay:.4s}
.stamp{position:absolute;top:46%;left:50%;transform:translate(-50%,-50%) rotate(-12deg) scale(2.4);opacity:0;font-family:var(--display);font-weight:900;font-size:24px;letter-spacing:.12em;color:var(--blood);border:4px solid var(--blood);border-radius:10px;padding:4px 14px;background:rgba(10,0,6,.55);z-index:3;animation:slam .5s 1.6s cubic-bezier(.2,1.6,.4,1) forwards;white-space:nowrap}
@keyframes slam{to{opacity:1;transform:translate(-50%,-50%) rotate(-12deg) scale(1)}}
.shield{width:140px;margin:16px auto;filter:drop-shadow(0 0 30px rgba(83,227,166,.7));animation:shieldin 1.2s cubic-bezier(.2,1.5,.4,1) backwards}
@keyframes shieldin{from{transform:scale(.2) rotate(-30deg);opacity:0}}
.fadeup{animation:fadeup .7s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes fadeup{from{opacity:0;transform:translateY(18px)}}
.drum{font-family:var(--display);font-weight:900;font-size:clamp(28px,7vw,44px);text-align:center;animation:drum .5s ease-in-out 3}
@keyframes drum{50%{transform:scale(1.08)}}
.vision{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(5,4,20,.88);backdrop-filter:blur(6px);padding:20px;animation:fadeup .4s}
.vision .orb{width:150px;aspect-ratio:1;border-radius:50%;margin:0 auto 18px;background:radial-gradient(circle at 40% 35%,#fff,var(--violet) 45%,#2a1060);box-shadow:0 0 80px 20px rgba(157,123,255,.5);animation:orb 2.4s ease-in-out infinite}
@keyframes orb{50%{box-shadow:0 0 120px 40px rgba(157,123,255,.7);transform:scale(1.04)}}
.banner{font-family:var(--display);font-weight:900;font-size:clamp(34px,10vw,72px);text-align:center;line-height:1;letter-spacing:.04em;margin-top:30px;animation:rise 1.4s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes rise{from{opacity:0;transform:translateY(30px) scale(.9);letter-spacing:.3em}}
.banner.wolves{color:#ff5a78;text-shadow:0 0 40px rgba(227,38,75,.8)}
.banner.village{color:var(--gold);text-shadow:0 0 40px rgba(242,195,91,.7)}
.awards{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.award{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:4px 14px 4px 4px;background:rgba(242,195,91,.1);border:1px solid rgba(242,195,91,.35);font-weight:800;font-size:13px}
.award .av{width:26px;height:26px;border-radius:50%;overflow:hidden;display:grid;place-items:center;font-size:11px;color:#0b0820}
.award .av img{width:100%;height:100%;object-fit:cover}
.award small{color:var(--gold);font-weight:900}
.ghost{border:1px dashed var(--line2);border-radius:16px;padding:10px 14px;text-align:center;font-size:13px;color:var(--muted);margin-top:12px}
.hostbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;gap:10px;flex-wrap:wrap;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(0deg,rgba(5,6,15,.95),rgba(5,6,15,.6));border-top:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:50;background:var(--moon);color:#2a1a00;font-weight:800;border-radius:999px;padding:10px 20px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.photo-pick{display:flex;align-items:center;gap:14px}
.photo-pick .face{width:72px;height:72px;border-radius:50%;overflow:hidden;border:3px dashed var(--line2);display:grid;place-items:center;background:rgba(0,0,0,.3);flex:none;font-size:12px;color:var(--muted);text-align:center}
.photo-pick .face img{width:100%;height:100%;object-fit:cover}
details summary{cursor:pointer;font-weight:800}
.rolelist{display:grid;gap:8px;margin-top:10px}
.rolelist div{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:center;font-size:14px}
.rolelist svg{width:36px;filter:drop-shadow(0 0 8px var(--c2))}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body class="s-night">
<div class="scene" aria-hidden="true">
  <div class="stars" id="stars"></div>
  <div class="moon"></div>
  <div class="sun"></div>
  <div class="fog"></div><div class="fog f2"></div>
  <svg class="trees" viewBox="0 0 1200 200" preserveAspectRatio="none"><path fill="#04050c" d="M0 200 L0 140 L30 90 L45 130 L70 60 L95 130 L110 100 L130 140 L160 70 L190 140 L220 110 L240 150 L270 80 L300 150 L340 120 L360 150 L400 90 L430 150 L470 130 L500 160 L540 100 L570 160 L620 140 L650 170 L700 110 L730 160 L770 130 L800 165 L840 90 L870 160 L900 120 L930 160 L970 70 L1000 150 L1030 120 L1060 160 L1100 80 L1130 150 L1160 110 L1200 140 L1200 200 Z"/></svg>
</div>

<div class="app">
  <header class="top">
    <a href="/" aria-label="All games">&larr;</a>
    <h1 id="hTitle">Werewolf</h1>
    <span class="code" id="hCode" hidden></span>
    <span class="spacer"></span>
    <span class="timer" id="timer" hidden></span>
  </header>
  <main class="stage" id="stage"></main>
</div>
<div class="hostbar" id="hostbar" hidden></div>
<div class="toast" id="toast" hidden></div>
<div id="overlay"></div>
<input type="file" id="photoInput" accept="image/*" capture="user" hidden>

<script>
/* ---------- basics ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hue = n => { let h=0; for(const c of String(n)) h=(h*31+c.charCodeAt(0))%360; return `hsl(${h} 80% 72%)`; };
function store(k, v){ try{ if(v===undefined) return JSON.parse(localStorage.getItem(k)); localStorage.setItem(k, JSON.stringify(v)); }catch(e){ return null; } }
function toast(m){ const t=$("#toast"); t.textContent=m; t.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>t.hidden=true,2600); }
const buzz = p => { try{ if(navigator.vibrate && navigator.userActivation?.hasBeenActive) navigator.vibrate(p); }catch(e){} };
async function api(path, body){
  const r = await fetch(path, body ? {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)} : {});
  const j = await r.json().catch(()=>({error:"The server didn't answer. Try again."}));
  if(!r.ok) throw new Error(j.error || "Something went wrong");
  return j;
}

/* ---------- state ---------- */
let code=null, room=null, me=null, hostKey=null, pollGen=0, clockOffset=0;
const serverNow = () => Date.now()/1000 + clockOffset;
const act = (a, extra={}) => api(`/api/rooms/${code}/${a}`, {hostKey, ...(me||{}), ...extra});
const P = pid => room.players[pid];
const face = (pid, cls="") => { const p = P(pid) || {name:"?"}; return `<span class="${cls}" style="background:${hue(p.name)}">${p.photo ? `<img src="/api/img/${p.photo}" alt="">` : esc(p.name[0].toUpperCase())}</span>`; };
const alivePids = () => Object.keys(room.players).filter(pid=>room.players[pid].alive && !room.players[pid].spectator);

/* ---------- boot, join ---------- */
function home(){
  document.body.className = "s-night";
  $("#stage").innerHTML = `<div class="fadeup" style="margin-top:6vh">
    <div class="eyebrow">A party game of lies</div><h1 class="title" style="font-size:clamp(46px,13vw,90px)">Werewolf</h1>
    <p class="sub" style="max-width:46ch;margin:10px auto 0">Secret roles, an AI narrator and a village that trusts nobody. Put your face on your card and find the wolves before they find you.</p></div>
    <div style="display:grid;gap:16px;margin-top:28px">
    <form class="panel" id="createForm"><h2 style="font-size:22px">Host a game</h2>
      <div><label for="cName">Your name</label><input type="text" id="cName" maxlength="24" autocomplete="nickname"></div>
      <div class="err" id="cErr"></div><button class="btn primary wide">Create a village</button>
      <p class="hint">You'll set the roles, timers and story setting in the lobby.</p></form>
    <form class="panel" id="joinForm"><h2 style="font-size:22px">Join a game</h2>
      <div class="row2"><div><label for="jCode">Room code</label><input type="text" id="jCode" maxlength="6" autocomplete="off" style="text-transform:uppercase;letter-spacing:.2em"></div>
      <div><label for="jName">Your name</label><input type="text" id="jName" maxlength="24" autocomplete="nickname"></div></div>
      <div class="err" id="jErr"></div><button class="btn primary wide">Join</button></form></div>`;
  $("#createForm").onsubmit = async e=>{
    e.preventDefault(); const name = $("#cName").value.trim();
    if(!name){ $("#cErr").textContent = "Enter your name."; return; }
    try{ const r = await api("/api/rooms", {game:"werewolf", title:"Werewolf"}); const m = await api(`/api/rooms/${r.code}/join`, {name});
      store("ww:"+r.code, {hostKey:r.hostKey, me:m}); openRoom(r.code); }catch(err){ $("#cErr").textContent = err.message; }
  };
  $("#joinForm").onsubmit = async e=>{
    e.preventDefault(); const c = $("#jCode").value.trim().toUpperCase(), name = $("#jName").value.trim();
    if(!c || !name){ $("#jErr").textContent = "Enter the room code and your name."; return; }
    try{ const m = await api(`/api/rooms/${c}/join`, {name}); store("ww:"+c, {...(store("ww:"+c)||{}), me:m}); openRoom(c); }catch(err){ $("#jErr").textContent = err.message; }
  };
}
function openRoom(c){
  code = c; const s = store("ww:"+c) || {}; me = s.me || null; hostKey = s.hostKey || null;
  history.replaceState(null, "", "/werewolf?room="+c);
  $("#hCode").hidden = false; $("#hCode").textContent = c;
  poll(++pollGen, -1);
}
async function poll(gen, v){
  while(gen === pollGen){
    try{
      const who = me ? `&pid=${me.pid}&key=${me.key}` : "";
      const r = await fetch(`/api/rooms/${code}?v=${v}${who}`);
      if(r.status === 404){ history.replaceState(null,"","/werewolf"); home(); $("#jErr").textContent = "That game doesn't exist anymore."; return; }
      const d = await r.json(); if(gen !== pollGen) return;
      clockOffset = d.now - Date.now()/1000;
      const prev = room; room = d; v = d.version;
      if(me && !room.players[me.pid]){ me = null; store("ww:"+code, {hostKey}); toast("You were removed from this game"); }
      reactTo(prev); render();
    }catch(e){ await new Promise(r=>setTimeout(r,2000)); }
  }
}
function reactTo(prev){
  if(!prev || prev.phase === room.phase) return;
  if(room.phase === "roles" || room.phase === "lobby") revealed = false;  // a fresh deal starts face down
  if(room.phase === "roles") buzz([60,40,60]);
  if(room.phase === "night") buzz(120);
  if(["dawn","verdict","shot"].includes(room.phase) && room.current?.dead?.includes(me?.pid)) buzz([300,100,300]);
  window.scrollTo({top:0, behavior:"smooth"});
}

/* ---------- render ---------- */
let lastSig = "";
function render(){
  const ph = room.phase;
  const sceneFor = {lobby:"s-night", roles:"s-night", night:"s-night", dawn:"s-dawn", day:"s-day", vote:"s-vote", verdict:"s-vote", hunter:"s-vote", shot:"s-vote",
    final: room.winner === "wolves" ? "s-wolves" : "s-village"};
  document.body.className = sceneFor[ph] || "s-night";
  renderHostbar(); tickTimer();
  const joined = me && room.players[me.pid];
  if(!joined){ return gate(); }
  const views = {lobby, roles:rolesView, night, dawn:reveal, verdict:reveal, shot:reveal, day, vote, hunter, final};
  // only redraw when something on screen changed, so animations play once
  const sig = JSON.stringify([ph, room.day, room.players, room.current?.id, room.current?.story, room.votes, room.myNight, room.seerLog, room.settings, room.epilogue, room.me]);
  if(sig === lastSig) return;
  lastSig = sig;
  (views[ph] || lobby)();
}
function gate(){
  $("#stage").innerHTML = `<form class="panel fadeup" id="gate" style="margin-top:8vh"><div class="eyebrow">You've been summoned</div><h2 style="font-size:26px;text-align:center">Join this village</h2>
    <input type="text" id="gName" placeholder="Your name" maxlength="24" autocomplete="nickname"><div class="err" id="gErr"></div><button class="btn primary wide">Join</button></form>`;
  $("#gate").onsubmit = async e=>{ e.preventDefault(); const n = $("#gName").value.trim(); if(!n) return;
    try{ me = await api(`/api/rooms/${code}/join`, {name:n}); store("ww:"+code, {me, hostKey}); lastSig=""; poll(++pollGen, -1); }catch(err){ $("#gErr").textContent = err.message; } };
}

/* ---------- lobby ---------- */

  const ps = Object.keys(room.players), s = room.settings, mine = P(me.pid);

  const wolves = s.wolves || (n <= 6 ? 1 : n <= 10 ? 2 : 3);

    <div class="panel" style="margin-top:18px"><div class="photo-pick"><button class="face" id="photoBtn" type="button" aria-label="Add your photo">${mine.photo ? `<img src="/api/img/${mine.photo}" alt="">` : "Add<br>photo"}</button>
      <div><b>${esc(mine.name)}</b><p class="hint">${mine.photo ? "Looking good. Tap your photo to change it." : "Tap the circle to take a selfie or pick a photo. It goes on your card."}</p></div></div></div>
    <div class="ring">${ps.map(pid=>`<div class="tok fadeup">${face(pid,"face")}<span class="nm">${esc(P(pid).name)}${pid===me.pid?" (you)":""}</span>${hostKey && pid!==me.pid ? `<button class="btn small" data-kick="${pid}" style="padding:2px 10px;font-size:11px">Kick</button>`:""}</div>`).join("")}</div>
    <div class="panel" style="margin-top:20px"><h2 style="font-size:20px">${hostKey ? "Set up the game" : "Game setup"}</h2>
      <div><label>Roles</label><div class="toggles">

        ${["seer","doctor","hunter"].map(r=>`<button type="button" class="tg r-${r} ${s[r]?"on":""}" data-toggle="${r}" ${hostKey?"":"disabled"}><i style="background:var(--c2)"></i>${rname(r)}</button>`).join("")}
        <span class="tg"><i style="background:var(--vill2)"></i>${villagers} Villager${villagers===1?"":"s"}</span></div></div>
      <div class="row3">
        <div><label for="sWolves">Werewolves</label>${sel("sWolves", [[0,"Auto"],[1,"1"],[2,"2"],[3,"3"],[4,"4"]], s.wolves)}</div>
        <div><label for="sNight">Night</label>${sel("sNight", [[30,"30 sec"],[45,"45 sec"],[60,"1 min"],[90,"90 sec"]], s.nightSec)}</div>
        <div><label for="sDay">Discussion</label>${sel("sDay", [[60,"1 min"],[120,"2 min"],[180,"3 min"],[300,"5 min"]], s.daySec)}</div>
        <div><label for="sVote">Voting</label>${sel("sVote", [[30,"30 sec"],[60,"1 min"],[90,"90 sec"]], s.voteSec)}</div>
        <div><label for="sSpice">Narrator</label>${sel("sSpice", [["wholesome","Wholesome"],["spicy","Spicy"],["unhinged","Unhinged"]], s.spice)}</div>
        <div><label for="sSetting">Setting</label>${sel("sSetting", [["ninja","Ninja village"],["classic","Dark village"],["school","Anime high school"],["space","Space station"],["pirate","Pirate ship"],["custom","Custom"]], s.setting)}</div>
      </div>
      ${s.setting === "custom" ? `<div><label for="sCustom">Describe the setting</label><input type="text" id="sCustom" maxlength="200" value="${esc(s.custom)}" ${hostKey?"":"disabled"} placeholder="e.g. a K-pop idol dorm, or our school cafeteria"></div>` : ""}
      ${hostKey ? `<button class="btn primary wide" data-host="start" ${n<4?"disabled":""}>${n<4?`Waiting for ${4-n} more`:"Deal the cards"}</button>` : `<p class="hint" style="text-align:center">The host deals the cards when everyone is here.</p>`}
    </div>

      <p class="hint" style="margin-top:10px">Night: wolves pick a victim, the Seer and Doctor use their powers, and everyone else picks who they suspect. Day: talk, then vote someone out. The village wins when every wolf is gone. The wolves win when they match the village in number.</p></details>`;
  $("#photoBtn").onclick = ()=>$("#photoInput").click();

    const send = extra => act("settings", extra).catch(err=>toast(err.message));

    $("#sDay").onchange = e=>send({daySec:+e.target.value}); $("#sVote").onchange = e=>send({voteSec:+e.target.value});

$("#photoInput").onchange = async e=>{
  const f = e.target.files[0]; e.target.value = ""; if(!f) return;
  try{
    const img = await new Promise((res, rej)=>{ const i = new Image(); i.onload = ()=>res(i); i.onerror = rej; i.src = URL.createObjectURL(f); });
    const c = document.createElement("canvas"); c.width = c.height = 320; const x = c.getContext("2d");
    const m = Math.min(img.width, img.height); x.drawImage(img, (img.width-m)/2, (img.height-m)/2, m, m, 0, 0, 320, 320);
    await act("photo", {img: c.toDataURL("image/jpeg", .82)}); toast("Photo added");
  }catch(err){ toast(err.message || "That photo didn't work. Try another one."); }
};

/* ---------- role reveal ---------- */
function cardHTML(pid, role, opts={}){
  const p = P(pid) || {name:"?"};
  return `<div class="card ${opts.flip?"flip":""} ${opts.dead?"dead":""} r-${role}" ${opts.id?`id="${opts.id}"`:""} style="${opts.delay?`transition-delay:${opts.delay}s`:""}">
    <div class="side back"><div class="mn"></div>${opts.tap?'<div class="tap">TAP TO REVEAL</div>':""}</div>
    <div class="side front"><span class="owner" style="background:${hue(p.name)}">${p.photo?`<img src="/api/img/${p.photo}" alt="">`:esc(p.name[0])}</span>
      <div><div class="team">${TEAM(role)}</div><div class="rname">${rname(role)}</div></div>${ART[role]}
      <div class="desc">${opts.mini ? esc(p.name) : DESC[role]}</div>${opts.stamp?`<span class="stamp2">${opts.stamp}</span>`:""}</div></div>`;
}
let revealed = false;
function rolesView(){
  const role = room.me.role, mine = P(me.pid);
  const pack = role === "wolf" ? Object.keys(room.players).filter(pid=>pid!==me.pid && P(pid).role==="wolf") : [];
  const ready = Object.values(room.players).filter(p=>p.role && p.ready).length, total = Object.values(room.players).filter(p=>p.role).length;
  $("#stage").innerHTML = `<div class="eyebrow fadeup">Keep it secret</div><h1 class="title fadeup">Your role</h1>
    <div class="cardwrap">${cardHTML(me.pid, role, {tap:true, id:"myCard", flip: revealed})}</div>
    <div id="after" ${revealed?"":"hidden"} class="fadeup" style="display:grid;gap:12px">
      ${pack.length ? `<div class="panel"><b style="color:var(--wolf2)">Your pack</b><div class="ring" style="margin-top:0">${pack.map(pid=>`<div class="tok">${face(pid,"face")}<span class="nm">${esc(P(pid).name)}</span></div>`).join("")}</div></div>` : ""}
      ${mine.ready ? `<p class="sub">Waiting for everyone · ${ready}/${total} ready</p>` : `<button class="btn primary wide" id="readyBtn">I've memorized it</button>`}
    </div>
    <p class="hint" style="text-align:center;margin-top:10px">Hide your screen, then tap the card.</p>`;
  $("#myCard").onclick = ()=>{ revealed = !revealed; $("#myCard").classList.toggle("flip", revealed); if(revealed){ buzz(80); $("#after").hidden = false; } };
  if($("#readyBtn")) $("#readyBtn").onclick = ()=>act("ready").catch(err=>toast(err.message));
}

/* ---------- night ---------- */
const NIGHT_TEXT = {
  wolf: ["Choose your prey", "Tap who the pack should eliminate. Your packmates see your pick live."],
  seer: ["Peer into a soul", "Tap a player to learn if they are a werewolf. One vision per night."],
  doctor: ["Protect someone", "Tap who to shield from the wolves tonight. It can be you."],
  hunter: ["Who do you suspect?", "Keep up appearances. Tap who you think is a wolf."],
  villager: ["Who do you suspect?", "Keep up appearances. Tap who you think is a wolf."],
};
function night(){
  const role = room.me.role, mn = room.myNight || {};
  if(!room.me.alive){ return ghostView("Night falls", "The village sleeps. You watch from beyond."); }
  const [h, sub] = NIGHT_TEXT[role] || NIGHT_TEXT.villager;
  const wolfVotes = mn.wolfVotes || {};
  const targets = alivePids();
  $("#stage").innerHTML = `<div class="fadeup"><div class="eyebrow">Night ${room.day}</div><h1 class="title">${h}</h1><p class="sub">${sub}</p></div>
    <div class="ring">${targets.map(pid=>{
      const isWolf = role === "wolf" && P(pid).role === "wolf";
      const self = pid === me.pid && (role === "seer");
      const blocked = isWolf || self || (role === "doctor" && pid === mn.noRepeat) || (role === "seer" && mn.done);
      const packPicks = Object.entries(wolfVotes).filter(([w,t])=>t===pid).map(([w])=>w);
      const cls = ["tok", blocked?"off":"pick", mn.target===pid ? (role==="wolf"?"wolfsel":"sel") : ""].join(" ");
      return `<button class="${cls}" data-target="${pid}" ${blocked?"disabled":""}>${face(pid,"face")}<span class="nm">${esc(P(pid).name)}${pid===me.pid?" (you)":""}</span>
        ${isWolf?'<span class="badge" style="color:var(--wolf2)">Pack</span>':""}${role==="doctor"&&pid===mn.noRepeat?'<span class="badge">Last night</span>':""}
        ${packPicks.length?`<span class="voters">${packPicks.map(w=>face(w)).join("")}</span>`:'<span class="voters"></span>'}</button>`; }).join("")}</div>
    <p class="sub" style="margin-top:16px">${mn.done ? (role==="seer" ? "Your vision is done. Sleep tight." : "Locked in. You can still change your mind.") : "Pick someone."} · ${room.acted}/${room.actNeed} have acted</p>
    ${role==="seer" && room.seerLog?.length ? `<div class="panel" style="margin-top:14px"><b style="color:var(--seer2)">Your visions</b>${room.seerLog.map(v=>`<div>Night ${v.night}: ${esc(v.name)} is ${v.wolf?'<b style="color:var(--blood)">a werewolf</b>':'<b style="color:var(--mint)">not a werewolf</b>'}</div>`).join("")}</div>` : ""}`;
  document.querySelectorAll("[data-target]").forEach(b=>b.onclick = async ()=>{
    try{ await act("night", {target:b.dataset.target}); buzz(40); if(role === "seer") seerVision(b.dataset.target); }catch(err){ toast(err.message); }
  });
}
function seerVision(pid){
  setTimeout(()=>{
    const v = (room.seerLog||[]).slice(-1)[0];
    const wolf = v && v.pid === pid ? v.wolf : null;
    $("#overlay").innerHTML = `<div class="vision" id="vision"><div style="text-align:center;max-width:420px"><div class="orb"></div>
      <div class="eyebrow">Your vision</div><h2 style="font-size:clamp(26px,7vw,40px);margin-top:8px">${esc(P(pid).name)}</h2>
      <div class="drum" style="color:${wolf?"var(--blood)":"var(--mint)"};margin-top:10px">${wolf===null?"…":wolf?"IS A WEREWOLF":"is not a werewolf"}</div>
      <p class="sub">Keep a straight face.</p><button class="btn primary" id="closeVision" style="margin-top:14px">Close</button></div></div>`;
    buzz(wolf ? [200,80,200] : 80);
    $("#closeVision").onclick = ()=>$("#overlay").innerHTML = "";
  }, 700);
}
function ghostView(h, sub){
  $("#stage").innerHTML = `<div class="fadeup"><div class="eyebrow">You are a ghost</div><h1 class="title">${h}</h1><p class="sub">${sub}</p></div>
    <div class="ghost">Ghosts can see everyone's role. No spoilers out loud.</div>
    <div class="minicards">${Object.keys(room.players).filter(pid=>P(pid).role).map(pid=>cardHTML(pid, P(pid).role, {flip:true, mini:true, dead:!P(pid).alive, stamp: P(pid).alive?"ALIVE":"DEAD"})).join("")}</div>`;
}

/* ---------- dawn, verdict, hunter's shot ---------- */
let typer = null;
function typeInto(el, text){
  clearInterval(typer); let i = 0; el.innerHTML = '<span></span><span class="caret"></span>';
  const span = el.firstChild;
  typer = setInterval(()=>{ i += 2; span.textContent = text.slice(0, i); if(i >= text.length){ clearInterval(typer); el.lastChild.remove(); } }, 28);
}
function reveal(){
  const c = room.current || {}, ph = room.phase;
  const heading = {dawn:`Dawn of day ${room.day}`, verdict:"The village has spoken", shot:"The Hunter's last shot"}[ph];
  const dead = c.dead || [];
  let body;
  if(dead.length){
    const pid = dead[0];
    const stamp = {dawn:"KILLED IN THE NIGHT", verdict:"VOTED OUT", shot:"SHOT DOWN"}[ph];
    body = `<div class="cardwrap" style="position:relative">${cardHTML(pid, c.roles[pid], {id:"deadCard"})}<span class="stamp">${stamp}</span></div>`;
  } else if(ph === "dawn" && c.saved){
    body = `<svg class="shield" viewBox="0 0 120 120">${ART.doctor.replace(/<\/?svg[^>]*>/g,"")}</svg><p class="sub" style="font-weight:800;color:var(--mint)">Someone was saved tonight.</p>`;
  } else {
    body = `<p class="drum" style="margin:30px 0">${ph==="verdict"?"Nobody was voted out":ph==="shot"?"The shot missed":"Everyone survived"}</p>`;
  }
  const tally = ph === "verdict" && c.tally ? `<div class="panel" style="margin-top:14px"><b>How everyone voted</b>${Object.entries(c.votes||{}).map(([v,t])=>`<div style="display:flex;align-items:center;gap:8px;font-size:14px">${face(v,"av")}<span>${esc(P(v)?.name||"?")}</span><span class="muted">voted</span><b>${t==="skip"?"skip":esc(P(t)?.name||"?")}</b></div>`).join("") || '<span class="muted">Nobody voted.</span>'}</div>` : "";
  $("#stage").innerHTML = `<div class="fadeup"><div class="eyebrow">${ph==="dawn"?"The sun rises":"Day "+room.day}</div><h1 class="title">${heading}</h1></div>
    <div class="story" id="story" style="margin-top:16px">${c.story ? "" : '<div class="thinking"><i></i><i></i><i></i></div><span class="muted" style="font-family:var(--body);font-size:14px">The narrator is writing…</span>'}</div>
    ${body}${tally}
    ${room.me.ghost ? '<div class="ghost">You are a ghost now. You can see every role, but stay quiet.</div>' : ""}`;
  if(c.story) typeInto($("#story"), c.story);
  if($("#deadCard")) setTimeout(()=>$("#deadCard")?.classList.add("flip"), 1100);
  document.querySelectorAll(".av").forEach(a=>a.style.cssText += ";width:24px;height:24px;border-radius:50%;overflow:hidden;display:inline-grid;place-items:center;font-size:11px;color:#0b0820");
}

/* ---------- day: talk ---------- */
function day(){
  const story = room.current?.story;
  $("#stage").innerHTML = `<div class="fadeup"><div class="eyebrow">Day ${room.day}</div><h1 class="title">Who is lying?</h1><p class="sub">Talk it out. Accuse, defend, bluff. The vote starts when the timer ends.</p></div>
    ${story ? `<p class="story" style="font-size:15px;opacity:.85;margin-top:14px">${esc(story)}</p>` : ""}
    <div class="ring">${Object.keys(room.players).filter(pid=>P(pid).role).map(pid=>`<div class="tok ${P(pid).alive?"":"dead"}">${face(pid,"face")}<span class="nm">${esc(P(pid).name)}</span>${!P(pid).alive?`<span class="rolechip r-${P(pid).role}" style="background:var(--c1);color:#fff">${rname(P(pid).role)}</span>`:""}</div>`).join("")}</div>
    ${room.me.ghost ? '<div class="ghost">You are a ghost. Haunt quietly.</div>' : ""}`;
}

/* ---------- vote ---------- */
function vote(){
  const votes = room.votes || {}, mine = votes[me.pid], canVote = room.me.alive;
  const targets = alivePids();
  const tally = t => Object.entries(votes).filter(([v,x])=>x===t).map(([v])=>v);
  const voted = Object.keys(votes).length, need = targets.length;
  $("#stage").innerHTML = `<div class="fadeup"><div class="eyebrow">Day ${room.day} · The vote</div><h1 class="title">${canVote ? "Point the finger" : "The village votes"}</h1>
    <p class="sub">${canVote ? "Tap who should be cast out. Everyone sees your vote." : "Ghosts don't vote."} · ${voted}/${need} voted</p></div>
    <div class="ring">${targets.map(pid=>{ const vs = tally(pid); const self = pid === me.pid;
      return `<button class="tok ${canVote && !self ? "pick" : "off"} ${mine===pid?"wolfsel":""}" data-vote="${pid}" ${canVote&&!self?"":"disabled"}>${face(pid,"face")}<span class="nm">${esc(P(pid).name)}${self?" (you)":""}</span>
        <span class="voters">${vs.map(v=>face(v)).join("")}</span>${vs.length?`<span class="count">${vs.length}</span>`:""}</button>`; }).join("")}</div>
    ${canVote ? `<div style="display:flex;justify-content:center;margin-top:16px"><button class="btn ${mine==="skip"?"primary":""}" data-vote="skip">Skip vote ${tally("skip").length?`(${tally("skip").length})`:""}</button></div>` : ""}`;
  document.querySelectorAll("[data-vote]").forEach(b=>b.onclick = ()=>act("vote", {target:b.dataset.vote}).then(()=>buzz(40)).catch(err=>toast(err.message)));
}

/* ---------- hunter ---------- */
function hunter(){
  const h = room.hunter?.pid;
  if(h === me.pid){
    $("#stage").innerHTML = `<div class="fadeup"><div class="eyebrow">You are dying</div><h1 class="title" style="color:var(--hunt2)">Take your shot</h1><p class="sub">Pick one player to take down with you.</p></div>
      <div class="cardwrap">${cardHTML(me.pid, "hunter", {flip:true})}</div>
      <div class="ring">${alivePids().map(pid=>`<button class="tok pick" data-shoot="${pid}">${face(pid,"face")}<span class="nm">${esc(P(pid).name)}</span></button>`).join("")}</div>`;
    document.querySelectorAll("[data-shoot]").forEach(b=>b.onclick = ()=>act("shoot", {target:b.dataset.shoot}).catch(err=>toast(err.message)));
  } else {
    $("#stage").innerHTML = `<div class="fadeup"><div class="eyebrow">Wait…</div><h1 class="title" style="color:var(--hunt2)">The Hunter takes aim</h1><p class="sub">${esc(P(h)?.name||"The Hunter")} has one last shot.</p></div>
      <svg viewBox="0 0 120 120" style="width:180px;display:block;margin:30px auto;animation:orb 2s infinite">${ART.hunter.replace(/<\/?svg[^>]*>/g,"")}</svg>`;
  }
}

/* ---------- final ---------- */
function final(){
  const w = room.winner, ep = room.epilogue;
  const pids = Object.keys(room.players).filter(pid=>P(pid).role);
  $("#stage").innerHTML = `<div class="banner ${w}">${w==="wolves"?"The wolves win":"The village wins"}</div>
    <p class="sub" style="font-size:16px">${w==="wolves"?"The pack ate well tonight.":"Every wolf has been found."}</p>
    <div class="story" id="epi" style="margin-top:18px">${ep ? "" : '<div class="thinking"><i></i><i></i><i></i></div><span class="muted" style="font-family:var(--body);font-size:14px">The narrator is writing the ending…</span>'}</div>
    ${ep && ep.awards.length ? `<div class="awards fadeup" style="margin-top:14px;animation-delay:2s">${ep.awards.map(a=>{ const pid = pids.find(x=>P(x).name===a.name); return `<span class="award">${pid?face(pid,"av"):""}${esc(a.name)} <small>${esc(a.award)}</small></span>`; }).join("")}</div>` : ""}
    <h2 style="font-size:20px;text-align:center;margin-top:26px">Every role</h2>
    <div class="minicards">${pids.map((pid,i)=>cardHTML(pid, P(pid).role, {mini:true, dead:!P(pid).alive, stamp:P(pid).alive?"SURVIVED":"DIED", delay: .4+i*.18, id:"fc"+i})).join("")}</div>
    ${room.seerLog?.length ? `<div class="panel" style="margin-top:16px"><b style="color:var(--seer2)">The Seer's visions</b>${room.seerLog.map(v=>`<div style="font-size:14px">Night ${v.night}: ${esc(v.name)} ${v.wolf?"was a werewolf":"was innocent"}</div>`).join("")}</div>` : ""}`;
  if(ep) typeInto($("#epi"), ep.text);
  setTimeout(()=>document.querySelectorAll(".minicards .card").forEach(c=>c.classList.add("flip")), 250);
}

/* ---------- host controls, timer ---------- */
function renderHostbar(){
  const bar = $("#hostbar"), ph = room?.phase;
  if(!hostKey || !room || !me || !room.players[me.pid]){ bar.hidden = true; return; }
  const b = [];
  if(ph === "roles") b.push('<button class="btn small" data-host="next">Start the night now</button>');
  if(ph === "night") b.push('<button class="btn small" data-host="addtime">+30s</button><button class="btn small" data-host="skip">End the night</button>');
  if(["dawn","verdict","shot"].includes(ph)) b.push('<button class="btn primary" data-host="next">Continue</button>');
  if(ph === "day") b.push('<button class="btn small" data-host="addtime">+30s</button><button class="btn blood" data-host="next">Start the vote</button>');
  if(ph === "vote") b.push('<button class="btn small" data-host="addtime">+30s</button><button class="btn small" data-host="skip">Count the votes</button>');
  if(ph === "hunter") b.push('<button class="btn small" data-host="skip">Skip the shot</button>');
  if(ph === "final") b.push('<button class="btn primary" data-host="playagain">Play again</button>');
  bar.hidden = !b.length; bar.innerHTML = b.join("");
}
document.addEventListener("click", async e=>{
  const h = e.target.closest("[data-host]"), k = e.target.closest("[data-kick]");
  if(h){ try{ await act(h.dataset.host, h.dataset.host==="addtime"?{sec:30}:{}); if(h.dataset.host==="playagain"){ revealed = false; } }catch(err){ toast(err.message); } }
  if(k){ if(k.dataset.sure !== "1"){ k.dataset.sure = "1"; k.textContent = "Sure?"; return; } act("kick", {pid:k.dataset.kick}).catch(err=>toast(err.message)); }
});
function tickTimer(){
  const el = $("#timer");
  if(!room || !room.deadline){ el.hidden = true; return; }
  const left = Math.max(0, Math.ceil(room.deadline - serverNow()));
  el.hidden = false; el.textContent = `${Math.floor(left/60)}:${String(left%60).padStart(2,"0")}`;
  el.classList.toggle("low", left <= 10);
}
setInterval(tickTimer, 250);

const c0 = (new URLSearchParams(location.search).get("room")||"").toUpperCase();
if(c0) openRoom(c0); else home();
</script>
</body>
</html>
