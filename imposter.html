<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0D18">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Game Night">
<title>Imposter</title>
<link rel="stylesheet" href="/festival.css">
<style>
/* Layout: the mask stall. Everyone wears a festival mask; one of you is the fox. Each secret word comes
   sealed in a red festival envelope, and clues hang like paper plaques. One centered column for phones.
   Colors come from festival.css. */
:root{
  --desk:var(--night); --desk2:var(--night-2); --line2:var(--line-2);
  --glass:color-mix(in srgb,var(--night-2) 90%,transparent); --glass2:rgba(243,235,221,.07);
  --manila:var(--lantern); --manila2:color-mix(in srgb,var(--lantern) 72%,#000); --paper2:var(--paper-2);
  --red:color-mix(in srgb,var(--lantern) 85%,#000); --green:var(--shrine); --amber:var(--gold);
  --type:var(--display);
}
*{box-sizing:border-box}
html,body{margin:0}
body{overflow-x:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}

[hidden]{display:none!important}

.muted{color:var(--muted)}
.noren{background:var(--paper-2);color:var(--ink)}
.noren .th-btn{border-color:rgba(30,26,46,.35)}
.code{font-weight:700;font-size:14px;letter-spacing:.16em;border:1.5px solid currentColor;border-radius:999px;padding:1px 10px;opacity:.85}
.spacer{flex:1}
.timer{font-weight:700;font-size:16px;font-variant-numeric:tabular-nums;border-radius:999px;padding:3px 12px;background:var(--ink);color:var(--paper)}
.timer.low{background:var(--lantern);color:var(--on-lantern);animation:beat 1s infinite}
@keyframes beat{50%{transform:scale(1.07)}}
.stage{width:min(760px,100%);margin:0 auto;padding:4px max(16px,env(safe-area-inset-left,0px)) calc(120px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px))}
.eyebrow{text-align:center;font-size:15px;font-weight:700;color:var(--amber)}
.title{font-size:clamp(32px,7.5vw,52px);line-height:1.1;text-align:center;margin-top:4px}
.sub{text-align:center;color:var(--muted);margin:8px auto 0;max-width:52ch}
.panel{background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:14px;backdrop-filter:blur(10px)}
.panel h2{font-size:24px}
.btn{border:1px solid var(--line2);background:var(--glass2);border-radius:999px;padding:11px 20px;font-weight:700;transition:transform .12s,background .2s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--lantern);border-color:var(--lantern);color:var(--on-lantern)}
.btn.red{background:var(--paper);border-color:var(--paper);color:var(--ink)}
.btn.small{padding:6px 12px;font-size:13px}
.btn.wide{width:100%}
label{display:block;font-size:14px;font-weight:700;color:var(--muted);margin-bottom:6px}
input[type=text],select{width:100%;background:var(--night);border:1px solid var(--line);border-radius:10px;padding:11px 13px;outline:none;color:var(--fg)}
input[type=text]:focus,select:focus{border-color:var(--amber)}
select option{background:var(--night)}
.err{color:var(--danger);font-size:14px;min-height:1.4em}
.hint{font-size:13px;color:var(--muted);margin:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
@media (max-width:520px){.row3{grid-template-columns:1fr 1fr}}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chips button{border:1px solid var(--line);background:rgba(0,0,0,.25);border-radius:999px;padding:6px 13px;font-weight:700;font-size:13px}
.chips button.on{border-color:var(--amber);background:rgba(217,164,65,.12);color:var(--amber)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{border:1px solid var(--line);background:rgba(0,0,0,.25);border-radius:12px;padding:11px;text-align:left;display:grid;gap:2px}
.seg button small{color:var(--muted);font-weight:500;line-height:1.35}
.seg button.on{border-color:var(--amber);background:rgba(217,164,65,.1)}

/* people */
.ring{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:14px;margin-top:16px}
.tok{position:relative;display:grid;justify-items:center;gap:6px;border:1px solid transparent;background:rgba(255,255,255,.03);padding:10px 6px;border-radius:18px;transition:transform .2s cubic-bezier(.2,1.5,.4,1),background .18s,border-color .18s,box-shadow .2s}
.tok .face{position:relative;width:72px;height:72px;border-radius:50%;overflow:hidden;border:2.5px solid rgba(255,255,255,.22);display:grid;place-items:center;font-weight:900;font-size:26px;color:var(--ink);box-shadow:0 12px 26px -10px rgba(0,0,0,.9);transition:border-color .2s,box-shadow .2s}
.tok .face img,.mini img,.pin img{width:100%;height:100%;object-fit:cover;object-position:50% 20%;display:block}
.tok .nm{font-weight:800;font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tok.pick{cursor:pointer}
.tok.pick:hover{transform:translateY(-5px) scale(1.03);background:rgba(255,255,255,.07);border-color:var(--line2)}
.tok.sel{background:color-mix(in srgb,var(--lantern) 14%,transparent);border-color:color-mix(in srgb,var(--lantern) 65%,transparent);box-shadow:0 0 28px -8px color-mix(in srgb,var(--lantern) 65%,transparent)}
.tok.sel .face{border-color:var(--lantern);box-shadow:0 0 0 4px color-mix(in srgb,var(--lantern) 35%,transparent),0 0 28px var(--lantern)}
.tok.off{opacity:.4;cursor:not-allowed}
.mini{width:22px;height:22px;border-radius:50%;overflow:hidden;display:inline-grid;place-items:center;font-size:9px;font-weight:900;color:var(--ink);border:1.5px solid var(--desk);vertical-align:middle}
.voters{display:flex;justify-content:center;flex-wrap:wrap;gap:3px;min-height:22px}
.voters .mini{animation:drop .35s cubic-bezier(.3,1.6,.5,1) backwards}
@keyframes drop{from{transform:translateY(-14px) scale(.4);opacity:0}}
.count{font-family:var(--mono);font-size:15px;color:var(--lantern);font-weight:900}

/* the classified neon dossier */
.filewrap{display:grid;justify-items:center;margin:22px 0 8px;perspective:1200px}
.file{position:relative;width:min(330px,86vw);aspect-ratio:4/5;cursor:pointer}
.file .paper{
  position:absolute;left:5%;right:5%;top:7%;bottom:4%;
  background:linear-gradient(165deg,#192242,#0e1428);color:var(--fg);
  border:1.5px solid color-mix(in srgb,var(--shrine) 45%,var(--line2));
  border-radius:16px;box-shadow:0 18px 40px -16px #000,inset 0 1px 0 rgba(255,255,255,.12);
  padding:22px 18px;display:grid;align-content:start;gap:10px;
  transition:transform .8s cubic-bezier(.3,1.3,.4,1);
}
.file.imp .paper{border-color:color-mix(in srgb,var(--lantern) 70%,transparent);background:linear-gradient(165deg,#2c1125,#110a1a)}
.file .paper .lbl{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--shrine)}
.file.imp .paper .lbl{color:var(--lantern)}
.file .paper .word{margin-right:64px;font-family:var(--display);font-size:clamp(30px,8.5vw,44px);line-height:1.08;overflow-wrap:anywhere;color:var(--fg)}
.file .paper .note{font-size:14.5px;line-height:1.5;color:var(--muted)}
.file .cover{
  position:absolute;inset:0;transform-origin:left center;transition:transform .95s cubic-bezier(.35,1.25,.4,1);
  background:radial-gradient(circle at 80% 18%,color-mix(in srgb,var(--lantern) 42%,transparent),transparent 55%),linear-gradient(155deg,#1d2342,#0d1022);
  border:1.5px solid color-mix(in srgb,var(--lantern) 65%,rgba(255,255,255,.2));
  border-radius:10px 18px 18px 10px;
  box-shadow:0 30px 60px -20px rgba(0,0,0,.95),0 0 36px -12px color-mix(in srgb,var(--lantern) 55%,transparent);
  display:grid;place-items:center;backface-visibility:hidden;z-index:2;overflow:hidden;
}
.file .cover::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,var(--lantern),var(--gold),var(--shrine))}
.file .cover::after{content:"";position:absolute;left:14%;right:14%;top:66%;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);border-radius:2px}
.file .cover .ts{width:34%;color:var(--lantern);margin-top:-6%;filter:drop-shadow(0 0 18px color-mix(in srgb,var(--lantern) 75%,transparent))}
.file .cover .ts svg{display:block;width:100%}
.file .cover .agent{position:absolute;bottom:20%;font-family:var(--display);color:var(--fg);font-size:21px}
.file .cover .tap{position:absolute;bottom:7%;font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);animation:breathe 2s infinite}
@keyframes breathe{50%{opacity:.35}}
.file.open .cover{transform:rotateY(-160deg)}
.file .pin{position:absolute;top:12%;right:9%;width:58px;height:58px;border-radius:50%;overflow:hidden;border:2.5px solid var(--gold);box-shadow:0 6px 18px rgba(0,0,0,.55);display:grid;place-items:center;font-weight:900;font-size:22px;color:var(--ink)}
.file.imp .paper .word{color:var(--lantern);text-shadow:0 0 24px color-mix(in srgb,var(--lantern) 55%,transparent)}
.stamp{position:absolute;left:50%;top:58%;z-index:4;transform:translate(-50%,-50%) rotate(-12deg) scale(2.6);opacity:0;font-family:var(--display);font-size:clamp(30px,8.5vw,46px);border:5px solid currentColor;border-radius:12px;padding:3px 18px;background:rgba(10,13,24,.82);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:slam .45s .9s cubic-bezier(.2,1.6,.4,1) forwards;white-space:nowrap}
.stamp.imp{color:#FF3E78;box-shadow:0 0 30px rgba(255,62,120,.5)} .stamp.crew{color:var(--green);box-shadow:0 0 30px rgba(0,212,170,.45)}
@keyframes slam{to{opacity:.96;transform:translate(-50%,-50%) rotate(-12deg) scale(1)}}

/* neon clue cards */
.turns{display:flex;gap:10px;overflow-x:auto;padding:10px 4px;scrollbar-width:none}
.turns .t{flex:none;display:grid;justify-items:center;gap:4px;opacity:.42;transition:opacity .3s,transform .3s}
.turns .t .face{width:46px;height:46px;border-radius:50%;overflow:hidden;display:grid;place-items:center;font-weight:900;color:var(--ink);border:2px solid rgba(255,255,255,.15)}
.turns .t span{font-size:12.5px;font-weight:700}
.turns .t.done{opacity:.82}
.turns .t.now{opacity:1;transform:scale(1.14)}
.turns .t.now .face{border-color:var(--amber);box-shadow:0 0 0 3px color-mix(in srgb,var(--amber) 35%,transparent),0 0 24px var(--amber)}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-top:14px}
.slip{
  position:relative;overflow:hidden;
  background:linear-gradient(165deg,color-mix(in srgb,var(--night-2) 95%,transparent),color-mix(in srgb,var(--night) 98%,transparent));
  color:var(--fg);padding:14px 13px 12px;border-radius:16px;
  border:1px solid var(--line2);
  box-shadow:0 14px 30px -16px rgba(0,0,0,.9);
  animation:slip .45s cubic-bezier(.2,1.4,.4,1) backwards;
  transition:transform .18s,border-color .18s,box-shadow .18s;
}
.slip:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--gold) 55%,var(--line2))}
@keyframes slip{from{opacity:0;transform:translateY(14px) scale(.9)}}
.slip::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,var(--lantern),var(--gold));opacity:.7}
.slip .who{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;color:var(--muted)}
.slip .txt{font-family:var(--display);font-size:21px;line-height:1.22;margin-top:6px;overflow-wrap:anywhere;color:var(--fg)}
.slip.late .txt{opacity:.45;font-size:15px}
.slip.imp{border-color:#FF3E78;box-shadow:0 0 0 1px #FF3E78,0 0 26px -8px #FF3E78}
.slip.imp::before{background:#FF3E78;opacity:1}
.yourturn{
  background:linear-gradient(160deg,color-mix(in srgb,var(--amber) 14%,var(--night-2)),var(--night-2));
  color:var(--fg);border:1.5px solid var(--amber);border-radius:20px;padding:18px;
  display:grid;gap:11px;box-shadow:0 20px 44px -20px #000,0 0 32px -12px color-mix(in srgb,var(--amber) 50%,transparent);
  animation:slip .45s backwards;
}
.yourturn b{font-family:var(--display);font-size:22px;color:var(--amber)}
.yourturn input{background:var(--night);color:var(--fg);border:1.5px solid var(--line2);font-family:var(--display);font-size:20px}
.yourturn input:focus{border-color:var(--amber);box-shadow:0 0 0 3px color-mix(in srgb,var(--amber) 20%,transparent)}
.yourturn .btn.red{background:linear-gradient(135deg,var(--lantern),#FF6B4A);border-color:transparent;color:#fff;box-shadow:0 8px 24px -8px color-mix(in srgb,var(--lantern) 70%,transparent)}
.peek{display:flex;justify-content:center;margin-top:8px}
.peek button{border:1px solid color-mix(in srgb,var(--amber) 45%,var(--line2));background:rgba(255,255,255,.06);border-radius:999px;padding:7px 18px;font-weight:700;font-size:14px;transition:background .15s,transform .12s}
.peek button:hover{background:rgba(255,255,255,.12);transform:translateY(-1px)}

/* results */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.wordcard{background:linear-gradient(165deg,#18213e,#0e1428);color:var(--fg);border:1.5px solid color-mix(in srgb,var(--shrine) 55%,transparent);border-radius:18px;padding:16px;text-align:center;box-shadow:0 18px 36px -18px rgba(0,0,0,.9);animation:slip .5s backwards}
.wordcard .lbl{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--shrine);margin-bottom:4px}
.wordcard .w{font-family:var(--display);font-size:clamp(24px,6vw,34px);overflow-wrap:anywhere}
.wordcard.imp{border-color:color-mix(in srgb,var(--lantern) 70%,transparent);background:linear-gradient(165deg,#2b1125,#120a1b)}
.wordcard.imp .lbl{color:var(--lantern)}
.wordcard.imp .w{color:var(--lantern)}
.chat{display:grid;gap:9px;margin-top:14px}
.msg{display:grid;grid-template-columns:32px minmax(0,1fr);gap:10px;align-items:start;animation:slip .45s backwards}
.msg .bot{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:12px;background:var(--amber);color:var(--ink)}
.msg .mini{width:32px;height:32px;font-size:13px}
.bubble{background:var(--glass2);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:9px 12px;overflow-wrap:anywhere}
.bubble b{margin-right:6px}
.scores{display:grid;gap:8px;margin-top:12px}
.srow{display:grid;grid-template-columns:34px 30px 1fr auto auto;gap:10px;align-items:center;background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-weight:800;animation:slip .45s backwards}
.srow .rk{font-weight:900;font-size:18px;color:var(--muted);text-align:center}
.srow.first{border-color:var(--amber);background:rgba(217,164,65,.1)}
.srow.first .rk{color:var(--amber)}
.srow .plus{color:var(--green);font-size:13px}
.srow .pts{font-weight:900;font-size:18px}
.thinking{display:flex;justify-content:center;gap:6px;padding:10px}
.thinking i{width:8px;height:8px;border-radius:50%;background:var(--amber);animation:breathe 1.2s infinite}
.thinking i:nth-child(2){animation-delay:.2s}.thinking i:nth-child(3){animation-delay:.4s}
.settled .slip,.settled .fadeup,.settled .rolecard,.settled .wordcard,.settled .srow,.settled .msg,.settled .yourturn{animation:none}
.fadeup{animation:fadeup .6s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes fadeup{from{opacity:0;transform:translateY(16px)}}
.hostbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;gap:10px;flex-wrap:wrap;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:var(--night-2);border-top:3px solid var(--gold)}
body.has-hostbar{--chat-lift:66px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:50;background:var(--paper);color:var(--ink);font-weight:700;border-radius:999px;padding:10px 18px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.photo-pick{display:flex;align-items:center;gap:14px}
.rolecard{position:relative;display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:center;border-radius:14px;padding:12px 14px;background:color-mix(in srgb,var(--rc) 16%,var(--night-2));border:1.5px solid var(--rc);box-shadow:0 0 30px -10px var(--rc);animation:slip .55s cubic-bezier(.2,1.4,.4,1) backwards}
.rolecard .ri{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:var(--rc);color:#1e1a2e}
.rolecard .ri svg{width:30px;height:30px}
.rolecard > div > b{font-family:var(--display);font-size:22px;color:var(--rc)}
.rolecard p b{color:var(--rc)}
.rolecard p{margin:2px 0 0;font-size:14px;line-height:1.4}
.inplay{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:8px}
.inplay span{font-size:12px;font-weight:800;border-radius:999px;padding:3px 10px;border:1px solid var(--rc);color:var(--rc)}
.rolechips{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.rolechips button{display:grid;gap:1px;text-align:left;border-radius:12px}
.rolechips button small{font-weight:600;color:var(--muted);font-size:11px}
.slip .flag{position:absolute;right:8px;bottom:8px;border:1px solid var(--line2);background:rgba(255,255,255,.08);border-radius:999px;padding:3px 9px;font-size:11px;font-weight:800;color:var(--muted);display:flex;gap:4px;align-items:center;transition:background .15s,color .15s}
.slip .flag:hover{background:rgba(255,255,255,.16);color:var(--fg)}
.slip .flag svg{width:12px;height:12px}
.slip .flag.on{background:#FF3E78;border-color:#FF3E78;color:#fff}
.slip.flagged{box-shadow:0 0 0 3px var(--red),0 10px 20px -10px rgba(0,0,0,.8)}
.slip.flagged::after{content:"Too obvious  -1";position:absolute;top:6px;right:-6px;transform:rotate(8deg);background:var(--red);color:#fff;font-size:11px;font-weight:900;padding:2px 8px;border-radius:4px}
.slip .rl{font-size:11px;font-weight:900;color:var(--rc);margin-left:auto}
.detective{margin-top:14px}
.detective .ring{margin-top:6px}
.why{display:block;font-size:12px;font-weight:600;color:var(--muted);line-height:1.35;margin-top:2px}
.srow .minus{color:var(--red);font-size:13px}
.rolelist{display:flex;flex-wrap:wrap;gap:14px}
.rolelist .tok .tag{font-size:11px;font-weight:900;border-radius:999px;padding:1px 8px;background:var(--rc);color:#1e1a2e}
.photo-pick .face{width:68px;height:68px;border-radius:50%;overflow:hidden;border:3px dashed var(--line2);display:grid;place-items:center;background:rgba(0,0,0,.3);flex:none;font-size:12px;color:var(--muted);text-align:center}
.photo-pick .face img{width:100%;height:100%;object-fit:cover}
details summary{cursor:pointer;font-weight:800}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top noren">
  <a class="noren-back" href="/" aria-label="Back to all games">&larr; Arcade</a>
  <h1>Imposter</h1>
  <button type="button" class="code" id="hCode" title="Copy invite link" aria-label="Copy invite link" hidden></button>
  <span class="spacer"></span>
  <span class="timer" id="timer" hidden></span>
</header>
<main class="stage" id="stage"></main>
<div class="hostbar" id="hostbar" hidden></div>
<div class="toast" id="toast" hidden></div>

<script src="/avatars.js"></script>
<script src="/backguard.js"></script>
<script src="/theme.js"></script>
<script src="/chat.js"></script>
<script src="/pranks.js"></script>
<script src="/roombar.js"></script>
<script src="/howto.js"></script>
<script src="/juice.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hue = n => { let h=0; for(const c of String(n)) h=(h*31+c.charCodeAt(0))%360; return `hsl(${h} 70% 70%)`; };
function store(k, v){ try{ if(v===undefined) return JSON.parse(localStorage.getItem(k)); localStorage.setItem(k, JSON.stringify(v)); }catch(e){ return null; } }
function toast(m){ const t=$("#toast"); t.textContent=m; t.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>t.hidden=true,2600); }
const buzz = p => { try{ if(navigator.vibrate && navigator.userActivation?.hasBeenActive) navigator.vibrate(p); }catch(e){} };
async function api(path, body){
  const r = await fetch(path, body ? {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)} : {});
  const j = await r.json().catch(()=>({error:"The server didn't answer. Try again."}));
  if(!r.ok) throw new Error(j.error || "Something went wrong");
  return j;
}

let code=null, room=null, me=null, hostKey=null, pollGen=0, clockOffset=0, opened=false, peek=false;
const serverNow = () => Date.now()/1000 + clockOffset;
const act = (a, extra={}) => api(`/api/rooms/${code}/${a}`, {hostKey, ...(me||{}), ...extra});
Chat.mount({act});
Pranks.mount({act});
RoomBar.mount({act, game:"imposter", onHostChange:(hk, became)=>{ hostKey = hk; lastSig = ""; if(became) toast("You are now the host!"); if(room){ render(); document.body.classList.toggle("has-hostbar", !$("#hostbar").hidden); } }});
if(window.Juice) Juice.mountMute();
const P = pid => room.players[pid] || {name:"Someone who left"};
const picOf = p => { const src = Avatars.src(p); return src ? `<img src="${esc(src)}" alt="">` : esc(p.name[0].toUpperCase()); };
const face = (pid, cls="mini") => { const p = P(pid); return `<span class="${cls}" data-pid="${esc(pid)}" style="background:${hue(p.name)}">${picOf(p)}</span>`; };
const rd = () => room.round >= 0 ? room.roundData[room.round] : null;

/* ---------- home ---------- */
function home(){
  $("#stage").innerHTML = `<div class="fadeup" style="margin-top:5vh">    <h1 class="title" style="font-size:clamp(44px,13vw,86px)">Imposter</h1>
    <p class="sub">Everyone gets the same secret word except one. Give a clue, find the fake, and don't give yourself away.</p></div>
    <div style="display:grid;gap:14px;margin-top:26px">
    <form class="panel" id="createForm"><h2>Start a game</h2><div><label for="cName">Your name</label><input type="text" id="cName" maxlength="24" autocomplete="nickname"></div>
      <div class="err" id="cErr"></div><button class="btn primary wide">Create game</button><p class="hint">You'll pick the mode, words and timers in the lobby.</p></form>
    <form class="panel" id="joinForm"><h2>Join a game</h2><div class="row2"><div><label for="jCode">Room code</label><input type="text" id="jCode" maxlength="6" autocomplete="off" style="text-transform:uppercase;letter-spacing:.2em"></div>
      <div><label for="jName">Your name</label><input type="text" id="jName" maxlength="24" autocomplete="nickname"></div></div>
      <div class="err" id="jErr"></div><button class="btn primary wide">Join</button></form></div>`;
  $("#createForm").onsubmit = async e=>{ e.preventDefault(); const n = $("#cName").value.trim(); if(!n){ $("#cErr").textContent="Enter your name."; return; }
    try{ const r = await api("/api/rooms", {game:"imposter", title:"Imposter"}); const m = await api(`/api/rooms/${r.code}/join`, {name:n}); store("imp:"+r.code, {hostKey:r.hostKey, me:m}); openRoom(r.code); }catch(err){ $("#cErr").textContent = err.message; } };
  $("#joinForm").onsubmit = async e=>{ e.preventDefault(); const c = $("#jCode").value.trim().toUpperCase(), n = $("#jName").value.trim();
    if(!c || !n){ $("#jErr").textContent = "Enter the room code and your name."; return; }
    try{ const m = await api(`/api/rooms/${c}/join`, {name:n}); store("imp:"+c, {...(store("imp:"+c)||{}), me:m}); openRoom(c); }catch(err){ $("#jErr").textContent = err.message; } };
}
function openRoom(c){
  code = c; const s = store("imp:"+c) || {}; me = s.me || null; hostKey = s.hostKey || null;
  history.replaceState(null, "", "/imposter?room="+c); $("#hCode").hidden = false; $("#hCode").textContent = c;
  BackGuard.arm();
  poll(++pollGen, -1);
}
async function poll(gen, v){
  while(gen === pollGen){
    try{
      const who = (me ? `&pid=${me.pid}&key=${me.key}` : "") + (hostKey ? `&hk=${hostKey}` : "");
      const r = await fetch(`/api/rooms/${code}?v=${v}${who}`);
      if(r.status === 404){ history.replaceState(null,"","/imposter"); home(); $("#jErr").textContent = "That game doesn't exist anymore."; return; }
      const d = await r.json(); if(gen !== pollGen) return;
      clockOffset = d.now - Date.now()/1000;
      const prev = room; room = d; v = d.version;
      if(me && !room.players[me.pid]){ me = null; if(!room.roomMeta?.isHost) hostKey = null; store("imp:"+code, {hostKey}); toast("You were removed from this game"); }
      if(me) Avatars.apply(act, room.players[me.pid]);  // your saved profile picture
      if(prev && (prev.phase !== room.phase || prev.round !== room.round)){
        if(room.phase === "reveal"){ opened = false; peek = false; window.Juice?.sfx.deal(); }
        if(room.phase === "clues" && room.turnPid === me?.pid){ buzz(120); window.Juice?.sfx.turn(); }
        if(room.phase === "vote") window.Juice?.sfx.pop();
        if(room.phase === "verdict"){ window.Juice?.sfx.boom(); setTimeout(()=>window.Juice?.shake($("#stage"), 7), 180); }
        if(room.phase === "results") window.Juice?.sfx.wild();
        if(room.phase === "final"){ window.Juice?.sfx.win(); setTimeout(()=>window.Juice?.confetti({count:95}), 150); }
        window.scrollTo({top:0, behavior:"smooth"});
      }
      if(prev && prev.turnPid !== room.turnPid && room.turnPid === me?.pid){ buzz([80,60,80]); window.Juice?.sfx.turn(); }
      if(!Chat.socialOnly(prev, room)) render();  // chat and pranks never redraw the clue box you're typing in
      document.body.classList.toggle("has-hostbar", !$("#hostbar").hidden);
      Chat.update(room, me); Pranks.update(room, me); RoomBar.update(room, me, hostKey);
    }catch(e){ await new Promise(r=>setTimeout(r,2000)); }
  }
}

/* ---------- render ---------- */
let lastSig = "";
function render(){
  renderHostbar(); tickTimer();
  if(!me || !room.players[me.pid]) return gate();
  const sig = JSON.stringify([room.phase, room.round, room.players, room.roundData[room.round], room.settings, room.scores, room.turnPid, peek, opened]);
  if(sig === lastSig) return;
  lastSig = sig;
  // a re-render inside the same phase (a vote, a flag) shouldn't replay every entrance animation
  const key = room.phase + ":" + room.round;
  $("#stage").classList.toggle("settled", key === render.key); render.key = key;
  const views = {lobby, starting, reveal, clues, discuss:clues, vote, verdict, guess, results, final};
  (views[room.phase] || lobby)();
}
function gate(){
  if($("#gate")) return;  // already showing: rebuilding it would wipe the name being typed
  $("#stage").innerHTML = `<form class="panel fadeup" id="gate" style="margin-top:8vh"><h2 style="text-align:center">Join this game</h2>
    <input type="text" id="gName" placeholder="Your name" maxlength="24" autocomplete="nickname"><div class="err" id="gErr"></div><button class="btn primary wide">Join</button></form>`;
  $("#gate").onsubmit = async e=>{ e.preventDefault(); const n = $("#gName").value.trim(); if(!n) return;
    try{ me = await api(`/api/rooms/${code}/join`, {name:n}); store("imp:"+code, {me, hostKey}); lastSig=""; poll(++pollGen, -1); }catch(err){ $("#gErr").textContent = err.message; } };
}

/* ---------- roles ---------- */
const ICON = {
  jester:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18 3 7l5 4 4-7 4 7 5-4-1 11z"/><circle cx="3" cy="6" r="1.4"/><circle cx="12" cy="3" r="1.4"/><circle cx="21" cy="6" r="1.4"/><path d="M4 21h16"/></svg>',
  detective:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10" cy="10" r="6"/><path d="m15 15 6 6"/></svg>',
  accomplice:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 10c3-4 7-4 10 0 3-4 7-4 10 0"/><path d="M5 10c0 3 2 5 4 5s3-2 3-4c0 2 1 4 3 4s4-2 4-5"/></svg>',
  lover:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-8-5-8-11a4.5 4.5 0 0 1 8-3 4.5 4.5 0 0 1 8 3c0 6-8 11-8 11z"/></svg>',
  lovers:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-8-5-8-11a4.5 4.5 0 0 1 8-3 4.5 4.5 0 0 1 8 3c0 6-8 11-8 11z"/></svg>',
};
const ROLE = {
  jester:{name:"Jester", c:"#c98bff", min:4, lobby:"Wants to be voted out", txt:"You have the crew's word, but you win by getting voted out. Act a little suspicious. Not too much."},
  detective:{name:"Detective", c:"#6cc4ff", min:5, lobby:"Checks one player in secret", txt:"You're crew. Once the clues are in, you can secretly check one player and learn if they're the imposter."},
  accomplice:{name:"Accomplice", c:"#ff7a7a", min:6, lobby:"Knows the imposter", txt:"You have the crew's word, but you're on the imposter's side. Help them escape. You score if they do."},
  lovers:{name:"Lovers", c:"#ff8fc6", min:6, lobby:"Two crew who know each other", txt:""},
  lover:{name:"Lover", c:"#ff8fc6", txt:""},
};
const nameOf = pid => P(pid) ? esc(P(pid).name) : "someone";
function roleCard(m){
  if(!m.role) return "";
  const R = ROLE[m.role]; let txt = R.txt;
  if(m.role==="accomplice") txt += ` The imposter${(m.partners||[]).length>1?"s are":" is"} <b>${(m.partners||[]).map(nameOf).join(" and ")}</b>.`;
  if(m.role==="lover") txt = `You and <b>${nameOf(m.lover)}</b> are both crew. Trust each other. If you both vote for the imposter, you each get a bonus point.`;
  return `<div class="rolecard" style="--rc:${R.c}"><span class="ri">${ICON[m.role]}</span><div><b>${R.name}</b><p>${txt}</p></div></div>`;
}
function inPlay(r){
  const l = r.rolesInPlay || [];
  return l.length ? `<div class="inplay">${l.map(k=>`<span style="--rc:${ROLE[k].c}">${ROLE[k].name}</span>`).join("")}</div>` : "";
}

/* ---------- lobby ---------- */
const CATS = [["mix","Mix"],["anime","Anime"],["food","Food"],["animals","Animals"],["places","Places"],["objects","Objects"],["movies","Movies and TV"],["jobs","Jobs"],["custom","Custom"]];
function lobby(){
  const s = room.settings, ps = Object.keys(room.players), mine = P(me.pid), H = !!hostKey;
  const sel = (id, opts, val) => `<select id="${id}" ${H?"":"disabled"}>${opts.map(([v,t])=>`<option value="${v}" ${String(v)===String(val)?"selected":""}>${t}</option>`).join("")}</select>`;
  $("#stage").innerHTML = `<div class="fadeup"><h1 class="title">${ps.length} player${ps.length===1?"":"s"}</h1>
    <p class="sub">Share the code <b style="font-family:var(--type);letter-spacing:.2em;color:var(--amber)">${room.code}</b>. You need at least 3 players.</p></div>
    <div class="panel" style="margin-top:16px"><div class="photo-pick"><button class="face" id="photoBtn" type="button" aria-label="Choose your avatar">${Avatars.src(mine)?picOf(mine):"Choose"}</button>
      <div><b>${esc(mine.name)}</b><p class="hint">${Avatars.src(mine) ? "Tap to change your picture." : "Pick an anime character or a photo. It goes on your envelope."}</p></div></div></div>
    <div class="ring">${ps.map(pid=>`<div class="tok fadeup">${face(pid,"face")}<span class="nm">${esc(P(pid).name)}${pid===me.pid?" (you)":""}</span>${H&&pid!==me.pid?`<button class="btn small" data-kick="${pid}" style="padding:2px 10px;font-size:11px">Kick</button>`:""}</div>`).join("")}</div>
    <div class="panel" style="margin-top:18px"><h2>${H ? "Set up the game" : "Game settings"}</h2>
      <div><label>Mode</label><div class="seg">
        <button type="button" class="${s.mode==="undercover"?"on":""}" data-mode="undercover" ${H?"":"disabled"}><b>Undercover</b><small>The imposter gets a similar word and doesn't know they're the imposter</small></button>
        <button type="button" class="${s.mode==="clueless"?"on":""}" data-mode="clueless" ${H?"":"disabled"}><b>Clueless</b><small>The imposter knows, gets no word, only the category</small></button></div></div>
      <div><label>Words about</label><div class="chips">${CATS.map(([v,t])=>`<button type="button" class="${s.category===v?"on":""}" data-cat="${v}" ${H?"":"disabled"}>${t}</button>`).join("")}</div></div>
      ${s.category==="custom" ? `<div><label for="sCustom">Describe the words you want</label><input type="text" id="sCustom" maxlength="200" value="${esc(s.custom)}" ${H?"":"disabled"} placeholder="e.g. Pakistani food, K-pop groups, things in our school"></div>` : ""}
      <div class="row3">
        <div><label for="sRounds">Rounds</label>${sel("sRounds", [1,2,3,4,5,6,8,10].map(n=>[n,n]), s.rounds)}</div>
        <div><label for="sClueRounds">Clues each</label>${sel("sClueRounds", [[1,"1 clue"],[2,"2 clues"],[3,"3 clues"]], s.clueRounds)}</div>
        <div><label for="sImp">Imposters</label>${sel("sImp", [[0,"Auto"],[1,"1"],[2,"2"],[3,"3"]], s.imposters)}</div>
        <div><label for="sClue">Time per clue</label>${sel("sClue", [[20,"20 sec"],[30,"30 sec"],[45,"45 sec"],[60,"1 min"]], s.clueSec)}</div>
        <div><label for="sDiscuss">Discussion</label>${sel("sDiscuss", [[45,"45 sec"],[90,"90 sec"],[120,"2 min"],[180,"3 min"]], s.discussSec)}</div>
        <div><label for="sSpice">AI roast</label>${sel("sSpice", [["wholesome","Wholesome"],["spicy","Spicy"],["unhinged","Unhinged"]], s.spice)}</div>
      </div>
      <div><label>Special roles</label><div class="chips rolechips">${["jester","detective","accomplice","lovers"].map(k=>`<button type="button" class="${(s.roles||[]).includes(k)?"on":""}" data-role="${k}" ${H?"":"disabled"}>${ROLE[k].name}<small>${ROLE[k].lobby} · ${ROLE[k].min}+ players</small></button>`).join("")}</div>
        <p class="hint" style="margin-top:6px">Roles go to random crew members, and only once there are enough players. Not every role shows up every round.</p></div>
      ${H ? `<button class="btn primary wide" data-host="start" ${ps.length<3?"disabled":""}>${ps.length<3?`Waiting for ${3-ps.length} more`:"Hand out the files"}</button>` : `<p class="hint" style="text-align:center">The host starts when everyone is here.</p>`}</div>
    ${HowTo.button("imposter")}`;
  $("#photoBtn").onclick = ()=>Avatars.open(act);
  if(H){
    const send = x => act("settings", x).catch(err=>toast(err.message));
    document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>send({mode:b.dataset.mode}));
    document.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>send({category:b.dataset.cat}));
    document.querySelectorAll("[data-role]").forEach(b=>b.onclick=()=>{ const on = new Set(s.roles||[]); on.has(b.dataset.role) ? on.delete(b.dataset.role) : on.add(b.dataset.role); send({roles:[...on]}); });
    $("#sRounds").onchange=e=>send({rounds:+e.target.value}); $("#sClueRounds").onchange=e=>send({clueRounds:+e.target.value});
    $("#sImp").onchange=e=>send({imposters:+e.target.value}); $("#sClue").onchange=e=>send({clueSec:+e.target.value});
    $("#sDiscuss").onchange=e=>send({discussSec:+e.target.value}); $("#sSpice").onchange=e=>send({spice:e.target.value});
    if($("#sCustom")) $("#sCustom").onchange=e=>send({custom:e.target.value});
  }
}
function starting(){
  $("#stage").innerHTML = `<div class="fadeup" style="margin-top:12vh"><h1 class="title">Sealing the envelopes</h1><div class="thinking"><i></i><i></i><i></i></div><p class="sub">The AI is picking secret words about ${esc(room.categoryLabel)}.</p></div>`;
}

/* ---------- reveal ---------- */
function fileHTML(m, opts={}){
  const p = P(me.pid);
  const inner = m.imposter
    ? `<div class="lbl">Your part</div><div class="word">You are the imposter</div><div class="note">There's no word for you. The category is <b>${esc(room.categoryLabel)}</b>. Listen to the clues, blend in, and work out the word.</div>`
    : `<div class="lbl">The secret word</div><div class="word">${esc(m.word)}</div><div class="note">${room.settings.mode==="undercover" ? "Careful: one of you got a slightly different word, and they don't know it. It might be you." : "One of you has no word at all. Find them."}</div>`;
  return `<div class="file ${opts.open?"open":""} ${m.imposter?"imp":""}" id="file"><div class="paper"><span class="pin" style="background:${hue(p.name)}">${picOf(p)}</span>${inner}</div>
    <div class="cover"><span class="ts"><svg viewBox="0 0 100 100" aria-hidden="true"><path fill="currentColor" d="M14 10l24 22h24l24-22-6 44c-4 18-17 34-30 36-13-2-26-18-30-36z"/><path fill="var(--lantern)" d="M28 50c5-6 12-6 16 0-6 2-11 2-16 0zm28 0c4-6 11-6 16 0-5 2-10 2-16 0zM46 74h8l-4 6z"/><path fill="none" stroke="var(--lantern)" stroke-width="3" d="M50 34v12M38 26l-6-8M62 26l6-8"/></svg></span><span class="agent">${esc(p.name)}</span><span class="tap">Tap to open</span></div></div>`;
}
function reveal(){
  const r = rd(), m = r.mine || {};
  const act_ = r.order.map(pid=>P(pid)), ready = act_.filter(p=>p.ready).length;
  $("#stage").innerHTML = `<div class="fadeup"><div class="eyebrow">Round ${room.round+1} of ${room.settings.rounds}: ${esc(room.categoryLabel)}</div><h1 class="title">Your envelope</h1><p class="sub">Shield your screen, then open it.</p></div>
    <div class="filewrap">${fileHTML(m, {open:opened})}</div>
    <div id="after" ${opened?"":"hidden"} class="fadeup" style="display:grid;gap:10px">
      ${roleCard(m)}${m.role ? "" : inPlay(r)}
      ${P(me.pid).ready ? `<p class="sub">Waiting for everyone · ${ready}/${act_.length} ready</p>` : `<button class="btn primary wide" id="readyBtn">Got it. Close the file</button>`}</div>`;
  $("#file").onclick = ()=>{ opened = !opened; $("#file").classList.toggle("open", opened); if(opened){ buzz(60); $("#after").hidden = false; } };
  if($("#readyBtn")) $("#readyBtn").onclick = ()=>act("ready").catch(err=>toast(err.message));
}

/* ---------- clues and discussion ---------- */
const FLAG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 21V4h11l-2 4 2 4H5"/></svg>';
function slipHTML(c, i, opts={}){
  const rot = ((i*37)%7 - 3) * .8, r = rd();
  const n = (r.flagCount||{})[i] || 0, mineF = (r.myFlags||[]).includes(i);
  const canFlag = opts.flag && ["discuss","vote"].includes(room.phase) && !c.late && c.pid !== me.pid && r.order.includes(me.pid);
  const flag = canFlag ? `<button class="flag ${mineF?"on":""}" data-flag="${i}" title="This hint gave the word away">${FLAG}${n||"Too obvious"}</button>`
    : (opts.flag && n ? `<span class="flag">${FLAG}${n}</span>` : "");
  const role = opts.role ? `<span class="rl" style="--rc:${ROLE[opts.role].c}">${ROLE[opts.role].name}</span>` : "";
  return `<div class="slip ${c.late?"late":""} ${opts.imp?"imp":""} ${opts.flagged?"flagged":""}" style="--r:${rot}deg;animation-delay:${opts.delay||0}s;${canFlag||n?"padding-bottom:30px":""}"><div class="who">${face(c.pid)}${esc(P(c.pid).name)}${role}</div><div class="txt">${esc(c.text)}</div>${flag}</div>`;
}
function detectivePanel(r, m){
  if(m.role !== "detective") return "";
  if(m.peek) return `<div class="panel detective" style="--rc:${ROLE.detective.c}"><b>Your check</b><span><b>${nameOf(m.peek.target)}</b> ${m.peek.imposter ? '<b style="color:var(--red)">is the imposter.</b>' : '<b style="color:var(--green)">is not the imposter.</b>'} Use it wisely: say too much and they'll know who you are.</span></div>`;
  return `<div class="panel detective"><b style="color:${ROLE.detective.c}">Detective: check one player</b><p class="hint">Only you see the answer. You get one check per round.</p>
    <div class="ring">${r.order.filter(p=>p!==me.pid).map(pid=>`<button class="tok pick" data-check="${pid}">${face(pid,"face")}<span class="nm">${esc(P(pid).name)}</span></button>`).join("")}</div></div>`;
}
document.addEventListener("click", e=>{
  const f = e.target.closest("[data-flag]"), c = e.target.closest("[data-check]");
  if(f) act("flag", {i:+f.dataset.flag}).then(()=>buzz(20)).catch(err=>toast(err.message));
  if(c){ if(c.dataset.sure !== "1"){ document.querySelectorAll("[data-check]").forEach(x=>{ x.dataset.sure=""; x.classList.remove("sel"); }); c.dataset.sure = "1"; c.classList.add("sel"); toast(`Tap ${P(c.dataset.check).name} again to check them`); return; }
    act("peek", {target:c.dataset.check}).then(()=>buzz(60)).catch(err=>toast(err.message)); }
});
function clues(){
  const r = rd(), m = r.mine || {}, discuss = room.phase === "discuss";
  const myTurn = !discuss && room.turnPid === me.pid;
  const seq = r.order.flatMap(()=>[]).concat(Array.from({length: room.totalTurns || r.order.length*room.settings.clueRounds}, (_, i)=>r.order[i % r.order.length]));
  const strip = discuss ? "" : `<div class="turns">${seq.map((pid,i)=>`<div class="t ${i<r.turn?"done":""} ${i===r.turn?"now":""}">${face(pid,"face")}<span>${esc(P(pid).name)}</span></div>`).join("")}</div>`;
  const myWord = `<div class="peek"><button id="peekBtn">${peek ? (m.imposter ? "You're the imposter" : `Your word: <b>${esc(m.word)}</b>`) + (m.role ? ` · ${ROLE[m.role].name}` : "") : "Tap to peek at your word"}</button></div>`;
  $("#stage").innerHTML = `<div class="fadeup"><div class="eyebrow">Round ${room.round+1}: ${esc(room.categoryLabel)}</div>
    <h1 class="title">${discuss ? "Who's the fake?" : myTurn ? "Your turn" : `${esc(P(room.turnPid).name)} is thinking`}</h1>
    <p class="sub">${discuss ? "Argue it out. Flag any hint that gave the word away. The vote opens when the timer ends." : myTurn ? "Give one short clue. Don't say the word." : "Clues go up on the board as people give them."}</p>${inPlay(r)}</div>
    ${myWord}${strip}${discuss ? detectivePanel(r, m) : ""}
    ${myTurn ? `<form class="yourturn" id="clueForm"><b>Your clue</b><input type="text" id="clueIn" maxlength="40" autocomplete="off" placeholder="One word or a few"><div class="err" id="clueErr" style="color:var(--red)"></div><button class="btn red">Pin it to the board</button></form>` : ""}
    <div class="board">${r.clues.map((c,i)=>slipHTML(c,i,{flag:discuss})).join("") || '<p class="hint">No clues yet.</p>'}</div>`;
  $("#peekBtn").onclick = ()=>{ peek = !peek; window.Juice?.sfx.flip(); render(); };
  if(myTurn){ $("#clueIn").focus(); $("#clueForm").onsubmit = async e=>{ e.preventDefault(); const t = $("#clueIn").value.trim(); if(!t) return;
    try{ await act("clue", {text:t}); window.Juice?.sfx.pop(); }catch(err){ $("#clueErr").textContent = err.message; } }; }
}

/* ---------- vote ---------- */
function vote(){
  const r = rd(), votes = r.votes || {}, mine = votes[me.pid], inRound = r.order.includes(me.pid);
  const tally = t => Object.entries(votes).filter(([v,x])=>x===t).map(([v])=>v);
  $("#stage").innerHTML = `<div class="fadeup"><div class="eyebrow">Round ${room.round+1}: the vote</div><h1 class="title">Name the imposter</h1>
    <p class="sub">Tap who you think it is. Everyone sees your vote. ${Object.keys(votes).length} of ${r.order.length} voted.</p></div>
    <div class="ring">${r.order.map(pid=>{ const vs = tally(pid), self = pid === me.pid;
      return `<button class="tok ${inRound&&!self?"pick":"off"} ${mine===pid?"sel":""}" data-vote="${pid}" ${inRound&&!self?"":"disabled"}>${face(pid,"face")}<span class="nm">${esc(P(pid).name)}${self?" (you)":""}</span><span class="voters">${vs.map(v=>face(v)).join("")}</span>${vs.length?`<span class="count">${vs.length}</span>`:""}</button>`; }).join("")}</div>
    ${inRound ? `<div style="display:flex;justify-content:center;margin-top:14px"><button class="btn ${mine==="skip"?"primary":""}" data-vote="skip">Skip ${tally("skip").length?`(${tally("skip").length})`:""}</button></div>` : ""}
    ${detectivePanel(r, r.mine||{})}
    <div class="board" style="margin-top:20px">${r.clues.map((c,i)=>slipHTML(c,i,{flag:true})).join("")}</div>`;
  document.querySelectorAll("[data-vote]").forEach(b=>b.onclick=()=>act("vote", {target:b.dataset.vote}).then(()=>{ buzz(40); window.Juice?.sfx.pop(); }).catch(err=>toast(err.message)));
}

/* ---------- verdict and last guess ---------- */
const STAMP = {imposter:["imp","The fox"], crew:["crew","Innocent"], jester:["imp","The Jester"], accomplice:["imp","Accomplice"]};
function accusedFile(pid, caught, role){
  const p = P(pid);
  return `<div class="filewrap" style="position:relative"><div class="file open"><div class="paper"><span class="pin" style="background:${hue(p.name)}">${picOf(p)}</span>
    <div class="lbl">Accused</div><div class="word">${esc(p.name)}</div><div class="note">${(rd().clues.filter(c=>c.pid===pid).map(c=>`"${esc(c.text)}"`).join(", ")) || "No clues on record."}</div></div></div>
    <span class="stamp ${STAMP[role||(caught?"imposter":"crew")][0]}" ${role&&ROLE[role]?`style="color:${ROLE[role].c}"`:""}>${STAMP[role||(caught?"imposter":"crew")][1]}</span></div>`;
}
function verdict(){
  const r = rd();
  $("#stage").innerHTML = r.accused
    ? `<div class="fadeup"><div class="eyebrow">The verdict</div><h1 class="title">${esc(P(r.accused).name)} is…</h1></div>${accusedFile(r.accused, r.caught, r.accusedRole)}
       <p class="sub fadeup" style="animation-delay:1.6s;font-weight:800;color:${r.caught?"var(--fg)":"var(--red)"}">${r.caught ? "Caught. But they get one last guess at the word."
         : r.accusedRole==="jester" ? "The Jester wanted this. Everyone who voted for them got played."
         : r.accusedRole==="accomplice" ? "You caught the accomplice, but the real imposter is still out there."
         : "Wrong person. The real imposter is still out there."}</p>`
    : `<div class="fadeup" style="margin-top:10vh"><div class="eyebrow">The verdict</div><h1 class="title">Nobody was accused</h1><p class="sub">The vote was split. The imposter slips away into the night.</p></div>`;
  if(r.caught) buzz([200,80,200]);
}
function guess(){
  const r = rd(), m = r.mine || {};
  if(m.guessing){
    $("#stage").innerHTML = `<div class="fadeup"><div class="eyebrow">Busted</div><h1 class="title" style="color:var(--red)">You were the imposter</h1>
      <p class="sub">${room.settings.mode==="undercover" ? `Your word was <b>${esc(m.word)}</b>, but the crew had a different one.` : "You had no word."} One guess to steal the round. What was the crew's word?</p></div>
      <form class="yourturn" id="guessForm" style="margin-top:20px"><b>Final answer</b><input type="text" id="guessIn" maxlength="40" autocomplete="off"><button class="btn red">Lock it in</button></form>
      <div class="board">${r.clues.map((c,i)=>slipHTML(c,i)).join("")}</div>`;
    $("#guessIn").focus();
    $("#guessForm").onsubmit = async e=>{ e.preventDefault(); const t = $("#guessIn").value.trim(); if(!t) return; try{ await act("guess", {text:t}); }catch(err){ toast(err.message); } };
  } else {
    $("#stage").innerHTML = `<div class="fadeup" style="margin-top:8vh"><div class="eyebrow">Last chance</div><h1 class="title">The imposter is guessing</h1>
      <p class="sub">${esc(P(r.accused).name)} gets one shot at the crew's word. If they get it, they steal the round.</p><div class="thinking"><i></i><i></i><i></i></div></div>`;
  }
}

/* ---------- round results ---------- */
function results(){
  const r = rd(), imps = r.imposters;
  const roles = r.roles || {}, jest = r.accused && roles[r.accused]==="jester";
  const outcome = r.caught ? (r.guess && r.guess.correct ? "Caught, but stole the word" : "The crew wins this round") : jest ? "The Jester fooled you all" : "The imposter got away";
  const ai = r.ai, flagged = r.flagged || [];
  const sc = scoreRows(r.points, r.why);
  const roleList = Object.entries(roles).map(([pid,k])=>`<span class="tok" style="padding:0;--rc:${ROLE[k].c}">${face(pid,"face")}<span class="nm">${esc(P(pid).name)}</span><span class="tag">${ROLE[k].name}</span></span>`).join("");
  const peeks = Object.entries(r.peeks||{}).map(([d,x])=>`${nameOf(d)} checked ${nameOf(x.target)}`).join(". ");
  $("#stage").innerHTML = `<div class="fadeup"><div class="eyebrow">Round ${room.round+1} of ${room.settings.rounds}</div><h1 class="title">${outcome}</h1></div>
    <div class="duo"><div class="wordcard"><div class="lbl">The crew's word</div><div class="w">${esc(r.word)}</div></div>
      <div class="wordcard imp" style="animation-delay:.25s"><div class="lbl">${room.settings.mode==="undercover"?"The imposter's word":"The imposter had"}</div><div class="w">${room.settings.mode==="undercover"?esc(r.decoy):"No word"}</div></div></div>
    <div class="panel" style="margin-top:14px"><b>The imposter${imps.length>1?"s":""}</b><div style="display:flex;flex-wrap:wrap;gap:12px">${imps.map(pid=>`<span class="tok" style="padding:0">${face(pid,"face")}<span class="nm">${esc(P(pid).name)}</span></span>`).join("")}</div>
      ${r.guess ? `<span>Last guess: <b>"${esc(r.guess.text)}"</b> ${r.guess.correct ? '<b style="color:var(--green)">correct</b>' : '<b style="color:var(--red)">wrong</b>'}</span>` : ""}
      ${roleList ? `<b>Special roles</b><div class="rolelist">${roleList}</div>${peeks ? `<span class="hint">${peeks}.</span>` : ""}` : ""}</div>
    <div class="board">${r.clues.map((c,i)=>slipHTML(c,i,{imp:imps.includes(c.pid), delay:.1*i, role:roles[c.pid], flag:true, flagged:!c.late && flagged.includes(c.pid)})).join("")}</div>
    <div class="chat">${ai && ai.story ? `<div class="msg"><span class="bot">AI</span><div class="bubble">${esc(ai.story)}</div></div>${(ai.lines||[]).map((l,i)=>{ const pid = Object.keys(room.players).find(x=>P(x).name===l.name); return `<div class="msg" style="animation-delay:${.4+i*.35}s">${pid?face(pid):'<span class="bot">?</span>'}<div class="bubble"><b>${esc(l.name)}</b>${esc(l.line)}</div></div>`; }).join("")}`
      : ai && ai.failed ? "" : '<div class="thinking"><i></i><i></i><i></i></div><p class="hint" style="text-align:center">The AI is reading everyone\'s clues…</p>'}</div>
    <h2 style="margin-top:22px;font-size:22px">Scores</h2>${sc}`;
}
function scoreRows(plus, why){
  const rows = Object.keys(room.players).map(pid=>({pid, s: room.scores[pid]||0})).sort((a,b)=>b.s-a.s);
  const delta = n => n>0 ? `<span class="plus">+${n}</span>` : n<0 ? `<span class="minus">${n}</span>` : "<span></span>";
  const reasons = pid => why && why[pid] ? `<span class="why">${why[pid].map(([n,t])=>`${n>0?"+":""}${n} ${esc(t)}`).join(" · ")}</span>` : "";
  return `<div class="scores">${rows.map((x,i)=>`<div class="srow ${i===0&&x.s>0?"first":""}" style="animation-delay:${i*.08}s"><span class="rk">${i+1}</span>${face(x.pid)}<span>${esc(P(x.pid).name)}${reasons(x.pid)}</span>${delta(plus&&plus[x.pid])}<span class="pts">${x.s}</span></div>`).join("")}</div>`;
}
function final(){
  const rows = Object.keys(room.players).map(pid=>({pid, s: room.scores[pid]||0})).sort((a,b)=>b.s-a.s);
  const top = rows[0];
  $("#stage").innerHTML = `<div class="fadeup"><div class="eyebrow">Final scores</div><h1 class="title">${top && top.s>0 ? `${esc(P(top.pid).name)} wins` : "Game over"}</h1>
    ${top ? `<div class="filewrap" style="position:relative"><div class="file open"><div class="paper"><span class="pin" style="background:${hue(P(top.pid).name)}">${picOf(P(top.pid))}</span><div class="lbl">Best mask of the night</div><div class="word">${esc(P(top.pid).name)}</div><div class="note">${top.s} points</div></div></div><span class="stamp crew" style="color:var(--amber)">Winner</span></div>` : ""}</div>
    ${scoreRows(null)}
    <h2 style="margin-top:22px;font-size:22px">Every round</h2>
    <div class="scores">${room.roundData.map((r,i)=>`<div class="srow" style="grid-template-columns:auto 1fr auto"><span class="rk">${i+1}</span><span>${esc(r.word)}${room.settings.mode==="undercover" ? ` <span class="muted">vs</span> ${esc(r.decoy||"")}` : ' <span class="muted">· clueless</span>'}</span><span class="muted" style="font-size:13px">${r.imposters?.map(pid=>esc(P(pid).name)).join(", ")}</span></div>`).join("")}</div>`;
}
$("#hCode").onclick = async ()=>{
  if(!code) return;
  const link = location.origin + "/imposter?room=" + code;
  try{ await navigator.clipboard.writeText(link); toast(`Invite link copied · ${code}`); }
  catch(e){ toast(link); }
};

/* ---------- host controls, timer ---------- */
function renderHostbar(){
  const bar = $("#hostbar"), ph = room?.phase;
  if(!hostKey || !room || !me || !room.players[me.pid]){ bar.hidden = true; return; }
  const b = [];
  if(ph === "reveal") b.push('<button class="btn small" data-host="next">Start the clues now</button>');
  if(ph === "clues") b.push('<button class="btn small" data-host="addtime">+30s</button><button class="btn small" data-host="skip">Skip this turn</button>');
  if(ph === "discuss") b.push('<button class="btn small" data-host="addtime">+30s</button><button class="btn red" data-host="next">Start the vote</button>');
  if(ph === "vote") b.push('<button class="btn small" data-host="addtime">+30s</button><button class="btn small" data-host="skip">Count the votes</button>');
  if(ph === "verdict") b.push('<button class="btn primary" data-host="next">Continue</button>');
  if(ph === "guess") b.push('<button class="btn small" data-host="skip">Skip the guess</button>');
  if(ph === "results") b.push(`<button class="btn primary" data-host="next">${room.round+1 < room.settings.rounds ? "Next round" : "Final scores"}</button>`);
  if(ph === "final") b.push('<button class="btn primary" data-host="playagain">Play again</button>');
  bar.hidden = !b.length; bar.innerHTML = b.join("");
}
document.addEventListener("click", async e=>{
  const h = e.target.closest("[data-host]"), k = e.target.closest("[data-kick]");
  if(h){ try{ await act(h.dataset.host, h.dataset.host==="addtime"?{sec:30}:{}); }catch(err){ toast(err.message); } }
  if(k){ if(k.dataset.sure !== "1"){ k.dataset.sure = "1"; k.textContent = "Sure?"; return; } act("kick", {pid:k.dataset.kick}).catch(err=>toast(err.message)); }
});
function tickTimer(){
  const el = $("#timer");
  if(!room || !room.deadline){ el.hidden = true; return; }
  const left = Math.max(0, Math.ceil(room.deadline - serverNow()));
  el.hidden = false; el.textContent = `${Math.floor(left/60)}:${String(left%60).padStart(2,"0")}`;
  el.classList.toggle("low", left <= 10);
}
setInterval(tickTimer, 250);

const c0 = (new URLSearchParams(location.search).get("room")||"").toUpperCase();
if(c0) openRoom(c0); else home();
</script>
