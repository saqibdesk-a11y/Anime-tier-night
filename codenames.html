<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d14">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Game Night">
<title>Codenames</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=JetBrains+Mono:wght@500;700&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: an agency situation room. Dark graphite with a faint grid, the two teams as neon red and blue.
   The board is the hero: physical-looking word cards that flip into agent tiles. Everything else
   (scores, the clue, your controls) docks around it so a phone shows the whole grid at once. */
:root{
  --bg:#0b0d14; --bg2:#121624; --fg:#eef1fa; --muted:#8b93ad; --line:rgba(238,241,250,.1); --line2:rgba(238,241,250,.2);
  --glass:rgba(18,22,36,.78); --glass2:rgba(255,255,255,.05);
  --red:#ff3d5a; --red2:#b3122f; --redglow:rgba(255,61,90,.45);
  --blue:#3d8bff; --blue2:#1446a8; --blueglow:rgba(61,139,255,.45);
  --card:#efe7d4; --card2:#ddd1b6; --ink:#1d1a14; --neutral:#d9c9a3; --neutral2:#b8a57c;
  --ass:#0a0a0c; --gold:#ffcf4d;
  --display:"Oswald","Arial Narrow",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{min-height:100vh;color:var(--fg);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased;overflow-x:hidden;
  background:radial-gradient(ellipse 80% 50% at 50% -10%,rgba(61,139,255,.12),transparent 60%),
  radial-gradient(ellipse 60% 40% at 100% 100%,rgba(255,61,90,.08),transparent 60%),
  linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px) 0 0/28px 28px,
  linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px) 0 0/28px 28px,var(--bg);background-attachment:fixed}
body.turn-red{background-color:#120b10} body.turn-blue{background-color:#0a0e18}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;letter-spacing:.02em;text-transform:uppercase;text-wrap:balance}
.muted{color:var(--muted)}
.top{position:sticky;top:0;z-index:15;display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) 8px max(14px,env(safe-area-inset-left,0px));background:linear-gradient(180deg,rgba(11,13,20,.96),rgba(11,13,20,.75));backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top a{color:var(--muted);text-decoration:none;font-weight:800;font-size:18px}
.top h1{font-size:18px;letter-spacing:.14em}
.code{font-family:var(--mono);font-size:13px;letter-spacing:.2em;border:1px solid var(--line2);border-radius:6px;padding:2px 8px;color:var(--muted)}
.spacer{flex:1}
.iconbtn{border:1px solid var(--line);background:var(--glass2);border-radius:10px;width:36px;height:36px;display:grid;place-items:center;padding:0}
.iconbtn svg{width:18px;height:18px}
.timer{font-family:var(--mono);font-size:15px;font-variant-numeric:tabular-nums;border-radius:8px;padding:3px 10px;background:var(--glass);border:1px solid var(--line2)}
.timer.low{color:var(--red);border-color:var(--red);animation:beat 1s infinite}
@keyframes beat{50%{transform:scale(1.08)}}
.stage{width:min(980px,100%);margin:0 auto;padding:10px max(10px,env(safe-area-inset-left,0px)) calc(var(--dockh,150px) + 24px) max(10px,env(safe-area-inset-right,0px))}
.eyebrow{text-align:center;font-family:var(--mono);font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
.title{font-size:clamp(30px,8vw,52px);line-height:1;text-align:center;margin-top:4px}
.sub{text-align:center;color:var(--muted);margin:8px auto 0;max-width:54ch}
.panel{background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:14px;backdrop-filter:blur(10px)}
.panel h2{font-size:17px;letter-spacing:.08em}
.btn{border:1px solid var(--line2);background:var(--glass2);border-radius:11px;padding:11px 18px;font-weight:800;transition:transform .12s,background .2s,box-shadow .2s;white-space:nowrap}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#221800}
.btn.red{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 8px 24px -8px var(--redglow)}
.btn.blue{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 8px 24px -8px var(--blueglow)}
.btn.small{padding:6px 12px;font-size:13px;border-radius:9px}
.btn.wide{width:100%}
label{display:block;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
input[type=text],select{width:100%;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:10px;padding:11px 13px;outline:none;color:var(--fg);font-size:16px}
input[type=text]:focus,select:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(255,207,77,.12)}
select option{background:var(--bg2)}
.err{color:#ff8b9b;font-size:14px;min-height:1.2em}
.hint{font-size:13px;color:var(--muted);margin:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chips button{border:1px solid var(--line);background:rgba(0,0,0,.25);border-radius:999px;padding:7px 13px;font-weight:700;font-size:13px}
.chips button.on{border-color:var(--gold);background:rgba(255,207,77,.12);color:var(--gold)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{border:1px solid var(--line);background:rgba(0,0,0,.25);border-radius:12px;padding:10px;text-align:left;display:grid;gap:1px}
.seg button small{color:var(--muted);font-weight:500;line-height:1.3;font-size:12px}
.seg button.on{border-color:var(--gold);background:rgba(255,207,77,.1)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px}
.toggle button{width:52px;height:30px;border-radius:999px;border:1px solid var(--line2);background:rgba(0,0,0,.4);position:relative;flex:none}
.toggle button::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:transform .2s,background .2s}
.toggle button.on{background:rgba(255,207,77,.25);border-color:var(--gold)}
.toggle button.on::after{transform:translateX(22px);background:var(--gold)}
.mini{width:20px;height:20px;border-radius:50%;overflow:hidden;display:inline-grid;place-items:center;font-size:9px;font-weight:900;color:#141824;border:1.5px solid var(--bg);vertical-align:middle;flex:none}
.mini img,.face img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.face{width:44px;height:44px;border-radius:50%;overflow:hidden;display:grid;place-items:center;font-weight:900;color:#141824;flex:none;border:2px solid rgba(255,255,255,.15)}
.toast{position:fixed;left:50%;bottom:calc(170px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;background:var(--fg);color:var(--bg);font-weight:800;border-radius:999px;padding:10px 18px;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:90vw;text-align:center}
.fadeup{animation:fadeup .55s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes fadeup{from{opacity:0;transform:translateY(14px)}}
.dots{display:inline-flex;gap:4px;vertical-align:middle}
.dots i{width:6px;height:6px;border-radius:50%;background:currentColor;animation:blink 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{50%{opacity:.25}}

/* ---------- home and lobby ---------- */
.hero{position:relative;margin:4vh 0 18px;text-align:center}
.hero-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;width:min(330px,84vw);margin:0 auto 18px;transform:perspective(700px) rotateX(28deg)}
.hero-grid i{aspect-ratio:1.5;border-radius:5px;background:var(--card);opacity:.9;animation:herocard 6s infinite;box-shadow:0 6px 14px -6px #000}
.hero-grid i.r{--to:var(--red)} .hero-grid i.b{--to:var(--blue)} .hero-grid i.n{--to:var(--neutral2)} .hero-grid i.a{--to:#111}
@keyframes herocard{0%,35%{background:var(--card);transform:rotateY(0)}45%,85%{background:var(--to);transform:rotateY(180deg)}95%,100%{background:var(--card);transform:rotateY(360deg)}}
.hero h1{font-size:clamp(44px,13vw,84px);letter-spacing:.08em;line-height:.95;background:linear-gradient(90deg,var(--red),#ff9db0 45%,#a9cbff 55%,var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.team{border-radius:16px;padding:12px;display:grid;gap:10px;align-content:start;border:1px solid var(--line);position:relative;overflow:hidden}
.team.red{background:linear-gradient(180deg,rgba(255,61,90,.16),rgba(255,61,90,.03));border-color:rgba(255,61,90,.35)}
.team.blue{background:linear-gradient(180deg,rgba(61,139,255,.16),rgba(61,139,255,.03));border-color:rgba(61,139,255,.35)}
.team h3{font-size:20px;letter-spacing:.12em;display:flex;justify-content:space-between;align-items:baseline}
.team.red h3{color:var(--red)} .team.blue h3{color:var(--blue)}
.team h3 small{font-family:var(--mono);font-size:12px;color:var(--muted)}
.seat{display:flex;align-items:center;gap:8px;border:1px dashed var(--line2);border-radius:12px;padding:7px;background:rgba(0,0,0,.2);text-align:left;width:100%;min-height:56px}
.seat.filled{border-style:solid}
.seat .face{width:38px;height:38px}
.seat b{display:block;font-size:13px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seat small{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:800}
.seat .ai{background:linear-gradient(135deg,#2a3150,#151a2c);color:var(--gold)}
.ops{display:grid;gap:6px}
.op{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;animation:fadeup .4s backwards}
.op .face{width:30px;height:30px;font-size:12px}
.op span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.op .kick{border:0;background:none;color:var(--muted);font-size:11px;padding:2px 4px}
.photo-pick{display:flex;align-items:center;gap:14px}
.photo-pick .face{width:60px;height:60px;border:2px dashed var(--line2);background:rgba(0,0,0,.3);font-size:11px;color:var(--muted);font-weight:700}

/* ---------- scoreboard, clue ---------- */
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin:2px auto 8px;width:min(640px,100%)}
.sc{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:12px;border:1px solid var(--line);background:var(--glass);transition:box-shadow .4s,border-color .4s,transform .4s}
.sc.blue{flex-direction:row-reverse;text-align:right}
.sc .n{font-family:var(--display);font-size:30px;font-weight:700;line-height:1}
.sc.red .n{color:var(--red)} .sc.blue .n{color:var(--blue)}
.sc .lab{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);line-height:1.2}
.sc .pips{display:flex;gap:2px;flex-wrap:wrap;margin-top:3px}
.sc.blue .pips{justify-content:flex-end}
.sc .pips i{width:6px;height:6px;border-radius:2px;background:currentColor;opacity:.9;transition:opacity .4s,transform .4s}
.sc.red .pips{color:var(--red)} .sc.blue .pips{color:var(--blue)}
.sc .pips i.gone{opacity:.15;transform:scale(.7)}
.sc.on.red{border-color:var(--red);box-shadow:0 0 0 1px var(--red),0 0 30px -6px var(--redglow);transform:scale(1.03)}
.sc.on.blue{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue),0 0 30px -6px var(--blueglow);transform:scale(1.03)}
.series{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:center;line-height:1.2}
.series b{font-size:16px;color:var(--fg)}
.cluebar{width:min(640px,100%);margin:0 auto 10px;min-height:58px;border-radius:14px;border:1px solid var(--line);background:var(--glass);display:flex;align-items:center;justify-content:center;gap:12px;padding:8px 14px;text-align:center;transition:border-color .4s,background .4s}
.cluebar.red{border-color:rgba(255,61,90,.5);background:linear-gradient(90deg,rgba(255,61,90,.14),rgba(18,22,36,.8))}
.cluebar.blue{border-color:rgba(61,139,255,.5);background:linear-gradient(90deg,rgba(18,22,36,.8),rgba(61,139,255,.14))}
.cluebar .cw{font-family:var(--display);font-size:clamp(24px,7vw,34px);font-weight:700;letter-spacing:.06em;text-transform:uppercase;line-height:1}
.cluebar .cn{font-family:var(--display);font-size:22px;font-weight:700;border-radius:8px;min-width:34px;height:34px;display:grid;place-items:center;color:#fff}
.cluebar.red .cn{background:var(--red)} .cluebar.blue .cn{background:var(--blue)}
.cluebar .gl{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);line-height:1.3}
.cluebar .wait{font-weight:700;color:var(--muted);display:flex;align-items:center;gap:8px}
.cluebar .wait.red{color:#ff9aab} .cluebar .wait.blue{color:#9cc3ff}
.cluebar .by{display:flex;align-items:center;gap:6px}

/* ---------- the board ---------- */
.board{display:grid;grid-template-columns:repeat(var(--cols,5),minmax(0,1fr));gap:clamp(4px,1.2vw,9px);width:min(640px,100%);margin:0 auto}
.board.pics{width:min(560px,100%)}
.card{position:relative;border:0;padding:0;background:none;aspect-ratio:1.5;perspective:700px;border-radius:8px;font:inherit;color:var(--ink);touch-action:manipulation}
.board.pics .card{aspect-ratio:.78}
.card .inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .75s cubic-bezier(.3,1.35,.45,1)}
.card.revealed .inner{transform:rotateY(180deg)}
.card .f{position:absolute;inset:0;border-radius:8px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.card .front{background:linear-gradient(180deg,var(--card),var(--card2));box-shadow:0 6px 14px -8px #000,inset 0 0 0 1px rgba(0,0,0,.08);display:grid;place-items:center;transition:box-shadow .25s,transform .2s}
.card .front::before{content:"";position:absolute;inset:3px;border-radius:5px;border:1px solid rgba(60,45,20,.18)}
.card .word{position:relative;font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.02em;line-height:1.02;font-size:calc(var(--fs,1) * clamp(9px,2.75vw,16px));padding:0 3px;text-align:center;overflow-wrap:anywhere;z-index:1}
.card .up{position:absolute;top:4px;left:0;right:0;text-align:center;transform:rotate(180deg);font-family:var(--display);font-weight:600;font-size:clamp(6px,1.5vw,9px);text-transform:uppercase;opacity:.28;letter-spacing:.04em;white-space:nowrap;overflow:hidden}
.card .pic{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top}
.board.pics .card .word{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(0deg,rgba(239,231,212,.97),rgba(239,231,212,.86));padding:3px 2px 2px;font-size:calc(var(--fs,1) * clamp(7px,2vw,12px))}
.card .back{transform:rotateY(180deg);display:grid;place-items:center;box-shadow:0 6px 14px -8px #000}
.card .back svg{width:62%;height:62%;filter:drop-shadow(0 3px 4px rgba(0,0,0,.35))}
.card .back .wl{position:absolute;left:0;right:0;bottom:2px;text-align:center;font-family:var(--display);font-weight:600;font-size:clamp(6px,1.6vw,10px);text-transform:uppercase;letter-spacing:.04em;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 3px}
.back.red{background:radial-gradient(circle at 50% 30%,#ff6a80,var(--red) 50%,var(--red2));color:#fff}
.back.blue{background:radial-gradient(circle at 50% 30%,#78adff,var(--blue) 50%,var(--blue2));color:#fff}
.back.neutral{background:radial-gradient(circle at 50% 30%,#f0e2bf,var(--neutral) 50%,var(--neutral2));color:#4b3e22}
.back.assassin{background:radial-gradient(circle at 50% 35%,#3a0d16,var(--ass) 65%);color:#ff3d5a;box-shadow:0 0 0 2px #ff3d5a,0 0 26px -2px rgba(255,61,90,.7)}
/* the spymaster's key, on cards that are still face down */
.card.k-red:not(.revealed) .front{box-shadow:inset 0 0 0 3px var(--red),0 6px 14px -8px #000;background:linear-gradient(180deg,#ffdfe3,#f3b9c2)}
.card.k-blue:not(.revealed) .front{box-shadow:inset 0 0 0 3px var(--blue),0 6px 14px -8px #000;background:linear-gradient(180deg,#dde9ff,#b6cdf5)}
.card.k-neutral:not(.revealed) .front{background:linear-gradient(180deg,#e9dfc8,#cfc0a0)}
.card.k-assassin:not(.revealed) .front{background:linear-gradient(180deg,#2b2b30,#121215);color:#ffd6dc;box-shadow:inset 0 0 0 3px #ff3d5a,0 0 16px -4px rgba(255,61,90,.7)}
.card.k-assassin:not(.revealed) .front::before{border-color:rgba(255,61,90,.4)}
/* on picture cards the photo covers the tint, so the key goes on top as a frame and a glow from below */
.card.k-red{--kc:var(--red);--kt:rgba(255,61,90,.55)} .card.k-blue{--kc:var(--blue);--kt:rgba(61,139,255,.55)}
.card.k-neutral{--kc:#cdbb8f;--kt:rgba(205,187,143,.5)} .card.k-assassin{--kc:#ff3d5a;--kt:rgba(0,0,0,.85)}
.board.pics .card:is(.k-red,.k-blue,.k-neutral,.k-assassin):not(.revealed) .front::after{content:"";position:absolute;inset:0;border-radius:8px;box-shadow:inset 0 0 0 4px var(--kc);background:linear-gradient(0deg,var(--kt),transparent 60%);z-index:1;pointer-events:none}
.board.pics .card.k-assassin:not(.revealed) .front::after{background:linear-gradient(0deg,var(--kt),rgba(0,0,0,.35));content:"☠";display:grid;place-items:center;font-size:clamp(20px,7vw,34px);color:#ff3d5a}
.board.pics .card .word{z-index:2}
.spyview .card.revealed{opacity:.45;filter:saturate(.6)}
.card.late .inner{transition-duration:1s}
.card.late .back{opacity:.6;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
.card.can{cursor:pointer}
.card.can:hover .front{transform:translateY(-2px)}
.card.can:active .front{transform:scale(.96)}
.card.mine .front{box-shadow:0 0 0 3px var(--gold),0 0 22px -2px rgba(255,207,77,.7)}
.card.mine .front::after{content:"TAP TO REVEAL";position:absolute;left:0;right:0;top:2px;font-size:clamp(5px,1.3vw,8px);font-weight:900;letter-spacing:.1em;color:#8a6200;animation:blink 1s infinite;z-index:2;text-align:center}
.card.mine .up{opacity:0}
@media (max-width:600px){.card{aspect-ratio:1.18}.board.pics .card{aspect-ratio:.72}.card .word{font-size:calc(var(--fs,1) * clamp(10px,3.1vw,16px))}}
.card .marks{position:absolute;right:-4px;top:-6px;display:flex;flex-direction:row-reverse;z-index:3}
.card .marks .mini{margin-left:-6px;animation:pin .35s cubic-bezier(.3,1.7,.5,1) backwards;box-shadow:0 2px 6px rgba(0,0,0,.5)}
@keyframes pin{from{transform:translateY(-12px) scale(.3);opacity:0}}
.card.deal{animation:deal .6s cubic-bezier(.2,1.2,.4,1) backwards}
@keyframes deal{from{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--dr)) scale(.3)}}
.card.shake{animation:shake .5s}
@keyframes shake{20%{transform:translateX(-6px) rotate(-2deg)}40%{transform:translateX(5px) rotate(2deg)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.card.glow .back{animation:glow 1.2s ease-out}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(255,255,255,.9)}100%{box-shadow:0 0 0 14px rgba(255,255,255,0)}}
.spark{position:fixed;width:7px;height:7px;border-radius:2px;pointer-events:none;z-index:60;animation:spark .8s cubic-bezier(.1,.8,.3,1) forwards}
@keyframes spark{to{transform:translate(var(--x),var(--y)) rotate(var(--r)) scale(.2);opacity:0}}

/* ---------- full-screen moments ---------- */
.fx{position:fixed;inset:0;z-index:50;pointer-events:none;display:grid;place-items:center}
.sweep{position:fixed;left:0;right:0;top:40%;z-index:55;pointer-events:none;padding:16px 0;text-align:center;transform:translateX(-105%);animation:sweep 1.6s cubic-bezier(.7,0,.3,1) forwards}
.sweep.red{background:linear-gradient(90deg,transparent,var(--red) 15%,var(--red) 85%,transparent)}
.sweep.blue{background:linear-gradient(90deg,transparent,var(--blue) 15%,var(--blue) 85%,transparent)}
.sweep b{display:block;font-family:var(--display);font-size:clamp(30px,10vw,58px);letter-spacing:.14em;text-transform:uppercase;color:#fff;line-height:1}
.sweep small{font-weight:800;letter-spacing:.2em;text-transform:uppercase;font-size:12px;color:rgba(255,255,255,.85)}
@keyframes sweep{0%{transform:translateX(-105%)}30%,70%{transform:translateX(0)}100%{transform:translateX(105%)}}
.cluepop{position:fixed;inset:0;z-index:56;pointer-events:none;display:grid;place-items:center;background:rgba(5,6,10,.55);animation:fadeout 2.1s forwards}
.cluepop .cc{background:linear-gradient(180deg,var(--card),var(--card2));color:var(--ink);border-radius:14px;padding:18px 28px 14px;text-align:center;box-shadow:0 30px 70px -20px #000;animation:slam .55s cubic-bezier(.2,1.6,.4,1) backwards;min-width:220px}
.cluepop .cc.red{box-shadow:0 0 0 4px var(--red),0 30px 70px -20px #000} .cluepop .cc.blue{box-shadow:0 0 0 4px var(--blue),0 30px 70px -20px #000}
.cluepop .k{font-size:11px;font-weight:900;letter-spacing:.2em;text-transform:uppercase;opacity:.6}
.cluepop .w{font-family:var(--display);font-weight:700;font-size:clamp(34px,11vw,64px);text-transform:uppercase;letter-spacing:.04em;line-height:1.05}
.cluepop .n{display:inline-grid;place-items:center;min-width:46px;height:46px;border-radius:10px;color:#fff;font-family:var(--display);font-size:30px;font-weight:700;margin-top:6px;animation:slam .4s .45s cubic-bezier(.2,1.8,.4,1) backwards}
.cluepop .cc.red .n{background:var(--red)} .cluepop .cc.blue .n{background:var(--blue)}
@keyframes slam{from{transform:scale(2.2) rotate(-6deg);opacity:0}}
@keyframes fadeout{0%,80%{opacity:1}100%{opacity:0}}
.flash{position:fixed;inset:0;z-index:45;pointer-events:none;animation:flash .7s ease-out forwards}
@keyframes flash{from{opacity:.45}to{opacity:0}}
.assassin-fx{position:fixed;inset:0;z-index:70;pointer-events:none;display:grid;place-items:center;background:radial-gradient(circle,rgba(60,0,10,.6),#000 75%);animation:fadeout 3.2s forwards}
.assassin-fx b{font-family:var(--display);font-size:clamp(44px,15vw,110px);letter-spacing:.12em;color:var(--red);text-shadow:3px 0 #00e5ff,-3px 0 #ff00aa;animation:glitch .25s steps(2) infinite,slam .5s cubic-bezier(.2,1.6,.4,1) backwards}
.assassin-fx small{display:block;text-align:center;font-weight:800;letter-spacing:.2em;color:#ffb3bf;text-transform:uppercase;font-size:13px;margin-top:8px}
@keyframes glitch{0%{transform:translate(0)}25%{transform:translate(-3px,1px)}50%{transform:translate(2px,-2px)}75%{transform:translate(-1px,2px)}}
body.quake .stage{animation:quake .6s}
@keyframes quake{10%,50%,90%{transform:translate(-8px,4px)}30%,70%{transform:translate(8px,-4px)}}
.confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:58;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--x),110vh) rotate(var(--r))}}

/* ---------- game over ---------- */
.winner{width:min(640px,100%);margin:0 auto 12px;text-align:center;border-radius:18px;padding:16px 14px 14px;position:relative;overflow:hidden;animation:fadeup .6s backwards}
.winner.red{background:linear-gradient(135deg,var(--red2),var(--red));box-shadow:0 20px 50px -20px var(--redglow)}
.winner.blue{background:linear-gradient(135deg,var(--blue2),var(--blue));box-shadow:0 20px 50px -20px var(--blueglow)}
.winner h2{font-size:clamp(30px,9vw,50px);letter-spacing:.1em;color:#fff;line-height:1}
.winner p{margin:6px 0 0;color:rgba(255,255,255,.9);font-weight:700}
.winner::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);transform:translateX(-100%);animation:shine 2.4s 1s infinite}
@keyframes shine{60%,100%{transform:translateX(100%)}}
.awards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;width:min(640px,100%);margin:14px auto 0}
.award{background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:6px;animation:fadeup .5s backwards}
.award .k{font-size:10px;font-weight:900;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.award .v{display:flex;align-items:center;gap:8px;font-weight:800}
.award .d{font-size:12px;color:var(--muted)}

/* ---------- dock (your controls) and sheets ---------- */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));background:linear-gradient(0deg,rgba(11,13,20,.98),rgba(11,13,20,.86));backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.dock .in{width:min(640px,100%);margin:0 auto;display:grid;gap:8px}
.dock .role{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap;font-size:13px;font-weight:700;color:var(--muted)}
.dock .role .tools .btn{padding:5px 10px}
.dock .role b.red{color:var(--red)} .dock .role b.blue{color:var(--blue)}
.dock .row{display:flex;gap:8px;align-items:center}
.dock .row input{flex:1;min-width:0;text-transform:uppercase;font-family:var(--display);font-weight:600;letter-spacing:.06em;font-size:18px;padding:9px 12px}
.nums{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;padding:2px}
.nums button{flex:none;width:36px;height:36px;border-radius:9px;border:1px solid var(--line2);background:rgba(0,0,0,.3);font-family:var(--display);font-weight:700;font-size:17px}
.nums button.on{background:var(--gold);border-color:var(--gold);color:#221800;transform:scale(1.08)}
.tools{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);animation:fadein .2s}
@keyframes fadein{from{opacity:0}}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:78vh;overflow:auto;background:var(--bg2);border-top:1px solid var(--line2);border-radius:20px 20px 0 0;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:up .3s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(100%)}}
.sheet .grab{width:44px;height:5px;border-radius:5px;background:var(--line2);margin:0 auto 12px}
.sheet .in{width:min(640px,100%);margin:0 auto;display:grid;gap:12px}
.log{display:grid;gap:8px}
.le{border-left:3px solid var(--line2);padding:4px 0 4px 10px;display:grid;gap:5px}
.le.red{border-color:var(--red)} .le.blue{border-color:var(--blue)}
.le .cl{display:flex;align-items:center;gap:8px;font-weight:800}
.le .cl .w{font-family:var(--display);font-size:18px;letter-spacing:.05em;text-transform:uppercase}
.le .cl .n{font-family:var(--display);font-size:14px;border-radius:5px;padding:0 6px;color:#fff}
.le.red .cl .n{background:var(--red)} .le.blue .cl .n{background:var(--blue)}
.le .gs{display:flex;flex-wrap:wrap;gap:4px}
.g{font-size:11px;font-weight:800;text-transform:uppercase;border-radius:5px;padding:2px 6px;letter-spacing:.03em}
.g.red{background:var(--red);color:#fff} .g.blue{background:var(--blue);color:#fff} .g.neutral{background:var(--neutral);color:#4b3e22} .g.assassin{background:#000;color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
.le .plan{font-size:12px;color:var(--gold)}
.le .end{font-size:11px;color:var(--muted);font-weight:700}
@media (min-width:1000px){
  .stage.withside{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:18px;align-items:start}
  .stage > .main{grid-column:1} .stage > .side{grid-column:2;position:sticky;top:70px}
}
@media (max-width:999px){ .stage > .side{display:none} }
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="agent" viewBox="0 0 100 100"><path fill="currentColor" d="M27 38c2-12 11-20 23-20s21 8 23 20l9 2c2 .5 2 3 0 3.5-9 2.5-21 3.5-32 3.5S27 46 18 43.5c-2-.5-2-3 0-3.5zM34 50c3 8 9 13 16 13s13-5 16-13c-5 1-11 1.5-16 1.5S39 51 34 50zM20 96c2-16 12-27 24-30l6 8 6-8c12 3 22 14 24 30z"/><path fill="rgba(0,0,0,.35)" d="M30 44h40v4H30z"/></symbol>
    <symbol id="civ" viewBox="0 0 100 100"><circle cx="50" cy="36" r="15" fill="currentColor"/><path fill="currentColor" d="M22 94c2-18 13-30 28-30s26 12 28 30z"/></symbol>
    <symbol id="skull" viewBox="0 0 100 100"><path fill="currentColor" d="M50 12c-20 0-34 14-34 32 0 11 5 19 12 24v12c0 3 2 5 5 5h4v-7h6v7h14v-7h6v7h4c3 0 5-2 5-5V68c7-5 12-13 12-24 0-18-14-32-34-32zM36 40a9 9 0 110 18 9 9 0 010-18zm28 0a9 9 0 110 18 9 9 0 010-18zM50 58l6 10H44z"/><circle cx="50" cy="50" r="46" fill="none" stroke="currentColor" stroke-width="3" stroke-dasharray="6 6" opacity=".6"/></symbol>
    <symbol id="bot" viewBox="0 0 24 24"><rect x="4" y="7" width="16" height="12" rx="4" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="9" cy="13" r="1.6" fill="currentColor"/><circle cx="15" cy="13" r="1.6" fill="currentColor"/><path d="M12 3v4M8 22h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  </defs>
</svg>
<header class="top">
  <a href="/" aria-label="All games">&larr;</a>
  <h1>Codenames</h1>
  <span class="code" id="hCode" hidden></span>
  <span class="spacer"></span>
  <span class="timer" id="timer" hidden></span>
  <button class="iconbtn" id="soundBtn" aria-label="Sound" title="Sound"></button>
</header>
<main class="stage" id="stage"></main>
<div class="dock" id="dock" hidden></div>
<div id="sheetHost"></div>
<div class="toast" id="toast" hidden></div>

<script src="/avatars.js"></script>
<script src="/backguard.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hue = n => { let h=0; for(const c of String(n)) h=(h*31+c.charCodeAt(0))%360; return `hsl(${h} 70% 72%)`; };
function store(k, v){ try{ if(v===undefined) return JSON.parse(localStorage.getItem(k)); localStorage.setItem(k, JSON.stringify(v)); }catch(e){ return null; } }
function toast(m){ const t=$("#toast"); t.textContent=m; t.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>t.hidden=true,2600); }
const buzz = p => { try{ if(navigator.vibrate && navigator.userActivation?.hasBeenActive) navigator.vibrate(p); }catch(e){} };
async function api(path, body){
  const r = await fetch(path, body ? {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)} : {});
  const j = await r.json().catch(()=>({error:"The server didn't answer. Try again."}));
  if(!r.ok) throw new Error(j.error || "Something went wrong");
  return j;
}

let code=null, room=null, me=null, hostKey=null, pollGen=0, clockOffset=0, sheet=null;
let clueN = 1;
const serverNow = () => Date.now()/1000 + clockOffset;
const act = (a, extra={}) => api(`/api/rooms/${code}/${a}`, {hostKey, ...(me||{}), ...extra});
const P = pid => room.players[pid] || {name:"Someone who left"};
const picOf = p => { const src = Avatars.src(p); return src ? `<img src="${esc(src)}" alt="" referrerpolicy="no-referrer">` : esc((p.name||"?")[0].toUpperCase()); };
const face = (pid, cls="mini") => { const p = P(pid); return `<span class="${cls}" style="background:${hue(p.name)}">${picOf(p)}</span>`; };
const botFace = (cls="face") => `<span class="${cls} ai" style="background:linear-gradient(135deg,#2a3150,#151a2c);color:var(--gold)"><svg width="60%" height="60%"><use href="#bot"/></svg></span>`;
const TEAM = {red:"Red", blue:"Blue"};
const other = t => t === "red" ? "blue" : "red";
const mine = () => room && me && room.players[me.pid];
const isSpy = () => mine()?.role === "spy";
const myTeam = () => mine()?.team;
const spyName = t => { const s = room.spymasters?.[t]; return s === "ai" ? "the AI" : s ? P(s).name : "nobody"; };

/* ---------- sound: tiny synth blips (the speaker button in the header mutes them) ---------- */
let soundOn = store("cn:sound") ?? true, actx = null;
function tone(freq, dur=.12, type="sine", vol=.08, slide=0, delay=0){
  if(!soundOn) return;
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t0 = actx.currentTime + delay, o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0); if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq*slide), t0+dur);
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(.0001, t0+dur);
    o.connect(g); g.connect(actx.destination); o.start(t0); o.stop(t0+dur+.02);
  }catch(e){}
}
const SFX = {
  tap: ()=>tone(660,.05,"triangle",.05),
  right: ()=>{ tone(660,.12,"triangle"); tone(990,.18,"triangle",.07,0,.08); },
  wrong: ()=>tone(180,.3,"sawtooth",.05,.5),
  neutral: ()=>tone(330,.18,"sine",.06,.8),
  assassin: ()=>{ tone(90,.9,"sawtooth",.12,.3); tone(60,1.2,"square",.05,.5,.1); },
  clue: ()=>{ tone(440,.08,"square",.04); tone(587,.1,"square",.04,0,.08); },
  turn: ()=>tone(392,.2,"triangle",.05,1.5),
  win: ()=>[523,659,784,1047].forEach((f,i)=>tone(f,.25,"triangle",.07,0,i*.12)),
};
function soundIcon(){ $("#soundBtn").innerHTML = soundOn
  ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 010 6M18.5 6.5a8 8 0 010 11"/></svg>'
  : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>'; }
$("#soundBtn").onclick = ()=>{ soundOn = !soundOn; store("cn:sound", soundOn); soundIcon(); if(soundOn) SFX.tap(); };
soundIcon();

/* ---------- home ---------- */
function heroGrid(){
  const k = ["r","b","n","r","b","n","a","r","b","n","b","r","n","b","r","n","r","b","n","b","r","n","b","r","n"];
  return `<div class="hero-grid">${k.map((x,i)=>`<i class="${x}" style="animation-delay:${(i%5)*.18 + Math.floor(i/5)*.3}s"></i>`).join("")}</div>`;
}
function home(){
  $("#dock").hidden = true;
  $("#stage").innerHTML = `<div class="main"><div class="hero fadeup">${heroGrid()}<div class="eyebrow">Two teams · one grid · zero chill</div><h1>Codenames</h1>
    <p class="sub">Your spymaster knows which words are your agents. They get one word and a number to point you at them. Find all of yours first, and never touch the assassin.</p></div>
    <div style="display:grid;gap:14px;max-width:520px;margin:0 auto">
    <form class="panel" id="createForm"><h2>Start an operation</h2><div><label for="cName">Your name</label><input type="text" id="cName" maxlength="24" autocomplete="nickname"></div>
      <div class="err" id="cErr"></div><button class="btn primary wide">Create game</button><p class="hint">Teams, word packs, timers and the AI spymaster are set in the lobby.</p></form>
    <form class="panel" id="joinForm"><h2>Join an operation</h2><div class="row2"><div><label for="jCode">Room code</label><input type="text" id="jCode" maxlength="6" autocomplete="off" style="text-transform:uppercase;letter-spacing:.2em"></div>
      <div><label for="jName">Your name</label><input type="text" id="jName" maxlength="24" autocomplete="nickname"></div></div>
      <div class="err" id="jErr"></div><button class="btn primary wide">Join</button></form></div></div>`;
  $("#createForm").onsubmit = async e=>{ e.preventDefault(); const n = $("#cName").value.trim(); if(!n){ $("#cErr").textContent="Enter your name."; return; }
    try{ const r = await api("/api/rooms", {game:"codenames", title:"Codenames"}); const m = await api(`/api/rooms/${r.code}/join`, {name:n}); store("cn:"+r.code, {hostKey:r.hostKey, me:m}); openRoom(r.code); }catch(err){ $("#cErr").textContent = err.message; } };
  $("#joinForm").onsubmit = async e=>{ e.preventDefault(); const c = $("#jCode").value.trim().toUpperCase(), n = $("#jName").value.trim();
    if(!c || !n){ $("#jErr").textContent = "Enter the room code and your name."; return; }
    try{ const m = await api(`/api/rooms/${c}/join`, {name:n}); store("cn:"+c, {...(store("cn:"+c)||{}), me:m}); openRoom(c); }catch(err){ $("#jErr").textContent = err.message; } };
}
function openRoom(c){
  code = c; const s = store("cn:"+c) || {}; me = s.me || null; hostKey = s.hostKey || null;
  history.replaceState(null, "", "/codenames?room="+c); $("#hCode").hidden = false; $("#hCode").textContent = c;
  BackGuard.arm();
  poll(++pollGen, -1);
}
BackGuard.onBack(()=>{ if(sheet){ closeSheet(); return true; } return false; });

/* ---------- sync ---------- */
let prev = null;
async function poll(gen, v){
  while(gen === pollGen){
    try{
      const who = me ? `&pid=${me.pid}&key=${me.key}` : "";
      const r = await fetch(`/api/rooms/${code}?v=${v}${who}`);
      if(r.status === 404){ history.replaceState(null,"","/codenames"); home(); $("#jErr").textContent = "That game doesn't exist anymore."; return; }
      const d = await r.json(); if(gen !== pollGen) return;
      clockOffset = d.now - Date.now()/1000;
      prev = room; room = d; v = d.version;
      if(me && !room.players[me.pid]){ me = null; store("cn:"+code, {hostKey}); toast("You were removed from this game"); }
      render();
      moments();
    }catch(e){ console.error(e); await new Promise(r=>setTimeout(r,2000)); }
  }
}

/* ---------- render ---------- */
let view = null, lobbySig = "";
function render(){
  tickTimer();
  $("#stage").classList.toggle("withside", room.phase !== "lobby" && room.phase !== "starting" && !!mine());
  if(!mine()) return gate();
  const ph = room.phase;
  document.body.classList.toggle("turn-red", ["clue","guess"].includes(ph) && room.turn === "red");
  document.body.classList.toggle("turn-blue", ["clue","guess"].includes(ph) && room.turn === "blue");
  if(ph === "lobby") return lobby();
  if(ph === "starting") return starting();
  game();
  if(sheet) renderSheet();
}
function gate(){
  view = "gate"; $("#dock").hidden = true;
  $("#stage").innerHTML = `<div class="main"><form class="panel fadeup" id="gate" style="margin:8vh auto 0;max-width:420px"><div class="eyebrow">You've been recruited</div><h2 style="text-align:center">Join this operation</h2>
    <input type="text" id="gName" placeholder="Your name" maxlength="24" autocomplete="nickname"><div class="err" id="gErr"></div><button class="btn primary wide">Join</button></form></div>`;
  $("#gate").onsubmit = async e=>{ e.preventDefault(); const n = $("#gName").value.trim(); if(!n) return;
    try{ me = await api(`/api/rooms/${code}/join`, {name:n}); store("cn:"+code, {me, hostKey}); lobbySig = ""; poll(++pollGen, -1); }catch(err){ $("#gErr").textContent = err.message; } };
}

/* ---------- lobby ---------- */
function seatHTML(t){
  const s = room.spymasters?.[t], human = s && s !== "ai";
  const mineSeat = human && s === me.pid;
  return `<button type="button" class="seat ${s?"filled":""}" data-seat="${t}">${human ? face(s,"face") : s === "ai" ? botFace() : `<span class="face" style="border-style:dashed">?</span>`}
    <span style="min-width:0"><small>Spymaster</small><b>${human ? esc(P(s).name) + (mineSeat?" (you)":"") : s === "ai" ? "AI spymaster" : "Empty seat"}</b>
    <small style="letter-spacing:.04em;text-transform:none;font-weight:600">${mineSeat ? "Tap to step down" : human ? "" : "Tap to take it"}</small></span></button>`;
}
function teamHTML(t){
  const ops = Object.keys(room.players).filter(pid=>P(pid).team===t && P(pid).role!=="spy");
  const inIt = myTeam() === t;
  return `<div class="team ${t}"><h3>${TEAM[t]} <small>${room.wins?.[t]||0} win${room.wins?.[t]===1?"":"s"}</small></h3>${seatHTML(t)}
    <div class="ops">${ops.map(pid=>`<div class="op">${face(pid,"face")}<span>${esc(P(pid).name)}${pid===me.pid?" (you)":""}</span>${hostKey&&pid!==me.pid?`<button class="kick" data-kick="${pid}">Kick</button>`:""}</div>`).join("") || '<p class="hint">No guessers yet</p>'}</div>
    ${inIt && !isSpy() ? "" : `<button type="button" class="btn small ${t}" data-join="${t}">${inIt ? "Be a guesser" : `Join ${TEAM[t]}`}</button>`}</div>`;
}
const TIMERS = [[0,"No timer"],[60,"1 min"],[90,"90 sec"],[120,"2 min"],[180,"3 min"]];
function lobby(){
  const sig = JSON.stringify([room.phase, room.players, room.settings, room.spymasters, room.wins]);
  $("#dock").hidden = true; document.documentElement.style.removeProperty("--dockh");
  if(view === "lobby" && sig === lobbySig) return;
  view = "lobby"; lobbySig = sig;
  const s = room.settings, H = !!hostKey, my = mine();
  const sel = (id, opts, val) => `<select id="${id}" ${H?"":"disabled"}>${opts.map(([v,t])=>`<option value="${v}" ${String(v)===String(val)?"selected":""}>${t}</option>`).join("")}</select>`;
  const packs = Object.entries(room.packs || {});
  const n = Object.keys(room.players).length;
  $("#stage").innerHTML = `<div class="main" style="max-width:640px;margin:0 auto;width:100%"><div class="fadeup"><div class="eyebrow">Mission briefing · code <b style="color:var(--gold)">${room.code}</b></div><h1 class="title">Pick your sides</h1>
    <p class="sub">Each team needs at least one guesser. ${room.aiReady && s.aiSpy ? "An empty spymaster seat is taken by the AI, so even two of you can play." : "Each team needs a spymaster."}</p></div>
    <div class="panel" style="margin-top:14px"><div class="photo-pick"><button class="face" id="photoBtn" type="button" aria-label="Choose your avatar">${Avatars.src(my)?picOf(my):"Choose"}</button>
      <div><b>Agent ${esc(my.name)}</b><p class="hint">${Avatars.src(my) ? "Tap to change your avatar." : "Pick an anime character or a picture from your gallery. It shows when you mark cards."}</p></div></div></div>
    <div class="teams">${teamHTML("red")}${teamHTML("blue")}</div>
    ${H ? `<div class="tools" style="margin-top:10px"><button class="btn small" data-host="shuffle">Shuffle teams</button><button class="btn small" data-shuffle-spies="1">Shuffle with spymasters</button></div>` : ""}
    <div class="panel" style="margin-top:14px"><h2>${H ? "Mission settings" : "Mission settings (the host picks)"}</h2>
      <div><label>Words</label><div class="chips">${packs.map(([v,t])=>`<button type="button" class="${s.pack===v?"on":""}" data-pack="${v}" ${H?"":"disabled"}>${esc(t)}</button>`).join("")}</div></div>
      ${s.pack==="custom" ? `<div><label for="sCustom">Words about</label><input type="text" id="sCustom" maxlength="200" value="${esc(s.custom)}" ${H?"":"disabled"} placeholder="e.g. Marvel, football, our school, Pakistan"><p class="hint" style="margin-top:6px">The AI makes a fresh board on this topic every game.</p></div>` : ""}
      ${s.pack==="pictures" ? `<p class="hint">The cards are anime characters with their pictures. Clues can be about their show, powers, looks or vibe.</p>` : ""}
      <div><label>Board</label><div class="seg">
        <button type="button" class="${s.size===25?"on":""}" data-size="25" ${H?"":"disabled"}><b>5 × 5 classic</b><small>9 vs 8 agents</small></button>
        <button type="button" class="${s.size===16?"on":""}" data-size="16" ${H?"":"disabled"}><b>4 × 4 quick</b><small>6 vs 5 agents, faster games</small></button></div></div>
      <div><label>Assassins</label><div class="seg">
        <button type="button" class="${s.assassins===1?"on":""}" data-ass="1" ${H?"":"disabled"}><b>One</b><small>The classic rule</small></button>
        <button type="button" class="${s.assassins===2?"on":""}" data-ass="2" ${H?"":"disabled"}><b>Two</b><small>Hard mode. Every clue is a risk</small></button></div></div>
      <div class="row2"><div><label for="sClue">Spymaster timer</label>${sel("sClue", TIMERS, s.clueSec)}</div><div><label for="sGuess">Guessing timer</label>${sel("sGuess", TIMERS, s.guessSec)}</div></div>
      <div class="toggle"><div><b>AI spymaster</b><p class="hint">${room.aiReady ? "Fills any empty spymaster seat. It's sneaky." : "Not available: no AI key on this server."}</p></div><button type="button" id="aiSpy" class="${s.aiSpy&&room.aiReady?"on":""}" ${H&&room.aiReady?"":"disabled"} aria-label="AI spymaster"></button></div>
      ${H ? `<button class="btn primary wide" data-host="start" ${n<2?"disabled":""}>${n<2 ? "Waiting for one more agent" : "Deal the board"}</button>` : `<p class="hint" style="text-align:center">The host deals when everyone's in.</p>`}</div>
    <details class="panel" style="margin-top:14px"><summary style="font-weight:800;cursor:pointer">How to play</summary><p class="hint" style="margin-top:8px">
      Each team has a <b>spymaster</b> who sees the secret key: which cards are red agents, blue agents, innocent bystanders, and the <b>assassin</b>.<br><br>
      On your turn the spymaster gives <b>one word and a number</b>, like <i>OCEAN 2</i>, meaning "two of our cards connect to ocean". The clue can't be a word on the board.<br><br>
      Guessers tap a card to <b>mark</b> it (your team sees your marks), then tap it again to <b>reveal</b>. Your agent: keep going, up to the number plus one. A bystander or the other team's agent ends your turn. The assassin loses the game on the spot.<br><br>
      A <b>0</b> or <b>∞</b> clue means guess as many as you like. First team to find all its agents wins.</p></details></div>`;
  $("#photoBtn").onclick = ()=>Avatars.open(act);
  if(H){
    const send = x => act("settings", x).catch(err=>toast(err.message));
    document.querySelectorAll("[data-pack]").forEach(b=>b.onclick=()=>send({pack:b.dataset.pack}));
    document.querySelectorAll("[data-size]").forEach(b=>b.onclick=()=>send({size:+b.dataset.size}));
    document.querySelectorAll("[data-ass]").forEach(b=>b.onclick=()=>send({assassins:+b.dataset.ass}));
    $("#sClue").onchange = e=>send({clueSec:+e.target.value}); $("#sGuess").onchange = e=>send({guessSec:+e.target.value});
    $("#aiSpy").onclick = ()=>send({aiSpy:!s.aiSpy});
    if($("#sCustom")) $("#sCustom").onchange = e=>send({custom:e.target.value});
  }
}
function starting(){
  $("#dock").hidden = true;
  if(view === "starting") return;
  view = "starting";
  const s = room.settings;
  $("#stage").innerHTML = `<div class="main"><div class="hero fadeup" style="margin-top:12vh">${heroGrid()}<div class="eyebrow">Stand by</div><h1 style="font-size:clamp(30px,8vw,48px)">Dealing the board</h1>
    <p class="sub">${s.pack==="custom" ? `The AI is writing words about ${esc(s.custom||"anything")}…` : s.pack==="pictures" ? "Recruiting anime characters…" : "Shuffling the codenames…"}</p></div></div>`;
}

/* ---------- the game ---------- */
let boardDeal = null;
function fsFor(w){ const n = w.length; return n <= 5 ? 1 : n <= 7 ? .9 : n <= 9 ? .78 : n <= 11 ? .68 : n <= 14 ? .58 : .5; }
function backHTML(c){
  const k = c.key || "neutral";
  const icon = k === "assassin" ? "skull" : k === "neutral" ? "civ" : "agent";
  return `<div class="f back ${k}"><svg><use href="#${icon}"/></svg><span class="wl">${esc(c.w)}</span></div>`;
}
function game(){
  const ph = room.phase, pics = room.settings.pack === "pictures" && room.cards.some(c=>c.img);
  if(view !== "game" || boardDeal !== room.dealId){
    view = "game"; boardDeal = room.dealId;
    $("#stage").innerHTML = `<div class="main"><div class="score" id="score"></div><div id="banner"></div><div class="cluebar" id="cluebar"></div>
      <div class="board ${pics?"pics":""}" id="board" style="--cols:${room.cards.length===16?4:5}">${room.cards.map((c,i)=>{
        const dx = (Math.random()*2-1)*120 + "px", dy = (220 + Math.random()*120) + "px", dr = (Math.random()*60-30) + "deg";
        return `<button class="card deal" data-i="${i}" style="--fs:${fsFor(c.w)};--dx:${dx};--dy:${dy};--dr:${dr};animation-delay:${i*35}ms" aria-label="${esc(c.w)}">
          <div class="inner"><div class="f front">${c.img?`<img class="pic" src="${esc(c.img)}" alt="" referrerpolicy="no-referrer" loading="lazy">`:`<span class="up">${esc(c.w)}</span>`}<span class="word">${esc(c.w)}</span></div>${backHTML(c)}</div><span class="marks"></span></button>`; }).join("")}</div>
      <div id="awards"></div></div><aside class="side panel" id="sideLog"></aside>`;
    $("#board").onclick = onCard;
    setTimeout(()=>document.querySelectorAll(".card.deal").forEach(c=>c.classList.remove("deal")), 1600);
    if(!prev || prev.dealId !== room.dealId) SFX.turn();
  }
  renderScore(); renderClue(); updateBoard(); renderDock(); renderOver();
  const side = $("#sideLog"); if(side) side.innerHTML = `<h2>Mission log</h2>${logHTML()}`;
}
function renderScore(){
  const pip = t => Array.from({length: room.total[t]}, (_, i)=>`<i class="${i >= room.left[t] ? "gone" : ""}"></i>`).join("");
  const on = t => ["clue","guess"].includes(room.phase) && room.turn === t ? "on" : "";
  $("#score").innerHTML = ["red","blue"].map((t, k)=>`${k ? `<div class="series">series<br><b>${room.wins.red}–${room.wins.blue}</b></div>` : ""}<div class="sc ${t} ${on(t)}"><span class="n">${room.left[t]}</span><span><span class="lab">${TEAM[t]} · ${spyName(t) === "the AI" ? "AI spy" : esc(spyName(t))}</span><span class="pips">${pip(t)}</span></span></div>`).join("");
}
function renderClue(){
  const el = $("#cluebar"), ph = room.phase, t = room.turn, c = room.clue;
  el.className = "cluebar " + (["clue","guess"].includes(ph) ? t : "");
  if(ph === "guess" && c){
    const unlimited = c.n === 0 || c.n === 10;
    const leftG = unlimited ? "Unlimited guesses" : `${Math.max(0, c.n + 1 - c.guesses)} guess${c.n + 1 - c.guesses === 1 ? "" : "es"} left`;
    el.innerHTML = `<span class="cw">${esc(c.word)}</span><span class="cn">${c.n === 10 ? "∞" : c.n}</span><span class="gl">${leftG}<br>${c.by === "ai" ? "AI spymaster" : esc(P(c.by).name)}</span>`;
  } else if(ph === "clue"){
    const ai = room.spymasters[t] === "ai";
    el.innerHTML = room.aiNote && room.aiFailed === t
      ? `<span class="wait ${t}">${esc(room.aiNote)}</span>`
      : `<span class="wait ${t}">${ai ? `<svg width="20" height="20"><use href="#bot"/></svg>` : room.spymasters[t] ? face(room.spymasters[t]) : ""}${TEAM[t]} ${ai ? "AI spymaster is plotting" : `spymaster ${esc(spyName(t))} is thinking`} <span class="dots"><i></i><i></i><i></i></span></span>`;
  }
  el.hidden = ph === "over";  // the winner banner takes its place
}
function updateBoard(){
  const ph = room.phase, my = mine(), spy = isSpy() && my.team;
  const canGuess = ph === "guess" && my.team === room.turn && my.role === "op";
  $("#board").classList.toggle("spyview", !!spy && ph !== "over");
  room.cards.forEach((c, i)=>{
    const el = document.querySelector(`.card[data-i="${i}"]`); if(!el) return;
    const back = el.querySelector(".back");
    if(c.key && !back.classList.contains(c.key)){ back.outerHTML = backHTML(c); }
    const showRev = c.revealed || ph === "over";
    if(ph === "over" && !c.revealed && !el.classList.contains("revealed")){
      el.classList.add("late"); setTimeout(()=>el.classList.add("revealed"), 700 + i*55);
    } else if(!(ph === "over" && el.classList.contains("late"))) el.classList.toggle("revealed", showRev);
    for(const k of ["red","blue","neutral","assassin"]) el.classList.toggle("k-"+k, !c.revealed && c.key === k);
    const marks = (room.marks || {})[i] || [];
    el.classList.toggle("can", canGuess && !c.revealed);
    el.classList.toggle("mine", canGuess && !c.revealed && marks.includes(me.pid));
    el.disabled = !(canGuess && !c.revealed);
    const ms = marks.join(",");
    const box = el.querySelector(".marks");
    if(box.dataset.m !== ms){ box.dataset.m = ms; box.innerHTML = marks.map(pid=>face(pid)).join(""); }
  });
}
async function onCard(e){
  const el = e.target.closest(".card.can"); if(!el) return;
  const i = +el.dataset.i, marks = (room.marks || {})[i] || [];
  if(marks.includes(me.pid)){
    el.classList.remove("mine"); el.classList.add("revealing");
    try{ await act("reveal", {i}); }catch(err){ toast(err.message); }
  } else {
    SFX.tap(); buzz(15);
    // show my mark right away; the server confirms on the next update
    room.marks = {...(room.marks||{}), [i]: [...marks, me.pid]}; updateBoard();
    try{ await act("mark", {i}); }catch(err){ toast(err.message); }
  }
}

/* ---------- your controls ---------- */
let dockSig = "";
function renderDock(){
  const d = $("#dock"), ph = room.phase, my = mine(), t = my.team, myTurn = room.turn === t;
  d.hidden = false;
  const H = !!hostKey;
  let body = "", mode = "";
  const roleLine = `<div class="role"><span>${my.role === "spy" ? "Spymaster" : "Guesser"} · <b class="${t}">${TEAM[t]} team</b></span><span class="tools"><button class="btn small" data-sheet="log">Log</button><button class="btn small" data-sheet="teams">Teams</button>${H?'<button class="btn small" data-sheet="host">Host</button>':""}</span></div>`;
  if(ph === "clue" && myTurn && my.role === "spy"){
    mode = "clue";
    body = `<form class="row" id="clueForm"><input type="text" id="clueIn" maxlength="30" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="One-word clue" enterkeyhint="send"><button class="btn ${t}">Send</button></form>
      <div class="nums">${[1,2,3,4,5,6,7,8,9,0,10].map(n=>`<button type="button" data-n="${n}" class="${n===clueN?"on":""}">${n===10?"∞":n}</button>`).join("")}</div>
      <p class="hint" id="clueHint">You have ${room.left[t]} agent${room.left[t]===1?"":"s"} left. The number is how many cards your clue points at.</p>`;
  } else if(ph === "guess" && myTurn && my.role === "op"){
    mode = "guess";
    body = `<div class="row"><p class="hint" style="flex:1">Tap a card to mark it for your team. Tap your marked card again to reveal it.</p><button class="btn small" id="endTurn" ${room.clue?.guesses ? "" : "disabled"}>End turn</button></div>`;
  } else if(ph === "over"){
    mode = "over";
    body = H ? `<div class="row" style="flex-wrap:wrap;justify-content:center"><button class="btn primary" data-again="rotate">Play again · new spymasters</button><button class="btn small" data-again="same">Same roles</button><button class="btn small" data-host="tolobby">Lobby</button></div>`
      : `<p class="hint" style="text-align:center">The host starts the next game.</p>`;
  } else {
    mode = "wait:" + ph + room.turn + my.role;
    const txt = ph === "clue" ? (myTurn ? `Your spymaster is thinking. Study the board.` : `${TEAM[room.turn]} is getting a clue. Plan your next move.`)
      : ph === "guess" ? (myTurn ? (my.role === "spy" ? "Your team is guessing. Keep a straight face." : "") : `${TEAM[room.turn]} is guessing. Watch them sweat.`) : "";
    body = `<p class="hint" style="text-align:center">${txt}</p>`;
  }
  // rebuild only when the kind of controls changes, so typing a clue is never interrupted
  const sig = mode + "|" + roleLine + "|" + (mode === "guess" ? room.clue?.guesses : "");
  if(sig === dockSig) return;
  dockSig = sig;
  const typed = $("#clueIn")?.value || "";
  d.innerHTML = `<div class="in">${roleLine}${body}</div>`;
  document.documentElement.style.setProperty("--dockh", d.offsetHeight + "px");  // the board never hides behind the controls
  if(mode === "clue"){
    $("#clueIn").value = typed;
    $("#clueForm").onsubmit = async e=>{ e.preventDefault(); const w = $("#clueIn").value.trim(); if(!w) return toast("Type a clue first.");
      try{ await act("clue", {word:w, n:clueN}); $("#clueIn").value = ""; $("#clueIn").blur(); }catch(err){ toast(err.message); buzz([40,40,40]); } };
    d.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{ clueN = +b.dataset.n; d.querySelectorAll("[data-n]").forEach(x=>x.classList.toggle("on", +x.dataset.n===clueN)); SFX.tap(); });
  }
  if($("#endTurn")) $("#endTurn").onclick = ()=>act("endturn").catch(err=>toast(err.message));
}

/* ---------- sheets: log, teams, host ---------- */
function logHTML(){
  const out = []; let cur = null;
  for(const e of room.log || []){
    if(e.kind === "clue"){ cur = {e, gs:[], end:null}; out.push(cur); }
    else if(e.kind === "guess" && cur) cur.gs.push(e);
    else if(e.kind === "end"){ if(cur && cur.e.team === e.team) cur.end = e.why; else out.push({skip:e}); }
  }
  if(!out.length) return '<p class="hint">No clues yet.</p>';
  const why = {wrong:"wrong card", out:"out of guesses", pass:"ended their turn", timeout:"ran out of time", host:"host skipped", "clue-timeout":"no clue in time"};
  return `<div class="log">${out.reverse().map(x=> x.skip ? `<div class="le ${x.skip.team}"><span class="end">${TEAM[x.skip.team]}: ${why[x.skip.why]||"turn skipped"}</span></div>`
    : `<div class="le ${x.e.team}"><div class="cl"><span class="w">${esc(x.e.word)}</span><span class="n">${x.e.n===10?"∞":x.e.n}</span><span class="muted" style="font-size:12px;font-weight:600">${x.e.by==="ai"?"AI":esc(P(x.e.by).name)}</span></div>
      ${x.gs.length?`<div class="gs">${x.gs.map(g=>`<span class="g ${g.key}" title="${esc(P(g.by).name)}">${esc(g.w)}</span>`).join("")}</div>`:""}
      ${x.e.targets?`<div class="plan">AI was thinking of: ${x.e.targets.map(esc).join(", ")}</div>`:""}
      ${x.end?`<span class="end">${why[x.end]||""}</span>`:""}</div>`).join("")}</div>`;
}
function openSheet(k){ sheet = k; renderSheet(); }
function closeSheet(){ sheet = null; $("#sheetHost").innerHTML = ""; }
function renderSheet(){
  if(!sheet || !room) return;
  let html = "";
  if(sheet === "log") html = `<h2>Mission log</h2>${logHTML()}`;
  if(sheet === "teams"){
    const live = ["clue","guess"].includes(room.phase), my = mine();
    const row = t => { const ps = Object.keys(room.players).filter(pid=>P(pid).team===t);
      return `<div class="team ${t}"><h3>${TEAM[t]}</h3>${ps.map(pid=>`<div class="op">${face(pid,"face")}<span>${esc(P(pid).name)}${pid===me.pid?" (you)":""}</span><small class="muted">${P(pid).role==="spy"?"spymaster":"guesser"}</small></div>`).join("")}
        ${room.spymasters[t]==="ai"?`<div class="op">${botFace()}<span>AI spymaster</span></div>`:""}
        ${my.role !== "spy" && my.team !== t ? `<button class="btn small ${t}" data-join="${t}">Switch to ${TEAM[t]}</button>` : ""}
        ${my.role !== "spy" && (!live || room.spymasters[t] === "ai" || !room.spymasters[t]) && (room.spymasters[t]==="ai" || !room.spymasters[t]) ? `<button class="btn small" data-seat="${t}">Become ${TEAM[t]} spymaster</button>` : ""}</div>`; };
    html = `<h2>Teams</h2><div class="teams" style="margin:0">${row("red")}${row("blue")}</div>${live && my.role !== "spy" ? '<p class="hint">Becoming a spymaster shows you the key, so only do it if your team needs one.</p>' : ""}`;
  }
  if(sheet === "host"){
    const ph = room.phase;
    html = `<h2>Host controls</h2><div class="tools" style="justify-content:flex-start">
      ${ph==="guess"?'<button class="btn small" data-host="skip">End this turn</button>':""}
      ${ph==="clue"?`<button class="btn small" data-host="skip">${room.spymasters[room.turn]==="ai"?"Ask the AI again":"Skip this clue"}</button>`:""}
      ${room.deadline?'<button class="btn small" data-host="addtime">+30 seconds</button>':""}
      <button class="btn small" data-host="tolobby">Back to the lobby</button></div>
      <div><label>Players</label><div class="ops">${Object.keys(room.players).filter(pid=>pid!==me.pid).map(pid=>`<div class="op">${face(pid,"face")}<span>${esc(P(pid).name)}</span><button class="btn small" data-kick="${pid}">Kick</button></div>`).join("") || '<p class="hint">Nobody else yet.</p>'}</div></div>`;
  }
  $("#sheetHost").innerHTML = `<div class="scrim" data-close="1"></div><div class="sheet"><div class="grab"></div><div class="in">${html}<button class="btn wide" data-close="1">Close</button></div></div>`;
}

/* ---------- game over ---------- */
let overSig = "";
function renderOver(){
  const el = $("#awards"), b = $("#banner");
  if(room.phase !== "over"){ el.innerHTML = b.innerHTML = ""; overSig = ""; return; }
  const sig = room.dealId + room.winner;
  if(sig === overSig) return; overSig = sig;
  const w = room.winner, st = room.stats || {};
  const why = room.why === "assassin" ? `${TEAM[other(w)]} found the assassin` : `${TEAM[w]} found every agent`;
  b.innerHTML = `<div class="winner ${w}"><h2>${TEAM[w]} team wins</h2><p>${why} · series ${room.wins.red}–${room.wins.blue}</p></div>`;
  const ps = Object.keys(st).filter(pid=>room.players[pid]);
  const best = (k) => ps.filter(pid=>st[pid][k]).sort((a,b)=>st[b][k]-st[a][k])[0];
  const clues = (room.log||[]).filter(e=>e.kind==="clue").sort((a,b)=>(b.right||0)-(a.right||0));
  const top = clues[0], sharp = best("right"), oops = ps.filter(pid=>st[pid].assassin)[0] || best("wrong");
  const cards = [];
  if(top && top.right) cards.push(`<div class="award"><span class="k">Clue of the game</span><span class="v" style="font-family:var(--display);font-size:20px;text-transform:uppercase">${esc(top.word)} <span class="muted" style="font-size:14px">${top.n===10?"∞":top.n}</span></span><span class="d">${top.right} agent${top.right===1?"":"s"} found · ${top.by==="ai"?"AI spymaster":esc(P(top.by).name)}</span></div>`);
  if(sharp) cards.push(`<div class="award"><span class="k">Sharpest agent</span><span class="v">${face(sharp,"face")}${esc(P(sharp).name)}</span><span class="d">${st[sharp].right} right guess${st[sharp].right===1?"":"es"}</span></div>`);
  if(oops) cards.push(`<div class="award"><span class="k">${st[oops].assassin ? "Shook hands with the assassin" : "Friendly fire"}</span><span class="v">${face(oops,"face")}${esc(P(oops).name)}</span><span class="d">${st[oops].assassin ? "Game over, courtesy of them" : `${st[oops].wrong} wrong card${st[oops].wrong===1?"":"s"}`}</span></div>`);
  const aiPlans = clues.filter(e=>e.by==="ai" && e.targets);
  el.innerHTML = `<div class="awards">${cards.map((c,i)=>c.replace('class="award"', `class="award" style="animation-delay:${1.6+i*.2}s"`)).join("")}</div>
    ${aiPlans.length ? `<div class="panel" style="width:min(640px,100%);margin:12px auto 0"><h2>What the AI was thinking</h2>${aiPlans.map(e=>`<div><b style="font-family:var(--display);text-transform:uppercase;letter-spacing:.05em;color:var(--${e.team})">${esc(e.word)} ${e.n}</b> <span class="muted">→ ${e.targets.map(esc).join(", ")}</span></div>`).join("")}</div>` : ""}
    <div class="panel" style="width:min(640px,100%);margin:12px auto 0"><h2>Mission log</h2>${logHTML()}</div>`;
}

/* ---------- moments: what changed since the last update, as animation and sound ---------- */
function moments(){
  if(!prev || view !== "game") return;
  const r = room.lastReveal;
  if(r && r.id !== prev.lastReveal?.id){
    const el = document.querySelector(`.card[data-i="${r.i}"]`);
    const color = {red:"#ff3d5a", blue:"#3d8bff", neutral:"#d9c9a3", assassin:"#ff3d5a"}[r.key];
    if(r.key === "assassin"){ assassinFx(); }
    else if(r.key === r.team){ SFX.right(); buzz(30); setTimeout(()=>{ burst(el, color); el?.classList.add("glow"); }, 380); }
    else { (r.key === "neutral" ? SFX.neutral : SFX.wrong)(); buzz([60,40,60]); setTimeout(()=>{ el?.classList.add("shake"); flash(color); }, 380); setTimeout(()=>el?.classList.remove("shake"), 1000); }
  }
  if(room.phase === "guess" && room.clue && room.clue.id !== prev.clue?.id) cluePop(room.clue);
  else if(room.phase === "clue" && (prev.phase !== "clue" || prev.turn !== room.turn) && prev.phase !== "starting" && prev.phase !== "lobby"){
    setTimeout(()=>sweep(room.turn, `${room.spymasters[room.turn]==="ai" ? "AI spymaster" : "Spymaster"} is up`), r && r.id !== prev.lastReveal?.id ? 900 : 0);
  }
  if(room.phase === "clue" && prev.phase === "starting") setTimeout(()=>sweep(room.turn, "goes first"), 1100);
  if(room.phase === "clue" && room.turn === myTeam() && isSpy() && (prev.phase !== "clue" || prev.turn !== room.turn)) buzz([80,60,80]);
  if(room.phase === "over" && prev.phase !== "over"){
    const delay = room.why === "assassin" ? 2600 : 900;
    setTimeout(()=>{ SFX.win(); confetti(room.winner); }, delay);
  }
}
function burst(el, color){
  if(!el) return; const b = el.getBoundingClientRect(), cx = b.left + b.width/2, cy = b.top + b.height/2;
  for(let k=0;k<18;k++){
    const s = document.createElement("i"); s.className = "spark";
    const a = Math.random()*Math.PI*2, d = 40 + Math.random()*70;
    s.style.cssText = `left:${cx}px;top:${cy}px;background:${k%3?color:"#fff"};--x:${Math.cos(a)*d}px;--y:${Math.sin(a)*d}px;--r:${Math.random()*360}deg`;
    document.body.appendChild(s); setTimeout(()=>s.remove(), 900);
  }
}
function flash(color){ const f = document.createElement("div"); f.className = "flash"; f.style.background = `radial-gradient(circle,transparent 40%,${color})`; document.body.appendChild(f); setTimeout(()=>f.remove(), 800); }
function sweep(team, sub){
  if(!team) return; SFX.turn();
  const s = document.createElement("div"); s.className = "sweep " + team;
  s.innerHTML = `<b>${TEAM[team]} team</b><small>${esc(sub)}</small>`; document.body.appendChild(s); setTimeout(()=>s.remove(), 1700);
}
function cluePop(c){
  SFX.clue(); buzz(40);
  const p = document.createElement("div"); p.className = "cluepop";
  p.innerHTML = `<div class="cc ${c.team}"><div class="k">${TEAM[c.team]} clue · ${c.by==="ai"?"AI spymaster":esc(P(c.by).name)}</div><div class="w">${esc(c.word)}</div><span class="n">${c.n===10?"∞":c.n}</span></div>`;
  document.body.appendChild(p); setTimeout(()=>p.remove(), 2200);
}
function assassinFx(){
  SFX.assassin(); buzz([300,100,300]);
  document.body.classList.add("quake"); setTimeout(()=>document.body.classList.remove("quake"), 700);
  const a = document.createElement("div"); a.className = "assassin-fx";
  a.innerHTML = `<div><b>ASSASSIN</b><small>${TEAM[room.lastReveal.team]} team is out</small></div>`;
  setTimeout(()=>{ document.body.appendChild(a); setTimeout(()=>a.remove(), 3300); }, 350);
}
function confetti(team){
  const cols = team === "red" ? ["#ff3d5a","#ff9db0","#ffcf4d","#fff"] : ["#3d8bff","#a9cbff","#ffcf4d","#fff"];
  for(let k=0;k<90;k++){
    const c = document.createElement("i"); c.className = "confetti";
    c.style.cssText = `left:${Math.random()*100}vw;background:${cols[k%cols.length]};--x:${(Math.random()*2-1)*120}px;--r:${Math.random()*900}deg;animation-duration:${2.2+Math.random()*2}s;animation-delay:${Math.random()*.6}s;border-radius:${k%4?2:50}px`;
    document.body.appendChild(c); setTimeout(()=>c.remove(), 5200);
  }
}

/* ---------- clicks shared across views ---------- */
document.addEventListener("click", async e=>{
  const h = e.target.closest("[data-host]"), k = e.target.closest("[data-kick]"), j = e.target.closest("[data-join]"), s = e.target.closest("[data-seat]");
  const sh = e.target.closest("[data-sheet]"), cl = e.target.closest("[data-close]"), ag = e.target.closest("[data-again]"), sp = e.target.closest("[data-shuffle-spies]");
  try{
    if(sh){ openSheet(sh.dataset.sheet); return; }
    if(cl){ closeSheet(); return; }
    if(h){ await act(h.dataset.host, h.dataset.host==="addtime"?{sec:30}:{}); if(h.closest(".sheet")) closeSheet(); }
    if(sp) await act("shuffle", {spies:true});
    if(ag) await act("playagain", {rotate: ag.dataset.again === "rotate"});
    if(j){ await act("team", {team:j.dataset.join, role:"op"}); SFX.tap(); if(j.closest(".sheet")) closeSheet(); }
    if(s){ const t = s.dataset.seat, cur = room.spymasters[t];
      if(cur === me.pid) await act("team", {team:t, role:"op"});
      else if(cur && cur !== "ai") toast(`${P(cur).name} is the ${TEAM[t]} spymaster.`);
      else { await act("team", {team:t, role:"spy"}); SFX.tap(); }
      if(s.closest(".sheet")) closeSheet(); }
    if(k){ if(k.dataset.sure !== "1"){ k.dataset.sure = "1"; k.textContent = "Sure?"; return; } await act("kick", {pid:k.dataset.kick}); }
  }catch(err){ toast(err.message); }
});

function tickTimer(){
  const el = $("#timer");
  if(!room || !room.deadline || !["clue","guess"].includes(room.phase)){ el.hidden = true; return; }
  const left = Math.max(0, Math.ceil(room.deadline - serverNow()));
  el.hidden = false; el.textContent = `${Math.floor(left/60)}:${String(left%60).padStart(2,"0")}`;
  el.classList.toggle("low", left <= 10);
}
setInterval(tickTimer, 250);

const c0 = (new URLSearchParams(location.search).get("room")||"").toUpperCase();
if(c0) openRoom(c0); else home();
</script>
