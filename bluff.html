<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0D18">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Game Night">
<title>Fox's Bluff</title>
<link rel="stylesheet" href="/festival.css">
<style>
/* Fox's Bluff — Overhead Circular Neon Tokyo Bluffing Table:
   You sit at the bottom; everyone else sits clockwise around the glowing crimson-obsidian table rim.
   Each player's 3D coaster stack rests on the felt right in front of them, coasters physically fly
   from seat to stack on placement, and flipping triggers a 3D rotateY reveal with full arcade juice! */
:root{
  --line2:var(--line-2); --glass:color-mix(in srgb,var(--night-2) 90%,transparent);
  --glass2:rgba(255,255,255,.07); --amber:var(--gold); --mint:var(--shrine);
  --crimson:#FF3E6C; --sakura:#FF85B3;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;overflow-x:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.muted{color:var(--muted)}
.iconbtn{border:1px solid var(--line);background:rgba(255,255,255,.06);border-radius:50%;width:38px;height:38px;display:grid;place-items:center;padding:0;color:inherit}
.iconbtn svg{width:18px;height:18px}
.timer{font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;border-radius:999px;padding:3px 12px;background:rgba(255,255,255,.09);color:var(--fg)}
.timer.low{background:var(--crimson);color:#fff;animation:beat 1s infinite}
@keyframes beat{50%{transform:scale(1.07)}}

.stage{width:min(860px,100%);margin:0 auto;padding:8px max(14px,env(safe-area-inset-left,0px)) calc(120px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-right,0px))}
.eyebrow{text-align:center;font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--amber)}
.title{font-size:clamp(28px,7vw,46px);line-height:1.08;text-align:center;margin-top:4px}
.sub{text-align:center;color:var(--muted);margin:8px auto 0;max-width:54ch}
.panel{background:var(--glass);border:1px solid var(--line);border-radius:20px;padding:18px;display:grid;gap:14px;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.panel h2{font-size:22px}
.btn{border:1px solid var(--line2);background:var(--glass2);border-radius:999px;padding:11px 20px;font-weight:700;transition:transform .12s,background .15s}
.btn:hover:not(:disabled){background:rgba(255,255,255,.13)}
.btn:active:not(:disabled){transform:scale(.96)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.primary{background:linear-gradient(135deg,var(--crimson),#FF6B4A);border-color:transparent;color:#fff;box-shadow:0 10px 26px -8px rgba(255,62,108,.65)}
.btn.small{padding:6px 14px;font-size:13px}
.btn.wide{width:100%}
label{display:block;font-size:13.5px;font-weight:700;color:var(--muted);margin-bottom:6px}
input[type=text],select{width:100%;background:var(--night);border:1px solid var(--line);border-radius:12px;padding:11px 13px;outline:none;color:var(--fg);font-size:16px}
input[type=text]:focus,select:focus{border-color:var(--amber)}
select option{background:var(--night)}
.err{color:var(--danger);font-size:14px;min-height:1.3em}
.hint{font-size:13px;color:var(--muted);margin:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:540px){.row2{grid-template-columns:1fr}}

.face{width:44px;height:44px;border-radius:50%;overflow:hidden;display:grid;place-items:center;font-weight:900;color:var(--ink);flex:none}
.face img,.mini img{width:100%;height:100%;object-fit:cover;object-position:50% 20%;display:block}
.mini{width:24px;height:24px;border-radius:50%;overflow:hidden;display:inline-grid;place-items:center;font-size:11px;font-weight:900;color:var(--ink);border:1.5px solid var(--night);flex:none}
.photo-pick{display:flex;align-items:center;gap:14px}
.photo-pick .face{width:64px;height:64px;border:3px dashed var(--line2);background:rgba(0,0,0,.3);font-size:12px;color:var(--muted)}
.ring{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px;margin-top:12px}
.tok{display:grid;justify-items:center;gap:4px}
.tok .face{width:62px;height:62px;border:3px solid rgba(255,255,255,.18);font-size:22px}
.tok .nm{font-weight:800;font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- CIRCULAR BLUFFING TABLE ---------- */
.b-arena{
  position:relative;container-type:inline-size;
  width:min(100%,610px,max(290px,calc(100svh - 330px)));
  aspect-ratio:1;margin:8px auto 0;
  --rail:var(--amber);
}
.b-arena.ph-bid{--rail:var(--crimson)}
.b-arena.ph-flip{--rail:var(--mint)}
.b-arena.ph-boom{--rail:#FF2E4D}

.b-felt{
  position:absolute;inset:8%;border-radius:50%;overflow:hidden;
  background:
    repeating-conic-gradient(from 0deg,rgba(255,255,255,.02) 0 3deg,transparent 3deg 15deg),
    radial-gradient(circle at 50% 38%,#2b122c 0%,#160b22 54%,#0a0715 100%);
  box-shadow:
    0 0 0 2.5px color-mix(in srgb,var(--rail) 85%,#fff),
    0 0 0 10px rgba(255,255,255,.03),
    0 0 60px 6px color-mix(in srgb,var(--rail) 45%,transparent),
    0 34px 66px -22px #000,
    inset 0 0 76px rgba(0,0,0,.78);
  transition:box-shadow .55s;
}
.b-felt::before{
  content:"";position:absolute;inset:9%;border-radius:50%;
  border:1px solid color-mix(in srgb,var(--rail) 35%,rgba(255,255,255,.08));
  transition:border-color .5s;
}
.b-felt::after{
  content:"";position:absolute;inset:24%;border-radius:50%;
  border:1px dashed rgba(255,255,255,.09);
}
.b-halo{
  position:absolute;left:50%;top:50%;width:58%;height:58%;transform:translate(-50%,-50%);
  border-radius:50%;background:var(--rail);filter:blur(46px);opacity:.26;
  transition:background-color .55s,opacity .55s;
}
.b-arena.ph-bid .b-halo,.b-arena.ph-flip .b-halo{opacity:.38;animation:pulseHalo 2s ease-in-out infinite}
@keyframes pulseHalo{50%{transform:translate(-50%,-50%) scale(1.12);opacity:.48}}

/* Sweeping Spotlight Beam */
.b-spot{
  position:absolute;left:50%;top:50%;height:20cqw;width:0;margin-top:-10cqw;
  transform-origin:0 50%;z-index:1;pointer-events:none;
  background:linear-gradient(90deg,transparent 12%,color-mix(in srgb,var(--rail) 18%,transparent) 50%,color-mix(in srgb,var(--rail) 46%,transparent) 100%);
  clip-path:polygon(0 50%,100% 0,100% 100%);
  transition:transform .58s cubic-bezier(.3,1.2,.45,1),width .58s,opacity .3s;
}

/* Center Medallion */
.b-center{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;
  width:clamp(108px,30cqw,168px);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 35% 25%,rgba(34,20,52,.94),rgba(11,9,22,.96));
  border:2px solid color-mix(in srgb,var(--rail) 65%,rgba(255,255,255,.15));
  box-shadow:0 16px 40px -12px #000,0 0 34px -6px color-mix(in srgb,var(--rail) 55%,transparent),inset 0 1px 0 rgba(255,255,255,.15);
  display:grid;place-items:center;align-content:center;gap:2px;padding:10px;text-align:center;
  transition:border-color .4s,box-shadow .4s;
}
.b-center small{font-size:clamp(9.5px,2.2cqw,11.5px);font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);line-height:1.15}
.b-center b{font-family:var(--display);font-size:clamp(22px,6.5cqw,36px);line-height:1;color:var(--fg)}
.b-center .who-bid{font-size:clamp(10px,2.4cqw,12px);font-weight:700;color:var(--amber);max-width:92%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.b-pips{display:flex;gap:4px;justify-content:center;margin-top:3px;flex-wrap:wrap}
.b-pips i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);transition:background .25s,transform .25s}
.b-pips i.ok{background:var(--mint);border-color:#fff;box-shadow:0 0 8px var(--mint);transform:scale(1.18)}
.b-pips i.fox{background:var(--crimson);border-color:var(--amber);box-shadow:0 0 10px var(--crimson)}

/* Seated Players Around Rim */
.b-seat{
  position:absolute;z-index:4;transform:translate(-50%,-50%);
  display:grid;justify-items:center;gap:2px;width:min(24cqw,96px);text-align:center;
  transition:opacity .3s,filter .3s;
}
.b-seat.out{opacity:.38;filter:grayscale(.85)}
.b-seat.passed{opacity:.64}
.b-seat .av{position:relative;width:clamp(36px,11.5cqw,58px);aspect-ratio:1;transition:transform .32s cubic-bezier(.3,1.5,.5,1)}
.b-seat .face{width:100%;height:100%;border:2.5px solid #0e1022;box-shadow:0 8px 18px -6px rgba(0,0,0,.85);transition:border-color .3s,box-shadow .3s}
.b-seat.turn .av{transform:scale(1.12)}
.b-seat.turn .face{border-color:var(--rail);box-shadow:0 0 0 3px color-mix(in srgb,var(--rail) 40%,transparent),0 0 28px 6px color-mix(in srgb,var(--rail) 55%,transparent)}
.b-seat .tring{
  position:absolute;inset:-6px;border-radius:50%;
  background:conic-gradient(var(--rail) calc(var(--p,1)*360deg),rgba(255,255,255,.08) 0);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3.5px),#000 calc(100% - 3px));
          mask:radial-gradient(farthest-side,transparent calc(100% - 3.5px),#000 calc(100% - 3px));
}
.b-seat .cnt{
  position:absolute;right:-8px;bottom:-3px;min-width:20px;height:20px;border-radius:50%;
  background:var(--night-2);color:var(--amber);border:1.5px solid var(--amber);
  font:800 11px/17px var(--mono);text-align:center;box-shadow:0 3px 8px rgba(0,0,0,.6);
}
.b-seat b{
  font-size:11px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  background:rgba(10,13,24,.84);border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:1px 8px;
}
.b-seat.turn b{background:var(--rail);color:#080B14;border-color:var(--rail)}
.b-seat .stars{font-size:10px;line-height:1;letter-spacing:1px;color:var(--amber);text-shadow:0 0 8px rgba(255,200,61,.55)}
.b-seat .badge{font-size:9.5px;font-weight:900;text-transform:uppercase;letter-spacing:.05em;border-radius:999px;padding:1px 7px;background:rgba(255,255,255,.12);color:var(--muted)}
.b-seat .badge.chal{background:var(--crimson);color:#fff}

/* 3D Coaster Stacks Sitting On The Felt */
.c-spot{
  position:absolute;z-index:5;transform:translate(-50%,-50%);
  width:clamp(46px,12.5cqw,66px);height:clamp(46px,12.5cqw,66px);
  border:0;background:none;padding:0;display:grid;place-items:center;
  perspective:600px;
}
.c-spot .pad{
  position:absolute;inset:4px;border-radius:50%;
  border:1.5px dashed rgba(255,255,255,.16);
  background:rgba(0,0,0,.22);transition:border-color .25s,box-shadow .25s,transform .2s;
}
.c-spot.pickable{cursor:pointer}
.c-spot.pickable .pad{
  border-style:solid;border-color:var(--mint);
  box-shadow:0 0 22px 2px color-mix(in srgb,var(--mint) 60%,transparent);
  animation:padPulse 1.2s ease-in-out infinite;
}
@keyframes padPulse{50%{transform:scale(1.12);box-shadow:0 0 32px 6px color-mix(in srgb,var(--mint) 80%,transparent)}}
.c-spot.pickable:hover .disc{transform:translateY(calc(var(--ty,0px) - 6px)) scale(1.08)}
.c-spot .tap-lbl{
  position:absolute;bottom:-17px;left:50%;transform:translateX(-50%);
  font:900 10px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;
  background:var(--mint);color:#061712;border-radius:999px;padding:3px 8px;
  box-shadow:0 4px 12px rgba(0,212,170,.5);pointer-events:none;
}
.c-spot .stk-badge{
  position:absolute;top:-5px;right:-4px;z-index:10;
  min-width:19px;height:19px;border-radius:999px;padding:0 5px;
  background:#0A0D18;color:#fff;border:1.5px solid var(--amber);
  font:800 10.5px/16px var(--mono);pointer-events:none;
}

.disc{
  position:absolute;width:100%;height:100%;border-radius:50%;
  display:grid;place-items:center;font-size:clamp(20px,5.6cqw,30px);
  transform:translateY(var(--ty,0px));
  box-shadow:0 5px 0 rgba(0,0,0,.55),0 10px 18px -4px rgba(0,0,0,.8);
  border:2.5px solid rgba(255,255,255,.28);
  transition:transform .22s cubic-bezier(.2,1.3,.4,1);
}
.disc.back{
  background:radial-gradient(circle at 32% 28%,#4c2e6b,#1b1232 72%);
  border-color:color-mix(in srgb,var(--amber) 75%,#fff);
  color:var(--amber);font-size:clamp(14px,3.6cqw,18px);font-weight:900;
}
.disc.back::after{
  content:"";position:absolute;inset:5px;border-radius:50%;
  border:1px solid rgba(255,200,61,.35);
}
.disc.flower{
  background:radial-gradient(circle at 30% 25%,#FFF0F6,#FF7EB3 72%,#C93B78 100%);
  border-color:#fff;box-shadow:0 5px 0 #8a1d4f,0 0 22px rgba(255,133,179,.65);
}
.disc.fox{
  background:radial-gradient(circle at 30% 25%,#FF6B6B,#D9163C 65%,#5E081B 100%);
  border-color:var(--amber);box-shadow:0 5px 0 #4a0513,0 0 28px rgba(255,46,77,.85);
}
.disc.flipped-fresh{animation:flip3d .52s cubic-bezier(.2,1.15,.35,1) both}
@keyframes flip3d{
  0%{transform:translateY(var(--ty,0px)) rotateY(-180deg) scale(.85)}
  55%{transform:translateY(calc(var(--ty,0px) - 16px)) rotateY(-20deg) scale(1.18)}
  100%{transform:translateY(var(--ty,0px)) rotateY(0deg) scale(1)}
}
.disc.dim{opacity:.58}

/* Flying Coaster & Table Ripple */
.fly-disc{position:fixed;z-index:70;pointer-events:none;border-radius:50%;display:grid;place-items:center}
.b-wave{position:absolute;left:50%;top:50%;width:24%;height:24%;margin:-12% 0 0 -12%;border-radius:50%;border:4px solid var(--rail);box-shadow:0 0 26px var(--rail);pointer-events:none;z-index:2;animation:bwave .7s cubic-bezier(.16,1,.3,1) forwards}
@keyframes bwave{to{transform:scale(4.6);opacity:0;border-width:1px}}

/* Status Pill & Hand Dock */
.status-pill{
  display:flex;align-items:center;justify-content:center;gap:9px;
  margin:14px auto 4px;width:max-content;max-width:100%;
  font-family:var(--display);font-weight:700;font-size:clamp(16px,4.2vw,21px);
  padding:7px 18px;border-radius:999px;
  background:rgba(16,22,42,.82);border:1px solid var(--line-2);
  box-shadow:0 10px 28px -12px #000;text-align:center;
}
.status-pill.mine{background:linear-gradient(135deg,var(--amber),#FF9F43);color:#090C16;border-color:transparent;box-shadow:0 0 28px -4px rgba(255,200,61,.65)}
.status-pill.danger{background:linear-gradient(135deg,#FF3E6C,#D9163C);color:#fff;border-color:transparent;box-shadow:0 0 30px -4px rgba(255,62,108,.7)}
.status-pill.win{background:linear-gradient(135deg,var(--mint),#38BDF8);color:#061712;border-color:transparent}

.hand-bar{
  background:var(--glass);border:1px solid var(--line2);border-radius:22px;
  padding:14px 16px;display:grid;gap:12px;margin-top:12px;
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
}
.coasters{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;padding:4px 0}
.coaster-btn{
  position:relative;width:74px;height:74px;border-radius:50%;
  border:3px solid rgba(255,255,255,.4);display:grid;place-items:center;font-size:33px;
  box-shadow:0 6px 0 rgba(0,0,0,.45),0 14px 26px -8px #000;
  transition:transform .18s cubic-bezier(.2,1.4,.4,1),box-shadow .18s,filter .18s;
}
.coaster-btn:hover:not(:disabled){transform:translateY(-8px) scale(1.07)}
.coaster-btn:active:not(:disabled){transform:translateY(-1px) scale(.96)}
.coaster-btn.flower{background:radial-gradient(circle at 30% 25%,#FFF0F6,#FF7EB3 72%,#C93B78 100%);box-shadow:0 6px 0 #8a1d4f,0 14px 26px -8px rgba(255,126,179,.5)}
.coaster-btn.fox{background:radial-gradient(circle at 30% 25%,#FF6B6B,#D9163C 65%,#5E081B 100%);border-color:var(--amber);box-shadow:0 6px 0 #4a0513,0 14px 26px -8px rgba(255,46,77,.55)}
.coaster-btn:disabled{opacity:.34;filter:grayscale(.45);cursor:not-allowed}
.bid-nums{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;align-items:center}
.bid-nums button[data-bid]{
  min-width:44px;height:42px;border-radius:12px;border:1.5px solid var(--line2);
  background:rgba(255,255,255,.06);font-family:var(--mono);font-weight:800;font-size:16px;
  transition:transform .12s,background .15s,border-color .15s;
}
.bid-nums button[data-bid]:hover{border-color:var(--amber);background:color-mix(in srgb,var(--amber) 22%,transparent);color:var(--amber);transform:translateY(-2px)}
.logline{text-align:center;font-size:13.5px;color:var(--muted);min-height:1.4em;margin:8px 0 0}
.fadeup{animation:fadeup .38s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes fadeup{from{opacity:0;transform:translateY(12px)}}
.hostbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;gap:10px;flex-wrap:wrap;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:var(--night-2);border-top:2px solid var(--gold)}
body.has-hostbar{--chat-lift:66px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:60;background:var(--paper);color:var(--ink);font-weight:700;border-radius:999px;padding:10px 18px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
</style>
</head>
<body>
<header class="top noren">
  <a class="noren-back" href="/" aria-label="Back to all games">&larr; Arcade</a>
  <h1>Fox's Bluff</h1>
  <button type="button" class="code" id="hCode" title="Copy invite link" aria-label="Copy invite link" hidden></button>
  <span class="spacer"></span>
  <span class="timer" id="timer" hidden></span>
</header>
<main class="stage" id="stage"></main>
<div class="hostbar" id="hostbar" hidden></div>
<div class="toast" id="toast" hidden></div>

<script src="/avatars.js"></script>
<script src="/backguard.js"></script>
<script src="/theme.js"></script>
<script src="/chat.js"></script>
<script src="/pranks.js"></script>
<script src="/roombar.js"></script>
<script src="/howto.js"></script>
<script src="/juice.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hue = n => { let h=0; for(const c of String(n)) h=(h*31+c.charCodeAt(0))%360; return `hsl(${h} 70% 72%)`; };
function store(k, v){ try{ if(v===undefined) return JSON.parse(localStorage.getItem(k)); localStorage.setItem(k, JSON.stringify(v)); }catch(e){ return null; } }
function toast(m){ const t=$("#toast"); t.textContent=m; t.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>t.hidden=true,2600); }
const buzz = p => { try{ if(navigator.vibrate && navigator.userActivation?.hasBeenActive) navigator.vibrate(p); }catch(e){} };
const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
async function api(path, body){
  const r = await fetch(path, body ? {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)} : {});
  const j = await r.json().catch(()=>({error:"The server didn't answer. Try again."}));
  if(!r.ok) throw new Error(j.error || "Something went wrong");
  return j;
}

let code=null, room=null, me=null, hostKey=null, pollGen=0, clockOffset=0;
let spotAngle=null, spotLen=0, prevSnap=null, freshFlips={}, pendingFly=[];
const serverNow = () => Date.now()/1000 + clockOffset;
const act = (a, extra={}) => api(`/api/rooms/${code}/${a}`, {hostKey, ...(me||{}), ...extra});
Chat.mount({act});
Pranks.mount({act});
RoomBar.mount({act, game:"bluff", onHostChange:(hk, became)=>{ hostKey = hk; if(became) toast("You are now the host!"); if(room) render(); }});
if(window.Juice) Juice.mountMute();
const P = pid => room.players[pid] || {name:"Someone"};
const picOf = p => { const s = Avatars.src(p); return s ? `<img src="${esc(s)}" alt="">` : esc((p.name||"?")[0].toUpperCase()); };
const face = (pid, cls="face") => `<span class="${cls}" data-pid="${esc(pid)}" style="background:${hue(P(pid).name)}">${picOf(P(pid))}</span>`;

function home(){
  $("#hCode").hidden = true; $("#timer").hidden = true; $("#hostbar").hidden = true;
  document.body.classList.remove("has-hostbar");
  $("#stage").innerHTML = `<div class="fadeup" style="margin-top:3vh"><div class="eyebrow">Circular Mind-Game Table</div><h1 class="title">Fox's Bluff</h1>
    <p class="sub">3 Sakura Blossoms, 1 Cursed Fox Trap. Stack coasters face-down around the table, bluff your friends into bidding too high, and survive the flips!</p></div>
    <div class="row2 fadeup" style="margin-top:20px">
      <form class="panel" id="createForm"><h2>Host a table</h2>
        <div><label for="cName">Your name</label><input type="text" id="cName" maxlength="24" autocomplete="nickname"></div>
        <div class="err" id="cErr"></div><button class="btn primary wide">Create room</button></form>
      <form class="panel" id="joinForm"><h2>Join with a code</h2>
        <div><label for="jCode">Room code</label><input type="text" id="jCode" maxlength="6" autocomplete="off" style="text-transform:uppercase;letter-spacing:.15em"></div>
        <div><label for="jName">Your name</label><input type="text" id="jName" maxlength="24" autocomplete="nickname"></div>
        <div class="err" id="jErr"></div><button class="btn wide">Join</button></form>
    </div><div class="fadeup">${HowTo.button("bluff")}</div>`;
  $("#createForm").onsubmit = async e=>{ e.preventDefault(); const n=$("#cName").value.trim(); if(!n) return $("#cErr").textContent="Enter your name.";
    try{ const r=await api("/api/rooms",{game:"bluff",title:"Fox's Bluff"}); const m=await api(`/api/rooms/${r.code}/join`,{name:n}); store("fb2:"+r.code,{me:m,hostKey:r.hostKey}); history.replaceState({},"","/bluff?room="+r.code); openRoom(r.code); }catch(err){ $("#cErr").textContent=err.message; } };
  $("#joinForm").onsubmit = async e=>{ e.preventDefault(); const c=$("#jCode").value.trim().toUpperCase(), n=$("#jName").value.trim(); if(!c||!n) return $("#jErr").textContent="Enter code and name.";
    try{ const m=await api(`/api/rooms/${c}/join`,{name:n}); store("fb2:"+c,{me:m,hostKey:null}); history.replaceState({},"","/bluff?room="+c); openRoom(c); }catch(err){ $("#jErr").textContent=err.message; } };
}
function openRoom(c){
  code=c; const s=store("fb2:"+c)||{}; me=s.me||null; hostKey=s.hostKey||null; prevSnap=null;
  $("#hCode").textContent=c; $("#hCode").hidden=false; BackGuard.arm(); poll(++pollGen,-1);
}
async function poll(gen, v){
  while(gen === pollGen){
    try{
      const who = (me ? `&pid=${me.pid}&key=${me.key}` : "") + (hostKey ? `&hk=${hostKey}` : "");
      const next = await api(`/api/rooms/${code}?v=${v}${who}`);
      if(gen !== pollGen) return;
      const prev = room; room = next; v = room.version; clockOffset = room.now - Date.now()/1000;
      if(me && !room.players[me.pid]){ me = null; if(!room.roomMeta?.isHost) hostKey = null; store("fb2:"+code, {hostKey}); toast("You were removed from this game"); }
      if(me && room.players[me.pid]) Avatars.apply(act, room.players[me.pid]);
      if(!Chat.socialOnly(prev, room)){ diffTable(prev); render(); }
      Chat.update(room, me); Pranks.update(room, me); RoomBar.update(room, me, hostKey);
    }catch(e){ if(e.message.includes("not found")){ toast("Room not found"); return home(); } await new Promise(r=>setTimeout(r,2000)); }
  }
}

function diffTable(prev){
  freshFlips = {}; pendingFly = [];
  const t = room.table, pt = prev?.table;
  if(!t || !pt || t.round !== pt.round){
    prevSnap = t ? {stackCount:{...t.stackCount}, flipped:JSON.parse(JSON.stringify(t.flipped||{}))} : null;
    if(t && prev?.phase === "lobby") Juice?.sfx.deal();
    return;
  }
  const sfx = window.Juice?.sfx;
  // Detect newly placed coasters -> fly coaster from seat to stack + clack!
  let anyPlaced = false;
  for(const pid of t.order){
    if((t.stackCount[pid]||0) > (pt.stackCount[pid]||0)){
      pendingFly.push(pid); anyPlaced = true;
    }
    const oldF = (pt.flipped?.[pid] || []).length;
    const newF = (t.flipped?.[pid] || []).length;
    if(newF > oldF){
      freshFlips[pid] = newF - 1;
      const card = t.flipped[pid][newF - 1];
      if(card === "fox"){ sfx?.boom(); buzz([90,40,90]); }
      else { sfx?.flip(); buzz(25); }
    }
  }
  if(anyPlaced) sfx?.clack();
  if(t.bid > pt.bid){ sfx?.pop(); }
  if(room.phase === "roundover" && prev.phase !== "roundover"){
    if(t.outcome?.win){ sfx?.win(); setTimeout(()=>Juice?.confetti(), 120); }
    else { setTimeout(()=>Juice?.shake($("#bluffArena"), 10), 60); }
  }
  if(room.phase === "final" && prev.phase !== "final"){
    sfx?.win();
    setTimeout(()=>Juice?.confetti({count:110}), 80);
    setTimeout(()=>Juice?.confetti({count:80}), 520);
  }
  const nowActive = room.phase === "flip" ? t.bidder : t.turn;
  const prevActive = prev.phase === "flip" ? pt.bidder : pt.turn;
  if(["turn","bid","flip"].includes(room.phase) && nowActive === me?.pid && (nowActive !== prevActive || room.phase !== prev.phase)){
    sfx?.turn(); buzz(60);
  }
}

function render(){
  renderHostbar();
  document.body.classList.toggle("has-hostbar", !$("#hostbar").hidden);
  if(!me || !room.players[me.pid]) return gate();
  if(room.phase === "lobby") lobby();
  else tableView();
  tickTimer();
}
function gate(){
  if($("#gate")) return;
  $("#stage").innerHTML=`<form class="panel fadeup" id="gate" style="margin:8vh auto 0;max-width:420px"><h2 style="text-align:center">Join Fox's Bluff</h2>
    <input type="text" id="gName" placeholder="Your name" maxlength="24" autocomplete="nickname"><div class="err" id="gErr"></div><button class="btn primary wide">Take a seat</button></form>`;
  $("#gate").onsubmit = async e=>{ e.preventDefault(); const n=$("#gName").value.trim(); if(!n) return;
    try{ me=await api(`/api/rooms/${code}/join`,{name:n}); store("fb2:"+code,{me,hostKey}); poll(++pollGen,-1); }catch(err){ $("#gErr").textContent=err.message; } };
}
function lobby(){
  const s=room.settings, ps=Object.keys(room.players), mine=P(me.pid), H=!!hostKey;
  const sel=(id,opts,val)=>`<select id="${id}" ${H?"":"disabled"}>${opts.map(([v,t])=>`<option value="${v}" ${String(v)===String(val)?"selected":""}>${t}</option>`).join("")}</select>`;
  $("#stage").innerHTML=`<div class="fadeup"><h1 class="title">${ps.length} at the table</h1>
    <p class="sub">Share code <b style="letter-spacing:.2em;color:var(--amber)">${room.code}</b>. 2 to 8 players.</p></div>
    <div class="panel" style="margin-top:14px"><div class="photo-pick"><button class="face" id="photoBtn" type="button">${Avatars.src(mine)?picOf(mine):"Choose"}</button>
      <div><b>${esc(mine.name)}</b><p class="hint">Tap to change your avatar.</p></div></div></div>
    <div class="ring">${ps.map(pid=>`<div class="tok">${face(pid,"face")}<span class="nm">${esc(P(pid).name)}</span></div>`).join("")}</div>
    <div class="panel" style="margin-top:16px"><h2>${H?"Table rules":"Rules"}</h2>
      <div class="row2">
        <div><label for="sGoal">Points to win</label>${sel("sGoal",[[1,"1 point (turbo)"],[2,"2 points (classic)"],[3,"3 points"]], s.goal)}</div>
        <div><label for="sSec">Turn timer</label>${sel("sSec",[[0,"No timer"],[20,"20s"],[25,"25s"],[40,"40s"]], s.turnSec)}</div>
      </div>
      ${H ? `<button class="btn primary wide" data-host="start" ${ps.length<2?"disabled":""}>${ps.length<2?"Need 1 more player":"Deal the coasters"}</button>` : '<p class="hint" style="text-align:center">Waiting for host to deal.</p>'}
    </div>${HowTo.button("bluff")}`;
  $("#photoBtn").onclick = ()=>Avatars.open(act);
  if(H){
    const send = x => act("settings", x).catch(err=>toast(err.message));
    $("#sGoal").onchange=e=>send({goal:+e.target.value}); $("#sSec").onchange=e=>send({turnSec:+e.target.value});
  }
}

function seatOrder(t){
  const o = t.order, i = o.indexOf(me.pid);
  return i < 0 ? o : o.slice(i).concat(o.slice(0, i));
}

function tableView(){
  const t = room.table, mine = room.me, ph = room.phase;
  const isTurn = t.turn === me.pid, isChal = t.bidder === me.pid;
  const activePid = ph === "flip" ? t.bidder : (ph === "turn" || ph === "bid" ? t.turn : null);
  const lastLog = (t.log || []).slice(-1)[0]?.text || "";
  const boom = ph === "roundover" && t.outcome && !t.outcome.win;
  const wonRound = (ph === "roundover" && t.outcome?.win) || ph === "final";

  let statusText = "", statusCls = "";
  if(ph === "final"){ statusText = `👑 ${P(t.winner).name} wins Fox's Bluff!`; statusCls = "win"; }
  else if(ph === "place"){
    statusText = mine && !mine.placed ? "Place 1 coaster face-down" : "Waiting for everyone to place…";
    if(mine && !mine.placed) statusCls = "mine";
  } else if(ph === "turn"){
    statusText = isTurn ? "Your turn — stack a coaster or start bidding!" : `${P(t.turn).name}'s turn`;
    if(isTurn) statusCls = "mine";
  } else if(ph === "bid"){
    statusText = isTurn ? `Raise above ${t.bid} or Pass!` : `${P(t.turn).name} is deciding…`;
    if(isTurn) statusCls = "mine";
  } else if(ph === "flip"){
    statusText = isChal ? (mine.ownUnflipped > 0 ? "Flip your own stack first!" : `Tap a glowing stack (${t.bid - t.flippedSafe} left)`) : `${P(t.bidder).name} is flipping…`;
    if(isChal) statusCls = "mine";
  } else if(t.outcome?.win){
    statusText = `✨ ${P(t.outcome.challenger).name} flipped ${t.outcome.bid} blossoms! +1 ★`; statusCls = "win";
  } else {
    statusText = `🦊 BOOM! ${P(t.outcome?.challenger).name} hit a Cursed Fox!`; statusCls = "danger";
  }

  // Center medallion HTML
  let medHtml = "";
  if(ph === "final"){
    medHtml = `<small>Champion</small><b>👑</b><span class="who-bid">${esc(P(t.winner).name)}</span>`;
  } else if(ph === "roundover"){
    medHtml = t.outcome?.win
      ? `<small>Bluff Won</small><b>+1 ★</b><span class="who-bid">${esc(P(t.outcome.challenger).name)}</span>`
      : `<small>Trap Sprung</small><b>🦊</b><span class="who-bid">${esc(P(t.outcome?.challenger).name)}</span>`;
  } else if(t.bid > 0){
    const pips = Array.from({length:t.bid}, (_, i) => `<i class="${i < t.flippedSafe ? "ok" : ""}"></i>`).join("");
    medHtml = `<small>${ph === "flip" ? "Flipping" : "Current Bid"}</small><b>${ph === "flip" ? `${t.flippedSafe}/${t.bid}` : t.bid} 🌸</b><span class="who-bid">${esc(P(t.bidder).name)}</span><div class="b-pips">${pips}</div>`;
  } else {
    medHtml = `<small>Round ${t.round}</small><b>${t.totalPlaced}</b><span class="who-bid">coaster${t.totalPlaced===1?"":"s"} down</span>`;
  }

  const seats = seatOrder(t), N = seats.length, base = t.order.includes(me.pid) ? 90 : 270;
  const seatHtml = [], spotHtml = [];
  seats.forEach((pid, i) => {
    const rad = (base + i * 360 / N) * Math.PI / 180;
    const sx = 50 + 46 * Math.cos(rad), sy = 50 + 46 * Math.sin(rad);
    const cx = 50 + 27.5 * Math.cos(rad), cy = 50 + 27.5 * Math.sin(rad);
    const deckN = t.deckCount[pid] || 0, stkN = t.stackCount[pid] || 0, fl = t.flipped[pid] || [];
    const unflipped = Math.max(0, stkN - fl.length);
    const isAct = activePid === pid;
    const passed = t.passed.includes(pid) && ph === "bid";
    const stars = "★".repeat(t.points[pid]||0) + "☆".repeat(Math.max(0, room.settings.goal - (t.points[pid]||0)));
    const badge = ph === "flip" && t.bidder === pid ? '<span class="badge chal">Challenger</span>'
      : passed ? '<span class="badge">Passed</span>'
      : deckN === 0 ? '<span class="badge">Out</span>' : "";
    seatHtml.push(`<div class="b-seat ${isAct?"turn":""} ${deckN===0?"out":""} ${passed?"passed":""}" data-seat="${esc(pid)}" style="left:${sx.toFixed(2)}%;top:${sy.toFixed(2)}%">
      <span class="av">${face(pid,"face")}${isAct && room.deadline ? '<i class="tring"></i>' : ""}<span class="cnt" title="${deckN} coasters left">${deckN}</span></span>
      <b>${pid===me.pid?"You":esc(P(pid).name)}</b>
      <span class="stars">${stars}</span>${badge}</div>`);

    // 3D Coaster Stack resting on the felt in front of this player
    const canFlip = ph === "flip" && isChal && unflipped > 0 && ((mine?.ownUnflipped || 0) === 0 || pid === me.pid);
    const showReal = ph === "roundover" || ph === "final";
    const discs = [];
    // Build bottom-to-top layered stack!
    if(showReal && t.allStacks?.[pid]){
      t.allStacks[pid].forEach((c, idx) => {
        const isFl = idx >= unflipped;
        discs.push(`<span class="disc ${c} ${isFl?"":"dim"}" style="--ty:${(-idx * 4.5).toFixed(1)}px">${c==="fox"?"🦊":"🌸"}</span>`);
      });
    } else {
      for(let k = 0; k < unflipped; k++){
        discs.push(`<span class="disc back" style="--ty:${(-k * 4.5).toFixed(1)}px">${k === unflipped - 1 ? "✦" : ""}</span>`);
      }
      fl.forEach((c, idx) => {
        const layer = unflipped + idx;
        const fresh = freshFlips[pid] === idx;
        discs.push(`<span class="disc ${c} ${fresh?"flipped-fresh":""}" style="--ty:${(-layer * 4.5).toFixed(1)}px">${c==="fox"?"🦊":"🌸"}</span>`);
      });
    }
    const tag = canFlip ? `button type="button" data-flip="${esc(pid)}"` : "div";
    const endTag = canFlip ? "button" : "div";
    spotHtml.push(`<${tag} class="c-spot ${canFlip?"pickable":""}" data-spot="${esc(pid)}" style="left:${cx.toFixed(2)}%;top:${cy.toFixed(2)}%" ${canFlip?`aria-label="Flip ${esc(P(pid).name)}'s top coaster"`:""}>
      <span class="pad"></span>${discs.join("")}
      ${stkN > 1 ? `<span class="stk-badge">${stkN}</span>` : ""}
      ${canFlip ? '<span class="tap-lbl">Flip!</span>' : ""}
    </${endTag}>`);
  });

  // Hand & Bid Controls
  let controls = "";
  if(mine && ph !== "final" && ph !== "roundover"){
    const canPlace = (ph === "place" && !mine.placed) || (ph === "turn" && isTurn);
    const canBid = (ph === "turn" || ph === "bid") && isTurn && t.totalPlaced > t.bid;
    const nums = [];
    for(let n = t.bid + 1; n <= t.totalPlaced; n++) nums.push(n);
    controls = `<div class="hand-bar">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
        <b>Your hand (${mine.hand.length})</b>
        ${mine.myStack.length ? `<span class="hint">Your stack (bottom &rarr; top): ${mine.myStack.map(c=>c==="fox"?"🦊":"🌸").join(" ")}</span>` : '<span class="hint">Tap a coaster to place face-down</span>'}
      </div>
      <div class="coasters">${mine.hand.length ? mine.hand.map(c=>`<button type="button" class="coaster-btn ${c}" data-place="${c}" ${canPlace?"":"disabled"} title="${c==="fox"?"Cursed Fox Mask (trap)":"Sakura Blossom (safe)"}">${c==="fox"?"🦊":"🌸"}</button>`).join("") : '<span class="hint">All your coasters are stacked on the table!</span>'}</div>
      ${canBid ? `<div><p class="hint" style="text-align:center;margin-bottom:8px">Or bid how many safe blossoms you can flip:</p>
        <div class="bid-nums">${nums.map(n=>`<button type="button" data-bid="${n}">${n}</button>`).join("")}
        ${ph==="bid" && !isChal ? '<button type="button" class="btn small" data-pass="1" style="border-color:var(--danger);color:var(--danger)">Pass</button>' : ""}</div></div>`
        : (ph==="bid" && isTurn && !isChal ? '<div style="display:flex;justify-content:center"><button type="button" class="btn" data-pass="1">Pass</button></div>' : "")}
    </div>`;
  }

  const arenaCls = boom ? "ph-boom" : ph === "bid" ? "ph-bid" : ph === "flip" ? "ph-flip" : "";
  $("#stage").innerHTML = `
    <div class="b-arena ${arenaCls}" id="bluffArena">
      <div class="b-felt"><span class="b-halo"></span></div>
      <span class="b-spot" id="bSpot"></span>
      <div class="b-center">${medHtml}</div>
      ${spotHtml.join("")}
      ${seatHtml.join("")}
    </div>
    <div class="status-pill ${statusCls}">${statusText}</div>
    <p class="logline">${esc(lastLog)}</p>
    ${controls}`;

  aimBluffSpot(true);
  runBluffFx();
}

function aimBluffSpot(animate){
  const spot = $("#bSpot"), arena = $("#bluffArena"), s = document.querySelector(".b-seat.turn .av");
  if(!spot || !arena) return;
  if(!s){ spot.style.opacity = 0; return; }
  spot.style.opacity = 1;
  const A = arena.getBoundingClientRect(), S = s.getBoundingClientRect();
  const dx = S.left + S.width/2 - (A.left + A.width/2), dy = S.top + S.height/2 - (A.top + A.height/2);
  const ang = Math.atan2(dy, dx) * 180 / Math.PI, len = Math.max(0, Math.hypot(dx, dy) - S.width * .55);
  const from = spotAngle ?? ang, to = from + (((ang - from) % 360) + 540) % 360 - 180;
  spot.style.transition = "none";
  spot.style.transform = `rotate(${from}deg)`; spot.style.width = (spotLen || len) + "px";
  if(animate){ spot.offsetWidth; spot.style.transition = ""; }
  spot.style.transform = `rotate(${to}deg)`; spot.style.width = len + "px";
  spotAngle = to; spotLen = len;
}
addEventListener("resize", () => aimBluffSpot(false));

function runBluffFx(){
  if(calm) return;
  // Fly newly placed coasters from player seat onto their coaster spot!
  const flyList = pendingFly.splice(0);
  flyList.forEach(pid => {
    const fromEl = document.querySelector(`[data-seat="${CSS.escape(pid)}"] .av`);
    const toEl = document.querySelector(`[data-spot="${CSS.escape(pid)}"]`);
    if(!fromEl || !toEl) return;
    const F = fromEl.getBoundingClientRect(), T = toEl.getBoundingClientRect();
    const d = document.createElement("div");
    d.className = "fly-disc disc back";
    d.textContent = "✦";
    d.style.cssText = `width:${T.width}px;height:${T.height}px;left:${T.left}px;top:${T.top}px`;
    document.body.appendChild(d);
    const dx = (F.left + F.width/2) - (T.left + T.width/2), dy = (F.top + F.height/2) - (T.top + T.height/2);
    d.animate([
      {transform:`translate(${dx}px,${dy}px) scale(.55) rotate(-40deg)`, opacity:0},
      {opacity:1, offset:.12},
      {transform:`translate(${dx*.45}px,${dy*.45 - 32}px) scale(1.12) rotate(12deg)`, offset:.55},
      {transform:"translate(0,0) scale(1) rotate(0deg)", opacity:1}
    ], {duration:400, easing:"cubic-bezier(.2,.85,.3,1)"}).onfinish = () => d.remove();
  });
  // Burst neon ring on freshly flipped coaster!
  Object.keys(freshFlips).forEach(pid => {
    const sp = document.querySelector(`[data-spot="${CSS.escape(pid)}"]`);
    if(!sp) return;
    const r = sp.getBoundingClientRect();
    const card = room.table?.flipped?.[pid]?.[freshFlips[pid]];
    window.Juice?.burst(r.left + r.width/2, r.top + r.height/2, card === "fox" ? "#FF2E4D" : "#FF85B3");
    if(card === "fox"){
      const f = document.querySelector(".b-felt");
      if(f){ const w = document.createElement("i"); w.className = "b-wave"; f.appendChild(w); setTimeout(()=>w.remove(), 740); }
    }
  });
}

document.addEventListener("click", async e=>{
  const pl = e.target.closest("[data-place]");
  if(pl && !pl.disabled){ try{ await act("place",{card:pl.dataset.place}); buzz(25); }catch(err){ toast(err.message); } return; }
  const bd = e.target.closest("[data-bid]");
  if(bd){ try{ await act("bid",{val:+bd.dataset.bid}); buzz(30); }catch(err){ toast(err.message); } return; }
  if(e.target.closest("[data-pass]")){ try{ await act("pass"); buzz(20); }catch(err){ toast(err.message); } return; }
  const fl = e.target.closest("[data-flip]");
  if(fl){ try{ await act("flip",{target:fl.dataset.flip}); buzz(40); }catch(err){ toast(err.message); } return; }
  const h = e.target.closest("[data-host]");
  if(h){ try{ await act(h.dataset.host); }catch(err){ toast(err.message); } }
});

function renderHostbar(){
  const bar = $("#hostbar"), ph = room?.phase;
  if(!hostKey || !room || !me || !room.players[me.pid]){ bar.hidden = true; return; }
  const b = [];
  if(["place","turn","bid","flip"].includes(ph)) b.push('<button class="btn small" data-host="skip">Skip stuck turn</button>');
  if(ph === "roundover") b.push('<button class="btn primary" data-host="next">Next round</button>');
  if(ph === "final") b.push('<button class="btn primary" data-host="playagain">Play again</button>');
  bar.hidden = !b.length; bar.innerHTML = b.join("");
}
$("#hCode").onclick = async ()=>{ if(!code) return; const l=location.origin+"/bluff?room="+code; try{ await navigator.clipboard.writeText(l); toast(`Invite link copied · ${code}`); }catch(e){ toast(l); } };
function tickTimer(){
  const el = $("#timer"); if(!room || !room.deadline){ el.hidden = true; return; }
  const left = Math.max(0, Math.ceil(room.deadline - serverNow()));
  el.hidden = false; el.textContent = `${left}s`; el.classList.toggle("low", left <= 5);
  const ring = document.querySelector(".b-seat.turn .tring");
  if(ring && room.settings?.turnSec){
    const p = Math.max(0, Math.min(1, (room.deadline - serverNow()) / room.settings.turnSec));
    ring.style.setProperty("--p", p.toFixed(3));
  }
}
setInterval(tickTimer, 120);
const c0 = (new URLSearchParams(location.search).get("room")||"").toUpperCase();
if(c0) openRoom(c0); else home();
</script>
