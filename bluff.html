<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1B1F4B">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Game Night">
<title>Fox's Bluff</title>
<link rel="stylesheet" href="/festival.css">
<style>
:root{
  --cloth:#B53535; --on-cloth:#F3EBDD;
  --line2:var(--line-2); --glass:color-mix(in srgb,var(--night-2) 92%,transparent);
  --glass2:rgba(243,235,221,.07); --amber:var(--gold); --mint:var(--shrine);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;overflow-x:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.muted{color:var(--muted)}
.noren{background:var(--cloth);color:var(--on-cloth)}
.noren .th-btn,.noren .iconbtn,.noren .rb-btn{border-color:rgba(243,235,221,.35)}
.code{font-weight:700;font-size:14px;letter-spacing:.16em;border:1.5px solid currentColor;border-radius:999px;padding:1px 10px;opacity:.9}
.timer{font-weight:700;font-size:16px;font-variant-numeric:tabular-nums;border-radius:999px;padding:3px 12px;background:var(--ink);color:var(--paper)}
.timer.low{background:var(--lantern);color:var(--on-lantern);animation:beat 1s infinite}
@keyframes beat{50%{transform:scale(1.07)}}

.stage{width:min(820px,100%);margin:0 auto;padding:8px max(14px,env(safe-area-inset-left,0px)) calc(120px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-right,0px))}
.eyebrow{text-align:center;font-size:15px;font-weight:700;color:var(--amber)}
.title{font-size:clamp(30px,7.5vw,50px);line-height:1.08;text-align:center;margin-top:4px}
.sub{text-align:center;color:var(--muted);margin:8px auto 0;max-width:54ch}
.panel{background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:14px;backdrop-filter:blur(10px)}
.panel h2{font-size:24px}
.btn{border:1px solid var(--line2);background:var(--glass2);border-radius:999px;padding:11px 20px;font-weight:700;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.primary{background:var(--lantern);border-color:var(--lantern);color:var(--on-lantern)}
.btn.small{padding:6px 13px;font-size:13px}
.btn.wide{width:100%}
label{display:block;font-size:14px;font-weight:700;color:var(--muted);margin-bottom:6px}
input[type=text],select{width:100%;background:var(--night);border:1px solid var(--line);border-radius:10px;padding:11px 13px;outline:none;color:var(--fg);font-size:16px}
select option{background:var(--night)}
.err{color:var(--danger);font-size:14px;min-height:1.3em}
.hint{font-size:13px;color:var(--muted);margin:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:540px){.row2{grid-template-columns:1fr}}

.face{width:44px;height:44px;border-radius:50%;overflow:hidden;display:grid;place-items:center;font-weight:900;color:var(--ink);flex:none}
.face img,.mini img{width:100%;height:100%;object-fit:cover;object-position:50% 20%;display:block}
.mini{width:24px;height:24px;border-radius:50%;overflow:hidden;display:inline-grid;place-items:center;font-size:11px;font-weight:900;color:var(--ink);border:1.5px solid var(--night);flex:none}
.photo-pick{display:flex;align-items:center;gap:14px}
.photo-pick .face{width:64px;height:64px;border:3px dashed var(--line2);background:rgba(0,0,0,.3);font-size:12px;color:var(--muted)}
.ring{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px;margin-top:12px}
.tok{display:grid;justify-items:center;gap:4px}
.tok .face{width:62px;height:62px;border:3px solid rgba(255,255,255,.18);font-size:22px}
.tok .nm{font-weight:800;font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* velvet table of coaster mats */
.mat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin:14px 0}
.mat{position:relative;border:2px solid var(--line);background:radial-gradient(circle at 50% 35%,rgba(181,53,53,.28),rgba(20,16,38,.9));border-radius:18px;padding:12px;display:grid;gap:8px;justify-items:center;text-align:center;transition:transform .15s,border-color .2s,box-shadow .2s}
.mat.turn{border-color:var(--amber);box-shadow:0 0 26px -6px var(--amber)}
.mat.pickable{cursor:pointer;border-color:#4ADE80;box-shadow:0 0 22px -6px #4ADE80}
.mat.pickable:hover{transform:translateY(-4px)}
.mat.out{opacity:.42;filter:grayscale(.7)}
.mat.passed{opacity:.72}
.mat .who{display:flex;align-items:center;gap:7px;font-weight:800;font-size:14px;max-width:100%}
.mat .who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mat .pts{font-size:13px;color:var(--amber);font-weight:900}
.stack-visual{display:flex;align-items:center;justify-content:center;gap:6px;min-height:66px;flex-wrap:wrap}
.disc{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:26px;font-weight:900;box-shadow:0 8px 18px -6px #000;border:3px solid rgba(255,255,255,.2);animation:pop .3s cubic-bezier(.2,1.5,.4,1) backwards}
@keyframes pop{from{transform:scale(.4) rotate(-20deg);opacity:0}}
.disc.back{background:radial-gradient(circle at 35% 30%,#433776,#1E1A2E);border-color:var(--amber);color:var(--amber);font-size:16px}
.disc.flower{background:radial-gradient(circle at 35% 30%,#FFE3EC,#F48FB1);border-color:#fff}
.disc.fox{background:radial-gradient(circle at 35% 30%,#FF6B6B,#8E1B1B);border-color:#FFD166;animation:shake .5s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-4px)}}

.bid-banner{background:var(--paper);color:var(--ink);border-radius:16px;padding:12px 16px;text-align:center;margin:10px auto;max-width:540px;box-shadow:0 16px 36px -16px #000}
.bid-banner b{font-family:var(--display);font-size:26px;display:block}
.hand-bar{background:var(--glass);border:1.5px solid var(--line2);border-radius:18px;padding:14px;display:grid;gap:12px;margin-top:12px}
.coasters{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.coaster-btn{width:76px;height:76px;border-radius:50%;border:3px solid rgba(255,255,255,.35);display:grid;place-items:center;font-size:34px;box-shadow:0 12px 24px -10px #000;transition:transform .15s}
.coaster-btn:hover:not(:disabled){transform:translateY(-6px) scale(1.06)}
.coaster-btn.flower{background:radial-gradient(circle at 35% 30%,#FFE3EC,#F48FB1)}
.coaster-btn.fox{background:radial-gradient(circle at 35% 30%,#FF6B6B,#8E1B1B);border-color:var(--amber)}
.coaster-btn:disabled{opacity:.38;cursor:not-allowed}
.bid-nums{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.bid-nums button{min-width:44px;height:42px;border-radius:12px;border:1.5px solid var(--line2);background:rgba(0,0,0,.3);font-weight:900;font-size:16px}
.bid-nums button:hover{border-color:var(--amber);background:rgba(217,164,65,.2)}
.logline{text-align:center;font-size:14px;color:var(--muted);min-height:1.4em;margin-top:6px}
.fadeup{animation:fadeup .4s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes fadeup{from{opacity:0;transform:translateY(14px)}}
.hostbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;gap:10px;flex-wrap:wrap;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:var(--night-2);border-top:3px solid var(--gold)}
body.has-hostbar{--chat-lift:66px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:60;background:var(--paper);color:var(--ink);font-weight:700;border-radius:999px;padding:10px 18px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
</style>
</head>
<body>
<header class="top noren">
  <a class="noren-back" href="/" aria-label="Back to all games">&larr; Festival</a>
  <h1>Fox's Bluff</h1>
  <button type="button" class="code" id="hCode" title="Copy invite link" aria-label="Copy invite link" hidden></button>
  <span class="spacer"></span>
  <span class="timer" id="timer" hidden></span>
</header>
<main class="stage" id="stage"></main>
<div class="hostbar" id="hostbar" hidden></div>
<div class="toast" id="toast" hidden></div>

<script src="/avatars.js"></script>
<script src="/backguard.js"></script>
<script src="/theme.js"></script>
<script src="/chat.js"></script>
<script src="/pranks.js"></script>
<script src="/roombar.js"></script>
<script src="/howto.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hue = n => { let h=0; for(const c of String(n)) h=(h*31+c.charCodeAt(0))%360; return `hsl(${h} 70% 72%)`; };
function store(k, v){ try{ if(v===undefined) return JSON.parse(localStorage.getItem(k)); localStorage.setItem(k, JSON.stringify(v)); }catch(e){ return null; } }
function toast(m){ const t=$("#toast"); t.textContent=m; t.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>t.hidden=true,2600); }
const buzz = p => { try{ if(navigator.vibrate && navigator.userActivation?.hasBeenActive) navigator.vibrate(p); }catch(e){} };
async function api(path, body){
  const r = await fetch(path, body ? {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)} : {});
  const j = await r.json().catch(()=>({error:"The server didn't answer. Try again."}));
  if(!r.ok) throw new Error(j.error || "Something went wrong");
  return j;
}

let code=null, room=null, me=null, hostKey=null, pollGen=0, clockOffset=0;
const serverNow = () => Date.now()/1000 + clockOffset;
const act = (a, extra={}) => api(`/api/rooms/${code}/${a}`, {hostKey, ...(me||{}), ...extra});
Chat.mount({act});
Pranks.mount({act});
RoomBar.mount({act, game:"bluff", onHostChange:(hk, became)=>{ hostKey = hk; if(became) toast("You are now the host!"); if(room) render(); }});
const P = pid => room.players[pid] || {name:"Someone"};
const picOf = p => { const s = Avatars.src(p); return s ? `<img src="${esc(s)}" alt="">` : esc((p.name||"?")[0].toUpperCase()); };
const face = (pid, cls="mini") => `<span class="${cls}" data-pid="${esc(pid)}" style="background:${hue(P(pid).name)}">${picOf(P(pid))}</span>`;

function home(){
  $("#hCode").hidden = true; $("#timer").hidden = true; $("#hostbar").hidden = true;
  document.body.classList.remove("has-hostbar");
  $("#stage").innerHTML = `<div class="fadeup" style="margin-top:3vh"><div class="eyebrow">The Coaster Bluffing Stall</div><h1 class="title">Fox's Bluff</h1>
    <p class="sub">3 Sakura Blossoms, 1 Cursed Fox Trap. Stack coasters face-down, bluff your friends into bidding too high, and survive the flips!</p></div>
    <div class="row2 fadeup" style="margin-top:20px">
      <form class="panel" id="createForm"><h2>Host a table</h2>
        <div><label for="cName">Your name</label><input type="text" id="cName" maxlength="24" autocomplete="nickname"></div>
        <div class="err" id="cErr"></div><button class="btn primary wide">Create room</button></form>
      <form class="panel" id="joinForm"><h2>Join with a code</h2>
        <div><label for="jCode">Room code</label><input type="text" id="jCode" maxlength="6" autocomplete="off" style="text-transform:uppercase;letter-spacing:.15em"></div>
        <div><label for="jName">Your name</label><input type="text" id="jName" maxlength="24" autocomplete="nickname"></div>
        <div class="err" id="jErr"></div><button class="btn wide">Join</button></form>
    </div><div class="fadeup">${HowTo.button("bluff")}</div>`;
  $("#createForm").onsubmit = async e=>{ e.preventDefault(); const n=$("#cName").value.trim(); if(!n) return $("#cErr").textContent="Enter your name.";
    try{ const r=await api("/api/rooms",{game:"bluff",title:"Fox's Bluff"}); const m=await api(`/api/rooms/${r.code}/join`,{name:n}); store("fb2:"+r.code,{me:m,hostKey:r.hostKey}); history.replaceState({},"","/bluff?room="+r.code); openRoom(r.code); }catch(err){ $("#cErr").textContent=err.message; } };
  $("#joinForm").onsubmit = async e=>{ e.preventDefault(); const c=$("#jCode").value.trim().toUpperCase(), n=$("#jName").value.trim(); if(!c||!n) return $("#jErr").textContent="Enter code and name.";
    try{ const m=await api(`/api/rooms/${c}/join`,{name:n}); store("fb2:"+c,{me:m,hostKey:null}); history.replaceState({},"","/bluff?room="+c); openRoom(c); }catch(err){ $("#jErr").textContent=err.message; } };
}
function openRoom(c){
  code=c; const s=store("fb2:"+c)||{}; me=s.me||null; hostKey=s.hostKey||null;
  $("#hCode").textContent=c; $("#hCode").hidden=false; BackGuard.arm(); poll(++pollGen,-1);
}
async function poll(gen, v){
  while(gen === pollGen){
    try{
      const who = (me ? `&pid=${me.pid}&key=${me.key}` : "") + (hostKey ? `&hk=${hostKey}` : "");
      const next = await api(`/api/rooms/${code}?v=${v}${who}`);
      if(gen !== pollGen) return;
      const prev = room; room = next; v = room.version; clockOffset = room.now - Date.now()/1000;
      if(me && !room.players[me.pid]){ me = null; if(!room.roomMeta?.isHost) hostKey = null; store("fb2:"+code, {hostKey}); toast("You were removed from this game"); }
      if(me && room.players[me.pid]) Avatars.apply(act, room.players[me.pid]);
      if(!Chat.socialOnly(prev, room)) render();
      Chat.update(room, me); Pranks.update(room, me); RoomBar.update(room, me, hostKey);
    }catch(e){ if(e.message.includes("not found")){ toast("Room not found"); return home(); } await new Promise(r=>setTimeout(r,2000)); }
  }
}

function render(){
  renderHostbar();
  document.body.classList.toggle("has-hostbar", !$("#hostbar").hidden);
  if(!me || !room.players[me.pid]) return gate();
  if(room.phase === "lobby") lobby();
  else tableView();
  tickTimer();
}
function gate(){
  if($("#gate")) return;
  $("#stage").innerHTML=`<form class="panel fadeup" id="gate" style="margin-top:8vh"><h2 style="text-align:center">Join Fox's Bluff</h2>
    <input type="text" id="gName" placeholder="Your name" maxlength="24" autocomplete="nickname"><div class="err" id="gErr"></div><button class="btn primary wide">Sit at the mat</button></form>`;
  $("#gate").onsubmit = async e=>{ e.preventDefault(); const n=$("#gName").value.trim(); if(!n) return;
    try{ me=await api(`/api/rooms/${code}/join`,{name:n}); store("fb2:"+code,{me,hostKey}); poll(++pollGen,-1); }catch(err){ $("#gErr").textContent=err.message; } };
}
function lobby(){
  const s=room.settings, ps=Object.keys(room.players), mine=P(me.pid), H=!!hostKey;
  const sel=(id,opts,val)=>`<select id="${id}" ${H?"":"disabled"}>${opts.map(([v,t])=>`<option value="${v}" ${String(v)===String(val)?"selected":""}>${t}</option>`).join("")}</select>`;
  $("#stage").innerHTML=`<div class="fadeup"><h1 class="title">${ps.length} player${ps.length===1?"":"s"}</h1>
    <p class="sub">Share code <b style="letter-spacing:.2em;color:var(--amber)">${room.code}</b>. 2 to 8 players.</p></div>
    <div class="panel" style="margin-top:14px"><div class="photo-pick"><button class="face" id="photoBtn" type="button">${Avatars.src(mine)?picOf(mine):"Choose"}</button>
      <div><b>${esc(mine.name)}</b><p class="hint">Tap to change your avatar.</p></div></div></div>
    <div class="ring">${ps.map(pid=>`<div class="tok">${face(pid,"face")}<span class="nm">${esc(P(pid).name)}</span></div>`).join("")}</div>
    <div class="panel" style="margin-top:16px"><h2>${H?"Table rules":"Rules"}</h2>
      <div class="row2">
        <div><label for="sGoal">Points to win</label>${sel("sGoal",[[1,"1 point (turbo)"],[2,"2 points (classic)"],[3,"3 points"]], s.goal)}</div>
        <div><label for="sSec">Turn timer</label>${sel("sSec",[[0,"No timer"],[20,"20s"],[25,"25s"],[40,"40s"]], s.turnSec)}</div>
      </div>
      ${H ? `<button class="btn primary wide" data-host="start" ${ps.length<2?"disabled":""}>${ps.length<2?"Need 1 more player":"Deal the coasters"}</button>` : '<p class="hint" style="text-align:center">Waiting for host to deal.</p>'}
    </div>${HowTo.button("bluff")}`;
  $("#photoBtn").onclick = ()=>Avatars.open(act);
  if(H){
    const send = x => act("settings", x).catch(err=>toast(err.message));
    $("#sGoal").onchange=e=>send({goal:+e.target.value}); $("#sSec").onchange=e=>send({turnSec:+e.target.value});
  }
}

function tableView(){
  const t = room.table, mine = room.me, ph = room.phase;
  const isTurn = t.turn === me.pid, isChal = t.bidder === me.pid;
  const lastLog = (t.log || []).slice(-1)[0]?.text || "";
  let headline = "";
  if(ph === "final") headline = `${P(t.winner).name} wins Fox's Bluff!`;
  else if(ph === "place") headline = mine && !mine.placed ? "Place 1 coaster face-down" : "Waiting for everyone to place…";
  else if(ph === "turn") headline = isTurn ? "Stack a coaster, or start bidding!" : `${P(t.turn).name}'s turn`;
  else if(ph === "bid") headline = isTurn ? `Raise above ${t.bid} or Pass!` : `${P(t.turn).name} is deciding…`;
  else if(ph === "flip") headline = isChal ? (mine.ownUnflipped > 0 ? "Flip your own stack first!" : `Flip ${t.bid - t.flippedSafe} more safe blossom${t.bid - t.flippedSafe===1?"":"s"}!`) : `${P(t.bidder).name} is flipping…`;
  else headline = t.outcome?.win ? `${P(t.outcome.challenger).name} nailed it! +1 pt` : `BOOM! ${P(t.outcome?.challenger).name} hit a Fox!`;

  const mats = t.order.map(pid=>{
    const deckN = t.deckCount[pid] || 0, stkN = t.stackCount[pid] || 0, fl = t.flipped[pid] || [];
    const unflipped = Math.max(0, stkN - fl.length);
    const canFlip = ph === "flip" && isChal && unflipped > 0 && ((mine?.ownUnflipped || 0) === 0 || pid === me.pid);
    const showReal = ph === "roundover" || ph === "final";
    const discs = [];
    fl.forEach(c => discs.push(`<span class="disc ${c}">${c==="fox"?"🦊":"🌸"}</span>`));
    if(showReal && t.allStacks?.[pid]){
      t.allStacks[pid].slice(0, unflipped).reverse().forEach(c => discs.push(`<span class="disc ${c}" style="opacity:.65">${c==="fox"?"🦊":"🌸"}</span>`));
    } else {
      for(let i=0;i<unflipped;i++) discs.push(`<span class="disc back">${pid===me.pid?"?":""}</span>`);
    }
    const pts = "⭐".repeat(t.points[pid]||0) + "☆".repeat(Math.max(0, room.settings.goal - (t.points[pid]||0)));
    const tag = canFlip ? `button type="button" data-flip="${pid}"` : "div";
    const closeTag = canFlip ? "button" : "div";
    return `<${tag} class="mat ${t.turn===pid&&ph!=="place"&&ph!=="roundover"&&ph!=="final"?"turn":""} ${canFlip?"pickable":""} ${deckN===0?"out":""} ${t.passed.includes(pid)?"passed":""}">
      <div class="who">${face(pid,"mini")}<span>${esc(P(pid).name)}${pid===me.pid?" (you)":""}</span></div>
      <div class="pts">${pts} · ${deckN} coaster${deckN===1?"":"s"}</div>
      <div class="stack-visual">${discs.length ? discs.join("") : '<span class="hint">Empty mat</span>'}</div>
      ${t.passed.includes(pid) && ph==="bid" ? '<span class="hint">Passed</span>' : canFlip ? '<span style="color:#4ADE80;font-weight:800;font-size:12px">Tap to flip!</span>' : ""}
    </${closeTag}>`;
  }).join("");

  let controls = "";
  if(mine && ph !== "final" && ph !== "roundover"){
    const canPlace = (ph === "place" && !mine.placed) || (ph === "turn" && isTurn);
    const canBid = (ph === "turn" || ph === "bid") && isTurn && t.totalPlaced > t.bid;
    const nums = [];
    for(let n = t.bid + 1; n <= t.totalPlaced; n++) nums.push(n);
    controls = `<div class="hand-bar">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px"><b>Your coasters in hand (${mine.hand.length})</b>
        ${mine.myStack.length ? `<span class="hint">On your mat (bottom &rarr; top): ${mine.myStack.map(c=>c==="fox"?"🦊":"🌸").join(" ")}</span>` : ""}</div>
      <div class="coasters">${mine.hand.length ? mine.hand.map(c=>`<button type="button" class="coaster-btn ${c}" data-place="${c}" ${canPlace?"":"disabled"} title="${c==="fox"?"Cursed Fox Mask (trap)":"Sakura Blossom (safe)"}">${c==="fox"?"🦊":"🌸"}</button>`).join("") : '<span class="hint">All your coasters are on the table!</span>'}</div>
      ${canBid ? `<div><p class="hint" style="text-align:center;margin-bottom:8px">Or bid how many safe blossoms you can flip:</p>
        <div class="bid-nums">${nums.map(n=>`<button type="button" data-bid="${n}">${n}</button>`).join("")}
        ${ph==="bid" && !isChal ? '<button type="button" class="btn small" data-pass="1" style="border-color:var(--danger);color:var(--danger)">Pass</button>' : ""}</div></div>`
        : (ph==="bid" && isTurn && !isChal ? '<div style="display:flex;justify-content:center"><button type="button" class="btn" data-pass="1">Pass</button></div>' : "")}
    </div>`;
  }

  $("#stage").innerHTML = `<div class="fadeup">
    <div class="eyebrow">Round ${t.round} · Goal: ${room.settings.goal} point${room.settings.goal===1?"":"s"}</div>
    <h1 class="title">${esc(headline)}</h1>
    ${t.bid > 0 ? `<div class="bid-banner"><small>Current bid by ${esc(P(t.bidder).name)}</small><b>${t.bid} Safe Blossom${t.bid===1?"":"s"}${ph==="flip"?` (${t.flippedSafe}/${t.bid} flipped)`:""}</b></div>` : ""}
    <div class="mat-grid">${mats}</div>
    ${controls}
    <p class="logline">${esc(lastLog)}</p>
  </div>`;
}

document.addEventListener("click", async e=>{
  const pl = e.target.closest("[data-place]");
  if(pl && !pl.disabled){ try{ await act("place",{card:pl.dataset.place}); buzz(25); }catch(err){ toast(err.message); } return; }
  const bd = e.target.closest("[data-bid]");
  if(bd){ try{ await act("bid",{val:+bd.dataset.bid}); buzz(30); }catch(err){ toast(err.message); } return; }
  if(e.target.closest("[data-pass]")){ try{ await act("pass"); buzz(20); }catch(err){ toast(err.message); } return; }
  const fl = e.target.closest("[data-flip]");
  if(fl){ try{ await act("flip",{target:fl.dataset.flip}); buzz(40); }catch(err){ toast(err.message); } return; }
  const h = e.target.closest("[data-host]");
  if(h){ try{ await act(h.dataset.host); }catch(err){ toast(err.message); } }
});

function renderHostbar(){
  const bar = $("#hostbar"), ph = room?.phase;
  if(!hostKey || !room || !me || !room.players[me.pid]){ bar.hidden = true; return; }
  const b = [];
  if(["place","turn","bid","flip"].includes(ph)) b.push('<button class="btn small" data-host="skip">Skip stuck turn</button>');
  if(ph === "roundover") b.push('<button class="btn primary" data-host="next">Next round</button>');
  if(ph === "final") b.push('<button class="btn primary" data-host="playagain">Play again</button>');
  bar.hidden = !b.length; bar.innerHTML = b.join("");
}
$("#hCode").onclick = async ()=>{ if(!code) return; const l=location.origin+"/bluff?room="+code; try{ await navigator.clipboard.writeText(l); toast(`Invite link copied · ${code}`); }catch(e){ toast(l); } };
function tickTimer(){
  const el = $("#timer"); if(!room || !room.deadline){ el.hidden = true; return; }
  const left = Math.max(0, Math.ceil(room.deadline - serverNow()));
  el.hidden = false; el.textContent = `${left}s`; el.classList.toggle("low", left <= 5);
}
setInterval(tickTimer, 200);
const c0 = (new URLSearchParams(location.search).get("room")||"").toUpperCase();
if(c0) openRoom(c0); else home();
</script>
</body>
</html>
